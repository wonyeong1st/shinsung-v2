        </div>
      </div>
    `;

    document.getElementById('salesStartInp').onchange = (ev) => {
      state.salesQuickPeriod = 'custom';
      state.salesStart = ev.target.value;
      renderSalesTab();
    };
    document.getElementById('salesEndInp').onchange = (ev) => {
      state.salesQuickPeriod = 'custom';
      state.salesEnd = ev.target.value;
      renderSalesTab();
    };
  }

  // 거래처별 원장 · 세금계산서 마감 집계 뷰
  function renderClientLedgerTabView() {
    const y = state.ledgerYear;
    const m = state.ledgerMonth;
    const filter = state.ledgerClosingFilter;
    const kw = (state.ledgerSearch || '').trim().toLowerCase();

    const ledgerEntries = [];
    const registeredIds = new Set();

    state.clients.forEach(c => {
      registeredIds.add(c.id);
      const closing = c.closingDay || 'none';
      const range = getBillingCycleRange(closing, y, m);
      const cycleRecs = state.deliveryRecords.filter(
        r => r.clientId === c.id && r.date >= range.start && r.date <= range.end
      );
      const allUnpaid = state.deliveryRecords
        .filter(r => r.clientId === c.id)
        .reduce((acc, r) => acc + getRecordUnpaidAmount(r), 0);
      const cycleSales = cycleRecs.reduce((acc, r) => acc + num(r.totalAmount), 0);
      const cycleQty189 = cycleRecs.reduce((acc, r) => acc + num(r.qty189), 0);

      ledgerEntries.push({
        isOneTime: false,
        clientId: c.id,
        clientName: c.name,
        closingDay: closing,
        closingBadge: formatClientClosingBadge(c) || '마감미지정',
        paymentType: c.paymentType || '미지정',
        range,
        cycleCount: cycleRecs.length,
        cycleSales,
        cycleQty189,
        allUnpaid
      });
    });

    const oneTimeMap = new Map();
    state.deliveryRecords.forEach(r => {
      if (r.clientId && registeredIds.has(r.clientId)) return;
      const name = r.clientName || '기타 배송지';
      if (!oneTimeMap.has(name)) oneTimeMap.set(name, []);
      oneTimeMap.get(name).push(r);
    });
    const defaultRange = getBillingCycleRange('eom', y, m);
    oneTimeMap.forEach((recs, name) => {
      const cycleRecs = recs.filter(r => r.date >= defaultRange.start && r.date <= defaultRange.end);
      const allUnpaid = recs.reduce((acc, r) => acc + getRecordUnpaidAmount(r), 0);
      const cycleSales = cycleRecs.reduce((acc, r) => acc + num(r.totalAmount), 0);
      const cycleQty189 = cycleRecs.reduce((acc, r) => acc + num(r.qty189), 0);
      ledgerEntries.push({
        isOneTime: true,
        clientId: null,
        clientName: name,
        closingDay: 'none',
        closingBadge: '1회성(미등록)',
        paymentType: recs[0]?.paymentType || '현금',
        range: defaultRange,
        cycleCount: cycleRecs.length,
        cycleSales,
        cycleQty189,
        allUnpaid
      });
    });

    const filtered = ledgerEntries.filter(item => {
      if (filter === 'eom' && item.closingDay !== 'eom') return false;
      if (filter === '25' && item.closingDay !== '25') return false;
      if (filter === 'other' && (!item.closingDay || item.closingDay === 'none' || item.closingDay === 'eom' || item.closingDay === '25')) return false;
      if (filter === 'unpaid' && item.allUnpaid <= 0) return false;
      if (kw) {
        const matchName = (item.clientName || '').toLowerCase().includes(kw) || getChosung(item.clientName || '').toLowerCase().includes(kw);
        if (!matchName) return false;
      }
      return true;
    });

    filtered.sort((a, b) => {
      const aActive = a.cycleSales > 0 ? 1 : 0;
      const bActive = b.cycleSales > 0 ? 1 : 0;
      if (aActive !== bActive) return bActive - aActive;
      if (a.cycleSales !== b.cycleSales) return b.cycleSales - a.cycleSales;
      if (a.allUnpaid !== b.allUnpaid) return b.allUnpaid - a.allUnpaid;
      return (a.clientName || '').localeCompare(b.clientName || '');
    });

    const filteredCycleSum = filtered.reduce((acc, x) => acc + x.cycleSales, 0);
    const filteredSupplySum = Math.round(filteredCycleSum / 1.1);
    const filteredVatSum = filteredCycleSum - filteredSupplySum;

    const area = document.getElementById('salesContentArea');
    area.innerHTML = `
      <div class="space-y-3">
        <!-- 마감 기준월 선택 & 필터 -->
        <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm p-3 space-y-2.5">
          <div class="flex items-center justify-between gap-2">
            <button type="button" onclick="shiftLedgerMonth(-1)" class="w-9 h-9 rounded-xl bg-slate-100 text-slate-700 font-extrabold text-sm active:scale-90">◀</button>
            <div class="text-center">
              <div class="text-sm font-extrabold text-slate-900">${y}년 ${m + 1}월 마감 기준</div>
              <div class="text-[11px] text-slate-400">거래처별 설정된 마감일(25일·말일 등)로 자동 집계됩니다</div>
            </div>
            <button type="button" onclick="shiftLedgerMonth(1)" class="w-9 h-9 rounded-xl bg-slate-100 text-slate-700 font-extrabold text-sm active:scale-90">▶</button>
          </div>

          <div class="flex flex-wrap gap-1.5">
            ${[
              { k: 'all', l: '전체 거래처' },
              { k: '25', l: '📅 25일마감' },
              { k: 'eom', l: '📅 말일마감' },
              { k: 'other', l: '기타마감' },
              { k: 'unpaid', l: '⏳ 미수보유' }
            ].map(f => `
              <button type="button" onclick="setLedgerClosingFilter('${f.k}')" class="px-2.5 py-1.5 rounded-full text-xs font-extrabold transition ${
                filter === f.k ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-600'
              }">${f.l}</button>
            `).join('')}
          </div>

          <input type="text" id="ledgerSearchInp" value="${escapeHtml(state.ledgerSearch)}" oninput="onLedgerSearchInput(this.value)" placeholder="🔍 거래처명 또는 초성(ㅎㅂ) 검색" class="w-full px-3 py-2 bg-slate-100 border border-slate-200 rounded-xl text-xs font-semibold outline-none focus:bg-white focus:border-indigo-500" />
        </div>

        <!-- 선택 조건 세금계산서 마감 합계 요약 -->
        <div class="bg-slate-900 text-white rounded-2xl p-3.5 shadow-sm space-y-2">
          <div class="flex items-center justify-between text-xs">
            <span class="text-slate-300 font-bold">조회된 거래처 (${filtered.length}곳) 마감 합계</span>
            <span class="text-base font-extrabold text-emerald-400">${money(filteredCycleSum)}</span>
          </div>
          <div class="grid grid-cols-2 gap-2 pt-1.5 border-t border-white/10 text-[11px]">
            <div class="flex justify-between text-slate-300">
              <span>공급가액(부가세별도)</span>
              <strong class="text-white">${money(filteredSupplySum)}</strong>
            </div>
            <div class="flex justify-between text-slate-300">
              <span>부가세(10%)</span>
              <strong class="text-white">${money(filteredVatSum)}</strong>
            </div>
          </div>
        </div>

        <!-- 거래처별 원장 카드 리스트 -->
        <div class="space-y-2">
          ${filtered.length === 0 ? `
            <div class="bg-white rounded-2xl border border-dashed border-slate-300 p-8 text-center text-xs text-slate-400">
              조건에 해당하는 거래처가 없습니다.
            </div>
          ` : filtered.map(item => {
            const safeName = escapeJsAttr(item.clientName);
            const openCall = item.isOneTime
              ? `openClientStatementModal(null, '${safeName}', ${y}, ${m})`
              : `openClientStatementModal(${item.clientId}, '${safeName}', ${y}, ${m})`;
            return `
              <div onclick="${openCall}" class="cursor-pointer bg-white rounded-2xl border border-slate-200/90 shadow-sm p-3.5 space-y-2 active:scale-[0.99] transition">
                <div class="flex items-start justify-between gap-2">
                  <div class="min-w-0">
                    <div class="flex items-center gap-1.5 flex-wrap">
                      <span class="text-sm font-extrabold text-slate-900 truncate">${escapeHtml(item.clientName)}</span>
                      <span class="px-2 py-0.5 rounded-md text-[10px] font-extrabold ${
                        item.closingDay === '25'
                          ? 'bg-purple-100 text-purple-800'
                          : (item.closingDay === 'eom' ? 'bg-indigo-100 text-indigo-800' : 'bg-slate-100 text-slate-600')
                      }">${escapeHtml(item.closingBadge)}</span>
                    </div>
                    <div class="text-[11px] text-slate-500 mt-1">
                      집계기간: <b>${item.range.start.slice(5)} ~ ${item.range.end.slice(5)}</b> · 납품 <b>${item.cycleCount}회</b> (18.9L ${item.cycleQty189}통)
                    </div>
                  </div>
                  <div class="text-right shrink-0">
                    <div class="text-sm font-extrabold ${item.cycleSales > 0 ? 'text-indigo-700' : 'text-slate-400'}">${money(item.cycleSales)}</div>
                    ${item.allUnpaid > 0 ? `<div class="text-[10px] font-extrabold text-rose-600 mt-0.5">누적미수 ${money(item.allUnpaid)}</div>` : ''}
                  </div>
                </div>
                <div class="flex items-center justify-between pt-2 border-t border-slate-100 text-[11px]">
                  <span class="text-slate-400">💳 ${escapeHtml(item.paymentType)}</span>
                  <span class="font-extrabold text-indigo-600">📄 날짜별 상세내역 · 계산서 보기 →</span>
                </div>
              </div>
            `;
          }).join('')}
        </div>
      </div>
    `;
  }

  function shiftLedgerMonth(delta) {
    let { ledgerYear, ledgerMonth } = state;
    ledgerMonth += delta;
    if (ledgerMonth < 0) { ledgerMonth = 11; ledgerYear--; }
    else if (ledgerMonth > 11) { ledgerMonth = 0; ledgerYear++; }
    state.ledgerYear = ledgerYear;
    state.ledgerMonth = ledgerMonth;
    renderSalesTab();
  }

  function setLedgerClosingFilter(f) {
    state.ledgerClosingFilter = f;
    renderSalesTab();
  }

  function onLedgerSearchInput(val) {
    state.ledgerSearch = val;
    renderClientLedgerTabView();
    const inp = document.getElementById('ledgerSearchInp');
    if (inp) {
      inp.focus();
      inp.setSelectionRange(val.length, val.length);
    }
  }

  // 거래처별 납품·거래 내역서 모달
  function openClientStatementModal(clientId, fallbackName = '', initYear = null, initMonth = null) {
    const client = clientId ? state.clients.find(c => c.id === clientId) : null;
    const cName = client ? client.name : (fallbackName || '거래처');
    const closingDay = client?.closingDay || 'none';
    const closingLabel = formatClientClosingBadge(client) || '말일(기본)';

    const baseDate = new Date();
    let cycleYear = initYear !== null ? initYear : baseDate.getFullYear();
    let cycleMonth = initMonth !== null ? initMonth : baseDate.getMonth();

    let range = getBillingCycleRange(closingDay, cycleYear, cycleMonth);
    let startStr = range.start;
    let endStr = range.end;
    let activePreset = 'currentCycle';

    const getAllClientRecords = () => state.deliveryRecords
      .filter(r => (clientId ? r.clientId === clientId : (!r.clientId && r.clientName === cName)))
      .sort((a, b) => (a.date !== b.date ? (a.date < b.date ? 1 : -1) : b.id - a.id));

    function renderStatementContent() {
      const allRecs = getAllClientRecords();
      const totalUnpaidAll = allRecs.reduce((acc, r) => acc + getRecordUnpaidAmount(r), 0);

      let filteredRecs = allRecs;
      if (activePreset === 'unpaidOnly') {
        filteredRecs = allRecs.filter(r => getRecordUnpaidAmount(r) > 0);
      } else if (activePreset !== 'all') {
        filteredRecs = allRecs.filter(r => r.date >= startStr && r.date <= endStr);
      }

      const displayRecs = [...filteredRecs].sort((a, b) => (a.date !== b.date ? (a.date < b.date ? -1 : 1) : a.id - b.id));

      const periodSales = displayRecs.reduce((acc, r) => acc + num(r.totalAmount), 0);
      const periodPaid = displayRecs.reduce((acc, r) => acc + getRecordPaidAmount(r), 0);
      const periodUnpaid = displayRecs.reduce((acc, r) => acc + getRecordUnpaidAmount(r), 0);
      const supplyPrice = Math.round(periodSales / 1.1);
      const vatPrice = periodSales - supplyPrice;

      const itemTotals = {};
      let totalEmptyReturned = 0;
      displayRecs.forEach(r => {
        if (num(r.qty189) > 0) {
          itemTotals['18.9L'] = (itemTotals['18.9L'] || 0) + num(r.qty189);
        }
        totalEmptyReturned += num(r.emptyReturned);
        (r.extraItems || []).forEach(ex => {
          itemTotals[ex.name] = (itemTotals[ex.name] || 0) + num(ex.qty);
        });
      });
      const itemSummaryText = Object.keys(itemTotals)
        .map(k => `${k} ${itemTotals[k].toLocaleString()}${k === '18.9L' ? '통' : '개'}`)
        .join(' · ') || '없음';

      const prevRange = getBillingCycleRange(closingDay, cycleMonth === 0 ? cycleYear - 1 : cycleYear, cycleMonth === 0 ? 11 : cycleMonth - 1);
      const curRange = getBillingCycleRange(closingDay, cycleYear, cycleMonth);

      openCustomModal(`
        <div class="bg-white rounded-2xl p-4 w-full max-w-md shadow-2xl border border-slate-200 space-y-3 max-h-[92vh] overflow-y-auto">
          <div class="flex items-start justify-between gap-2">
            <div class="min-w-0">
              <div class="flex items-center gap-1.5 flex-wrap">
                <span class="text-base font-extrabold text-slate-900 truncate">📜 ${escapeHtml(cName)}</span>
                <span class="px-2 py-0.5 rounded-full bg-purple-100 text-purple-800 text-[10px] font-extrabold">${escapeHtml(closingLabel)}</span>
              </div>
              <div class="text-[11px] text-slate-500 mt-0.5">
                ${client?.phone ? `📞 ${escapeHtml(client.phone)} · ` : ''}현재 총 누적 미수: <strong class="text-rose-600">${money(totalUnpaidAll)}</strong>
              </div>
            </div>
            <button type="button" onclick="closeCustomModal()" class="w-8 h-8 rounded-full bg-slate-100 text-slate-600 font-extrabold shrink-0">✕</button>
          </div>

          <div class="grid grid-cols-4 gap-1">
            <button type="button" id="stPresetCur" class="py-2 px-1 rounded-xl text-[11px] font-extrabold border transition ${
              activePreset === 'currentCycle' ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-slate-50 text-slate-700 border-slate-200'
            }">${cycleMonth + 1}월 마감분</button>
            <button type="button" id="stPresetPrev" class="py-2 px-1 rounded-xl text-[11px] font-extrabold border transition ${
              activePreset === 'prevCycle' ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-slate-50 text-slate-700 border-slate-200'
            }">${cycleMonth === 0 ? 12 : cycleMonth}월 마감분</button>
            <button type="button" id="stPresetUnpaid" class="py-2 px-1 rounded-xl text-[11px] font-extrabold border transition ${
              activePreset === 'unpaidOnly' ? 'bg-rose-600 text-white border-rose-600' : 'bg-rose-50 text-rose-700 border-rose-200'
            }">미수전표만</button>
            <button type="button" id="stPresetAll" class="py-2 px-1 rounded-xl text-[11px] font-extrabold border transition ${
              activePreset === 'all' ? 'bg-slate-800 text-white border-slate-800' : 'bg-slate-50 text-slate-700 border-slate-200'
            }">전체 내역</button>
          </div>

          <div class="grid grid-cols-2 gap-2">
            <input id="stDateStart" type="date" value="${startStr}" class="w-full border border-slate-200 px-2.5 py-1.5 rounded-xl bg-slate-50 text-xs font-bold" />
            <input id="stDateEnd" type="date" value="${endStr}" class="w-full border border-slate-200 px-2.5 py-1.5 rounded-xl bg-slate-50 text-xs font-bold" />
          </div>

          <div class="bg-slate-900 text-white rounded-2xl p-3.5 space-y-2">
            <div class="flex items-center justify-between">
              <span class="text-xs font-bold text-indigo-200">조회 합계 (${displayRecs.length}회 납품)</span>
              <span class="text-xl font-extrabold text-emerald-400">${money(periodSales)}</span>
            </div>
            <div class="grid grid-cols-2 gap-2 pt-1.5 border-t border-white/10 text-[11px]">
              <div class="bg-white/10 rounded-lg px-2.5 py-1.5 flex justify-between">
                <span class="text-slate-300">공급가액</span>
                <strong class="text-white">${money(supplyPrice)}</strong>
              </div>
              <div class="bg-white/10 rounded-lg px-2.5 py-1.5 flex justify-between">
                <span class="text-slate-300">부가세(10%)</span>
                <strong class="text-white">${money(vatPrice)}</strong>
              </div>
            </div>
            <div class="text-[11px] text-slate-300 pt-1 border-t border-white/10 flex flex-wrap justify-between gap-1">
              <span>📦 품목합계: <strong class="text-white">${escapeHtml(itemSummaryText)}</strong></span>
              <span>♻️ 빈통회수: <strong class="text-white">${totalEmptyReturned}개</strong></span>
            </div>
            <div class="text-[11px] flex justify-between text-slate-300">
              <span>기간 수금: <strong class="text-emerald-300">${money(periodPaid)}</strong></span>
              <span>기간 미수: <strong class="text-rose-300">${money(periodUnpaid)}</strong></span>
            </div>
          </div>

          <div class="space-y-1.5">
            <div class="flex items-center justify-between px-0.5">
              <span class="text-xs font-extrabold text-slate-800">🗓️ 날짜별 납품 상세 내역</span>
              <span class="text-[10px] text-slate-400">전표 터치 시 수정·수금관리</span>
            </div>

            ${displayRecs.length === 0 ? `
              <div class="bg-slate-50 border border-dashed border-slate-300 rounded-xl py-8 text-center text-xs text-slate-400">
                해당 기간에 납품된 내역이 없습니다.
              </div>
            ` : `
              <div class="border border-slate-200 rounded-xl overflow-hidden divide-y divide-slate-200 bg-white">
                ${displayRecs.map(r => {
                  const rem = getRecordUnpaidAmount(r);
                  const paidAmt = getRecordPaidAmount(r);
                  const isPartial = !r.paid && paidAmt > 0;
                  const lines = [];
                  if (num(r.qty189) > 0) {
                    lines.push(`18.9L <b>${num(r.qty189)}통</b> × ${num(r.price189).toLocaleString()}원`);
                  }
                  (r.extraItems || []).forEach(ex => {
                    lines.push(`${escapeHtml(ex.name)} <b>${num(ex.qty)}개</b> × ${num(ex.price).toLocaleString()}원`);
                  });
                  if (lines.length === 0 && num(r.emptyReturned) > 0) {
                    lines.push(`빈통만 회수 (${num(r.emptyReturned)}개)`);
                  }

                  return `
                    <div onclick="closeCustomModal(); openDeliveryRecordMenu(${r.id});" class="cursor-pointer p-2.5 hover:bg-slate-50 active:bg-slate-100 transition flex items-start justify-between gap-2">
                      <div class="min-w-0 flex-1">
                        <div class="flex items-center gap-1.5 flex-wrap">
                          <span class="text-xs font-extrabold text-slate-900">${formatKoreanDate(r.date)}</span>
                          <span class="text-[10px] text-slate-400">${r.date}</span>
                          ${num(r.emptyReturned) > 0 ? `<span class="px-1.5 py-0.2 rounded bg-slate-100 text-slate-600 text-[10px] font-bold">빈통 ${num(r.emptyReturned)}</span>` : ''}
                        </div>
                        <div class="text-xs text-slate-700 mt-0.5 leading-snug">${lines.join(' / ')}</div>
                        ${r.memo ? `<div class="text-[10px] text-slate-400 mt-0.5">📝 ${escapeHtml(r.memo)}</div>` : ''}
                      </div>
                      <div class="text-right shrink-0">
                        <div class="text-xs font-extrabold text-slate-900">${money(r.totalAmount)}</div>
                        <div class="mt-0.5">
                          <span class="px-1.5 py-0.5 rounded text-[10px] font-extrabold ${
                            r.paid
                              ? 'bg-emerald-100 text-emerald-800'
                              : (isPartial ? 'bg-amber-100 text-amber-900' : 'bg-rose-100 text-rose-700')
                          }">${r.paid ? '수금완료' : (isPartial ? `잔액 ${money(rem)}` : '미수금')}</span>
                        </div>
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            `}
          </div>

          <div class="grid grid-cols-3 gap-2 pt-1">
            <button type="button" onclick="closeCustomModal()" class="py-3 rounded-xl bg-slate-100 text-slate-600 font-bold text-sm">닫기</button>
            <button type="button" id="stCopyTextBtn" class="col-span-2 py-3 rounded-xl bg-indigo-600 text-white font-extrabold text-sm shadow active:scale-95">📋 카톡·문자 내역 복사</button>
          </div>
        </div>
      `);

      document.getElementById('stPresetCur').onclick = () => {
        activePreset = 'currentCycle';
        startStr = curRange.start;
        endStr = curRange.end;
        renderStatementContent();
      };
      document.getElementById('stPresetPrev').onclick = () => {
        activePreset = 'prevCycle';
        startStr = prevRange.start;
        endStr = prevRange.end;
        renderStatementContent();
      };
      document.getElementById('stPresetUnpaid').onclick = () => {
        activePreset = 'unpaidOnly';
        renderStatementContent();
      };
      document.getElementById('stPresetAll').onclick = () => {
        activePreset = 'all';
        renderStatementContent();
      };
      document.getElementById('stDateStart').onchange = (ev) => {
        activePreset = 'custom';
        startStr = ev.target.value;
        renderStatementContent();
      };
      document.getElementById('stDateEnd').onchange = (ev) => {
        activePreset = 'custom';
        endStr = ev.target.value;
        renderStatementContent();
      };

      document.getElementById('stCopyTextBtn').onclick = () => {
        if (displayRecs.length === 0) {
          showToast('⚠️ 복사할 납품 내역이 없습니다.');
          return;
        }
        const periodLabel = activePreset === 'all'
          ? '전체 기간'
          : (activePreset === 'unpaidOnly' ? '미수 내역' : `${startStr} ~ ${endStr}`);
        const detailLines = displayRecs.map(r => {
          const parts = [];
          if (num(r.qty189) > 0) parts.push(`18.9L ${num(r.qty189)}통`);
          (r.extraItems || []).forEach(ex => parts.push(`${ex.name} ${num(ex.qty)}개`));
          const rem = getRecordUnpaidAmount(r);
          const statusStr = r.paid ? '완납' : `미수 ${money(rem)}`;
          return `• ${r.date.slice(5)} : ${parts.join(', ') || '빈통회수'} (${money(r.totalAmount)} / ${statusStr})`;
        }).join('\n');

        const copyPayload =
          `[(주)신성에프앤디 거래내역 안내]\n` +
          `거래처: ${cName}\n` +
          `기간: ${periodLabel}\n` +
          `-------------------------\n` +
          `${detailLines}\n` +
          `-------------------------\n` +
          `• 총 합계: ${money(periodSales)} (공급가 ${money(supplyPrice)} / 부가세 ${money(vatPrice)})\n` +
          `• 총 미수 잔액: ${money(totalUnpaidAll)}`;

        try {
          const ta = document.createElement('textarea');
          ta.value = copyPayload;
          ta.style.position = 'fixed';
          ta.style.left = '-9999px';
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
          showToast('📋 거래내역이 복사되었습니다! 카톡이나 문자에 붙여넣으세요.');
        } catch (err) {
          showToast('⚠️ 복사에 실패했습니다.');
        }
      };
    }

    renderStatementContent();
  }

  // 거래처별 미수금 관리 뷰 (금액 입력 선입선출 수금 / 전액 일괄 수금 / 개별 전표 확인 수금)
  function renderUnpaidView() {
    const unpaid = state.deliveryRecords.filter(r => getRecordUnpaidAmount(r) > 0);
    const totalUnpaid = unpaid.reduce((acc, r) => acc + getRecordUnpaidAmount(r), 0);

    const grouped = new Map();
    unpaid.forEach(r => {
      const key = String(r.clientId || r.clientName);
      if (!grouped.has(key)) {
        grouped.set(key, { key, clientId: r.clientId, clientName: r.clientName, total: 0, records: [] });
      }
      const g = grouped.get(key);
      g.total += getRecordUnpaidAmount(r);
      g.records.push(r);
    });
    const allGroups = Array.from(grouped.values());

    const area = document.getElementById('salesContentArea');
    area.innerHTML = `
      <div class="space-y-3">
        <!-- 상단 미수금 총계 카드 -->
        <div class="bg-rose-600 text-white rounded-2xl p-4 shadow-md flex items-center justify-between">
          <div>
            <div class="text-xs font-bold text-rose-100">전체 미수금 합계 (${allGroups.length}개 거래처)</div>
            <div class="text-2xl font-extrabold mt-0.5">${money(totalUnpaid)}</div>
          </div>
          <div class="text-right space-y-1">
            <div class="text-xs font-bold text-rose-100">전표 ${unpaid.length}건</div>
            <button type="button" onclick="onClickUnpaidSubTab()" class="px-2 py-0.5 rounded-md bg-rose-700/80 border border-rose-400/50 text-[10px] font-extrabold text-white active:scale-95">
              상단표시: ${state.unpaidBadgeMode === 'clients' ? '거래처수' : '전표건수'} ⇄
            </button>
          </div>
        </div>

        ${allGroups.length > 0 ? `
          <!-- 미수 거래처 검색 · 정렬 · 간략히/자세히 제어 바 -->
          <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm p-3 space-y-2">
            <div class="relative">
              <input type="text" id="unpaidSearchInp" value="${escapeHtml(state.unpaidSearch)}" oninput="onUnpaidSearchInput(this.value)" placeholder="🔍 미수 거래처명 또는 초성(ㅇㄷ) 검색" class="w-full pl-3.5 pr-9 py-2 bg-slate-100 border border-slate-200 rounded-xl text-xs font-semibold outline-none focus:bg-white focus:border-indigo-500" />
              <button type="button" id="unpaidClearSearchBtn" onclick="clearUnpaidSearch()" class="${state.unpaidSearch ? 'flex' : 'hidden'} absolute right-2 top-1/2 -translate-y-1/2 w-6 h-6 items-center justify-center rounded-full text-slate-400 hover:text-slate-700 font-bold text-xs">✕</button>
            </div>
            <div class="flex items-center justify-between gap-2">
              <select onchange="onUnpaidSortChange(this.value)" class="px-2.5 py-1.5 bg-slate-100 border border-slate-200 rounded-lg text-xs font-bold text-slate-700 outline-none">
                <option value="amountDesc" ${state.unpaidSort === 'amountDesc' ? 'selected' : ''}>미수 많은순</option>
                <option value="name" ${state.unpaidSort === 'name' ? 'selected' : ''}>가나다순</option>
                <option value="countDesc" ${state.unpaidSort === 'countDesc' ? 'selected' : ''}>미수 건수순</option>
              </select>
              <button type="button" id="unpaidCompactToggleBtn" onclick="toggleUnpaidCompactMode()" class="px-3 py-1.5 rounded-lg text-xs font-extrabold border transition whitespace-nowrap active:scale-95 ${
                !state.unpaidCompactMode
                  ? 'bg-indigo-600 text-white border-indigo-600'
                  : 'bg-slate-100 text-slate-700 border-slate-200'
              }">${state.unpaidCompactMode ? '□ 전체 자세히' : '≡ 전체 간략히'}</button>
            </div>
            <div class="text-[11px] text-slate-400 px-0.5">💡 카드 빈 공간을 터치하면 날짜별 미수 전표가 아래로 펼쳐집니다.</div>
          </div>
        ` : ''}

        <div id="unpaidGroupListWrap" class="space-y-2.5"></div>
      </div>
    `;

    renderUnpaidGroupListOnly();
  }

  function renderUnpaidGroupListOnly() {
    const wrap = document.getElementById('unpaidGroupListWrap');
    if (!wrap) return;

    const unpaid = state.deliveryRecords.filter(r => getRecordUnpaidAmount(r) > 0);
    if (unpaid.length === 0) {
      wrap.innerHTML = `
        <div class="bg-white rounded-2xl border border-dashed border-slate-300 p-10 text-center space-y-1.5">
          <div class="text-2xl">🎉</div>
          <div class="text-sm font-extrabold text-slate-800">미수금이 없습니다!</div>
          <div class="text-xs text-slate-400">모든 배송 건의 수금이 완료된 상태입니다.</div>
        </div>
      `;
      return;
    }

    const grouped = new Map();
    unpaid.forEach(r => {
      const key = String(r.clientId || r.clientName);
      if (!grouped.has(key)) {
        grouped.set(key, { key, clientId: r.clientId, clientName: r.clientName, total: 0, records: [] });
      }
      const g = grouped.get(key);
      g.total += getRecordUnpaidAmount(r);
      g.records.push(r);
    });

    const kw = (state.unpaidSearch || '').trim().toLowerCase();
    let groupList = Array.from(grouped.values()).filter(g => {
      if (!kw) return true;
      return (
        (g.clientName || '').toLowerCase().includes(kw) ||
        getChosung(g.clientName || '').toLowerCase().includes(kw)
      );
    });

    groupList.sort((a, b) => {
      if (state.unpaidSort === 'name') return (a.clientName || '').localeCompare(b.clientName || '');
      if (state.unpaidSort === 'countDesc') {
        if (b.records.length !== a.records.length) return b.records.length - a.records.length;
        return b.total - a.total;
      }
      return b.total - a.total;
    });

    if (groupList.length === 0) {
      wrap.innerHTML = `
        <div class="bg-white rounded-2xl border border-dashed border-slate-300 p-8 text-center text-xs text-slate-400">
          검색어와 일치하는 미수 거래처가 없습니다.
        </div>
      `;
      return;
    }

    const isCompact = state.unpaidCompactMode;

    wrap.innerHTML = groupList.map(g => {
      const safeKey = escapeJsAttr(g.key);
      const safeName = escapeJsAttr(g.clientName);
      const stmtCall = g.clientId
        ? `openClientStatementModal(${g.clientId}, '${safeName}')`
        : `openClientStatementModal(null, '${safeName}')`;

      return `
        <div onclick="toggleUnpaidCardDetails(event, this)" class="select-none cursor-pointer bg-white rounded-2xl border border-rose-200 shadow-sm p-3.5 transition">
          <!-- 상단 기본 노출 영역: 거래처명(원장) + 아랫줄 미수 N건, 총 잔액 + 오른쪽 끝 금액 수금, 전액 수금 -->
          <div class="flex items-center justify-between gap-2">
            <div class="min-w-0 flex-1">
              <div class="flex items-center gap-1.5">
                <span class="text-base font-extrabold text-slate-900 truncate">${escapeHtml(g.clientName)}</span>
                <button type="button" onclick="event.stopPropagation(); ${stmtCall}" class="px-2 py-0.5 rounded-md bg-slate-100 border border-slate-200 text-slate-700 text-[11px] font-extrabold shrink-0 active:scale-95">원장</button>
              </div>
              <div class="text-xs font-bold text-rose-600 mt-1 truncate">
                미수 ${g.records.length}건 · 총 잔액 <strong class="font-extrabold">${money(g.total)}</strong>
              </div>
            </div>
            <div class="flex items-center gap-1.5 shrink-0">
              <button type="button" onclick="event.stopPropagation(); openPartialCollectModal('${safeKey}', '${safeName}')" class="px-2.5 py-2 rounded-xl bg-indigo-600 text-white text-xs font-extrabold shadow-sm active:scale-95 whitespace-nowrap">
                금액 수금
              </button>
              <button type="button" onclick="event.stopPropagation(); collectAllUnpaidForClient('${safeKey}', '${safeName}')" class="px-2.5 py-2 rounded-xl bg-emerald-600 text-white text-xs font-extrabold shadow-sm active:scale-95 whitespace-nowrap">
                전액 수금
              </button>
            </div>
          </div>

          <!-- 접이식 상세 전표 영역 (빈 공간 클릭 시 펼침) -->
          <div class="u-item-details ${isCompact ? 'hidden' : 'block'} space-y-1.5 mt-3 pt-2.5 border-t border-slate-100" onclick="event.stopPropagation()">
            ${g.records.sort((a, b) => (a.date < b.date ? 1 : -1)).map(r => {
              const rem = getRecordUnpaidAmount(r);
              const paidAmt = getRecordPaidAmount(r);
              const isPartial = paidAmt > 0;
              return `
                <div class="flex items-center justify-between gap-2 bg-slate-50 rounded-xl px-3 py-2 text-xs">
                  <div class="min-w-0">
                    <div class="font-extrabold text-slate-800">${r.date} <span class="text-slate-400 font-semibold">(${escapeHtml(r.paymentType)})</span></div>
                    <div class="text-[11px] text-slate-500">
                      18.9L ${num(r.qty189)}통${(r.extraItems || []).length ? ` 외 ${r.extraItems.length}종` : ''}
                      ${isPartial ? `<span class="text-indigo-600 font-bold ml-1">(총 ${money(r.totalAmount)} 중 ${money(paidAmt)} 입금됨)</span>` : ''}
                    </div>
                  </div>
                  <div class="flex items-center gap-2 shrink-0">
                    <span class="font-extrabold text-rose-700">${money(rem)}</span>
                    <button type="button" onclick="confirmCollectSingleUnpaid(${r.id})" class="px-2.5 py-1 rounded-lg bg-white border border-emerald-300 text-emerald-700 font-extrabold text-[11px] active:scale-95">수금</button>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }).join('');
  }

  function toggleUnpaidCardDetails(e, cardEl) {
    if (e.target.closest('button, a, input, select')) return;
    tap(15);
    const det = cardEl.querySelector('.u-item-details');
    if (det) det.classList.toggle('hidden');
  }

  function toggleUnpaidCompactMode() {
    state.unpaidCompactMode = !state.unpaidCompactMode;
    const btn = document.getElementById('unpaidCompactToggleBtn');
    if (btn) {
      btn.className = `px-3 py-1.5 rounded-lg text-xs font-extrabold border transition whitespace-nowrap active:scale-95 ${
        !state.unpaidCompactMode
          ? 'bg-indigo-600 text-white border-indigo-600'
          : 'bg-slate-100 text-slate-700 border-slate-200'
      }`;
      btn.innerText = state.unpaidCompactMode ? '□ 전체 자세히' : '≡ 전체 간략히';
    }
    renderUnpaidGroupListOnly();
  }

  function onUnpaidSearchInput(val) {
    state.unpaidSearch = val;
    const clearBtn = document.getElementById('unpaidClearSearchBtn');
    if (clearBtn) {
      if (val) { clearBtn.classList.remove('hidden'); clearBtn.classList.add('flex'); }
      else { clearBtn.classList.add('hidden'); clearBtn.classList.remove('flex'); }
    }
    renderUnpaidGroupListOnly();
  }

  function clearUnpaidSearch() {
    state.unpaidSearch = '';
    const inp = document.getElementById('unpaidSearchInp');
    if (inp) { inp.value = ''; inp.focus(); }
    onUnpaidSearchInput('');
  }

  function onUnpaidSortChange(val) {
    state.unpaidSort = val;
    renderUnpaidGroupListOnly();
  }

  // 금액 입력 수금 모달 (가장 오래된 과거 전표부터 선입선출 차감 + 자투리 잔액 표시)
  function openPartialCollectModal(key, clientName) {
    const targets = state.deliveryRecords
      .filter(r => getRecordUnpaidAmount(r) > 0 && String(r.clientId || r.clientName) === String(key))
      .sort((a, b) => (a.date !== b.date ? (a.date < b.date ? -1 : 1) : a.id - b.id));

    if (targets.length === 0) {
      showToast('⚠️ 미수 내역이 없습니다.');
      return;
    }

    const totalUnpaid = targets.reduce((acc, r) => acc + getRecordUnpaidAmount(r), 0);
    const curMonthPrefix = todayISO().slice(0, 7);
    const prevMonthsSum = targets
      .filter(r => !r.date.startsWith(curMonthPrefix))
      .reduce((acc, r) => acc + getRecordUnpaidAmount(r), 0);

    openCustomModal(`
      <div class="bg-white rounded-2xl p-4 w-full max-w-md shadow-2xl border border-slate-200 space-y-3 max-h-[90vh] overflow-y-auto">
        <div class="flex items-center justify-between">
          <div>
            <div class="text-base font-extrabold text-indigo-800">💵 금액 입력 수금 (과거순 차감)</div>
            <div class="text-xs font-bold text-slate-600 mt-0.5">${escapeHtml(clientName)} · 총 미수 잔액 <span class="text-rose-600">${money(totalUnpaid)}</span></div>
          </div>
          <button type="button" onclick="closeCustomModal()" class="w-8 h-8 rounded-full bg-slate-100 text-slate-600 font-extrabold">✕</button>
        </div>

        <div class="text-[11px] text-slate-600 bg-indigo-50/70 border border-indigo-200 rounded-xl p-2.5 leading-relaxed">
          ※ 입력한 입금액만큼 <b>가장 오래된 과거 전표부터 순서대로 완납</b> 처리되며, 자투리가 남으면 최근 전표에 남은 미수 잔액으로 표시됩니다.
        </div>

        <!-- 빠른 금액 버튼 -->
        <div class="flex flex-wrap gap-1.5">
          <button type="button" id="pcFullBtn" class="px-2.5 py-1.5 rounded-lg bg-emerald-50 border border-emerald-300 text-emerald-800 text-xs font-extrabold active:scale-95">전액 (${money(totalUnpaid)})</button>
          ${prevMonthsSum > 0 && prevMonthsSum < totalUnpaid ? `
            <button type="button" id="pcPrevMonthBtn" class="px-2.5 py-1.5 rounded-lg bg-amber-50 border border-amber-300 text-amber-900 text-xs font-extrabold active:scale-95">전월까지 (${money(prevMonthsSum)})</button>
          ` : ''}
          <button type="button" data-pc-add="100000" class="pc-add-btn px-2.5 py-1.5 rounded-lg bg-slate-100 text-slate-800 text-xs font-extrabold active:scale-95">+10만</button>
          <button type="button" data-pc-add="50000" class="pc-add-btn px-2.5 py-1.5 rounded-lg bg-slate-100 text-slate-800 text-xs font-extrabold active:scale-95">+5만</button>
          <button type="button" data-pc-add="10000" class="pc-add-btn px-2.5 py-1.5 rounded-lg bg-slate-100 text-slate-800 text-xs font-extrabold active:scale-95">+1만</button>
          <button type="button" id="pcClearBtn" class="px-2 py-1.5 rounded-lg bg-slate-100 text-slate-500 text-xs font-bold active:scale-95">초기화</button>
        </div>

        <!-- 입금 금액 입력칸 -->
        <div class="bg-slate-50 border-2 border-indigo-300 rounded-2xl p-3 flex items-center justify-between gap-2">
          <span class="text-xs font-extrabold text-slate-700 shrink-0">입금 받은 금액</span>
          <div class="flex items-center gap-1 flex-1 justify-end">
            <input id="pcAmountInp" type="number" inputmode="numeric" placeholder="0" class="w-36 text-right text-xl font-extrabold text-indigo-700 bg-white border border-slate-300 rounded-xl px-3 py-1.5 outline-none" />
            <span class="text-sm font-extrabold text-slate-600">원</span>
          </div>
        </div>

          </div>
          <div id="pcPreviewList" class="max-h-48 overflow-y-auto border border-slate-200 rounded-xl divide-y divide-slate-100 bg-white"></div>
        </div>

    const amtInp = document.getElementById('pcAmountInp');
    const previewList = document.getElementById('pcPreviewList');
    const remainSummary = document.getElementById('pcRemainSummary');
    bindAutoSelectInput(amtInp);

    function updatePreview() {
      let pool = Math.max(0, num(amtInp.value));
      if (pool > totalUnpaid) {
        pool = totalUnpaid;
        amtInp.value = totalUnpaid;
      }
      const afterTotalRemain = Math.max(0, totalUnpaid - pool);
      remainSummary.innerText = `수금 후 잔액: ${money(afterTotalRemain)}`;

      let leftToApply = pool;
      previewList.innerHTML = targets.map(r => {
        const rem = getRecordUnpaidAmount(r);
        const applied = Math.min(rem, leftToApply);
        leftToApply = Math.max(0, leftToApply - applied);
        const newRem = rem - applied;

        let badgeHtml = `<span class="px-1.5 py-0.5 rounded bg-slate-100 text-slate-500 text-[10px] font-bold">미변동</span>`;
        if (applied > 0 && newRem === 0) {
          badgeHtml = `<span class="px-1.5 py-0.5 rounded bg-emerald-100 text-emerald-800 text-[10px] font-extrabold">✅ 완납</span>`;
        } else if (applied > 0 && newRem > 0) {
          badgeHtml = `<span class="px-1.5 py-0.5 rounded bg-amber-100 text-amber-900 text-[10px] font-extrabold">일부입금 · 잔액 ${money(newRem)}</span>`;
        }

        return `
          <div class="px-3 py-2 flex items-center justify-between gap-2 text-xs">
            <div class="min-w-0">
              <div class="font-extrabold text-slate-800">${r.date} <span class="text-slate-400 font-normal">(미수 ${money(rem)})</span></div>
              <div class="mt-0.5">${badgeHtml}</div>
            </div>
            <div class="text-right shrink-0">
              <div class="font-extrabold ${applied > 0 ? 'text-indigo-700' : 'text-slate-400'}">${applied > 0 ? `-${money(applied)}` : '0원'}</div>
            </div>
          </div>
        `;
      }).join('');
    }

    amtInp.addEventListener('input', updatePreview);
    document.getElementById('pcFullBtn').onclick = () => { amtInp.value = totalUnpaid; updatePreview(); };
    if (document.getElementById('pcPrevMonthBtn')) {
      document.getElementById('pcPrevMonthBtn').onclick = () => { amtInp.value = prevMonthsSum; updatePreview(); };
    }
    document.querySelectorAll('.pc-add-btn').forEach(btn => {
      btn.onclick = () => {
        amtInp.value = Math.min(totalUnpaid, num(amtInp.value) + Number(btn.dataset.pcAdd));
        updatePreview();
      };
    });
    document.getElementById('pcClearBtn').onclick = () => { amtInp.value = ''; updatePreview(); };

    document.getElementById('pcSaveBtn').onclick = () => {
      const payAmt = Math.min(totalUnpaid, Math.max(0, num(amtInp.value)));
      if (payAmt <= 0) {
        showToast('⚠️ 입금받은 금액을 입력해 주세요.');
        amtInp.focus();
        return;
      }

      const nowStr = todayISO();
      let left = payAmt;
      let paidOffCount = 0;

      targets.forEach(r => {
        if (left <= 0) return;
        const rem = getRecordUnpaidAmount(r);
        const apply = Math.min(rem, left);
        left -= apply;

        const nextPaidAmt = getRecordPaidAmount(r) + apply;
        r.paidAmount = nextPaidAmt;
        if (nextPaidAmt >= num(r.totalAmount)) {
          r.paid = true;
          r.paidAt = nowStr;
          paidOffCount++;
        } else {
          r.paid = false;
        }
      });

      persistDeliveryData();
      closeCustomModal();
      const remainAfter = Math.max(0, totalUnpaid - payAmt);
      showToast(
        remainAfter === 0
          ? `✅ ${clientName} ${money(payAmt)} 전액 수금 완료!`
          : `✅ ${clientName} ${money(payAmt)} 수금 반영 (남은 미수: ${money(remainAfter)})`
      );
      renderSalesTab();
    };

    updatePreview();
    setTimeout(() => amtInp.focus(), 60);
  }

    showConfirmModal({
      title: `${rec.clientName} 개별 수금 확인`,

      confirmText: '수금 완료',
      onConfirm: () => {
        rec.paid = true;

        rec.paidAt = todayISO();
        persistDeliveryData();
        showToast(`✅ ${rec.clientName} (${money(rem)}) 수금 완료!`);

  function collectAllUnpaidForClient(key, clientName) {
    const targets = state.deliveryRecords.filter(r => getRecordUnpaidAmount(r) > 0 && String(r.clientId || r.clientName) === String(key));
    const sum = targets.reduce((acc, r) => acc + getRecordUnpaidAmount(r), 0);
    showConfirmModal({
      title: `${clientName} 전액 일괄 수금`,
      message: `미수 ${targets.length}건 (총 잔액 ${money(sum)})을 모두 수금 완료 처리할까요?`,
      confirmText: '전액 수금 완료',
      onConfirm: () => {
        const nowStr = todayISO();
        targets.forEach(r => {
          r.paid = true;
          r.paidAmount = num(r.totalAmount);
          r.paidAt = nowStr;
        });
        persistDeliveryData();
        showToast(`✅ ${clientName} ${money(sum)} 전액 수금 완료!`);
        renderSalesTab();
      }
    });
  }

  function exportSalesCSV() {
    const list = state.deliveryRecords.filter(r => r.date >= state.salesStart && r.date <= state.salesEnd);
    if (list.length === 0) {
      showToast('⚠️ 선택한 기간에 내보낼 매출 데이터가 없습니다.');
      return;
    }
    let csv = '\uFEFF날짜,거래처명,18.9L수량,18.9L단가,빈통회수,기타품목,총매출,수금액,미수잔액,결제방식,수금상태,수금일,메모\r\n';
    list.sort((a, b) => (a.date < b.date ? 1 : -1)).forEach(r => {
      const ex = (r.extraItems || []).map(x => `${x.name}(${x.qty}개)`).join(' / ');
      const paidAmt = getRecordPaidAmount(r);
      const remAmt = getRecordUnpaidAmount(r);
      const statusLabel = r.paid ? '수금완료' : (paidAmt > 0 ? '일부수금' : '미수금');
      csv += `"${r.date}","${r.clientName}","${num(r.qty189)}","${num(r.price189)}","${num(r.emptyReturned)}","${ex}","${num(r.totalAmount)}","${paidAmt}","${remAmt}","${r.paymentType || ''}","${statusLabel}","${r.paidAt || ''}","${(r.memo || '').replace(/"/g, '""')}"\r\n`;
    });
    downloadBlob(csv, `매출내역_${state.salesStart}_${state.salesEnd}.csv`, 'text/csv;charset=utf-8;');
    showToast('📊 매출 엑셀(CSV) 파일이 저장되었습니다.');
  }

      const dateInp = document.getElementById('edDateInput');
      const btnNext = document.getElementById('edNextMonth');
      const btnToday = document.getElementById('edToday');
      const btnTom = document.getElementById('edTomorrow');

      function highlight(activeBtn) {

          b.className = 'py-2 rounded-xl bg-slate-100 text-slate-700 text-xs font-bold border border-slate-300';

          activeBtn.className = 'py-2 rounded-xl bg-indigo-100 text-indigo-900 text-xs font-extrabold border-2 border-indigo-500';

      }
      btnNext.onclick = () => { dateInp.value = nextMonthFirstStr; highlight(btnNext); };
      btnToday.onclick = () => { dateInp.value = todayStr; highlight(btnToday); };
      btnTom.onclick = () => { dateInp.value = tomorrowStr; highlight(btnTom); };

      document.getElementById('edCancelBtn').onclick = closeCustomModal;

    document.getElementById('saveBasics').onclick = () => {

        syncOptionLabel: `품목 목록의 '18.9L 음봉 출고 단가'도 ${money(newRate)}으로 함께 변경`,

            state.priceSchedule.personalRate = { applyFrom, prevRate: activePersonalRateToday, newRate };
          } else {
            state.priceSchedule.personalRate = null;

          if (sync189Eumbong) {

    // 기간 지정 정산 / 입금 완료 모달

      const yesterdayStr = toLocalISO(new Date(now.getFullYear(), now.getMonth(), now.getDate() - 1));
      const thisMonthStartStr = toLocalISO(new Date(now.getFullYear(), now.getMonth(), 1));
      const lastMonthStartStr = toLocalISO(new Date(now.getFullYear(), now.getMonth() - 1, 1));
      const lastMonthEndStr = toLocalISO(new Date(now.getFullYear(), now.getMonth(), 0));

      const defaultStart = (state.lastSettled && state.lastSettled[wh])
        ? addDaysISO(state.lastSettled[wh], 1)
        : thisMonthStartStr;
      const defaultEnd = yesterdayStr >= defaultStart ? yesterdayStr : todayStr;

      openCustomModal(`

            <div class="text-base font-extrabold ${isM ? 'text-rose-700' : 'text-blue-700'}">💳 ${wh} 정산 / 입금 완료</div>

          </div>

            시작일~마감일을 지정하면 <b>해당 기간 합계만 누적 정산금에서 차감</b>되고, 마감일 이후 출고분은 안전하게 남습니다.
            ${state.lastSettled?.[wh] ? `<div class="mt-1 font-bold text-amber-700">📌 직전 정산 마감일: ${state.lastSettled[wh]}</div>` : ''}
          </div>
          <div class="grid grid-cols-3 gap-1.5">
            <button type="button" id="stQuickYesterday" class="py-1.5 rounded-lg bg-slate-100 text-slate-800 text-xs font-bold border border-slate-300">어제까지</button>

          </div>
          <div class="grid grid-cols-2 gap-2 bg-slate-50 p-2.5 rounded-xl border border-slate-200">
            <div>
              <label class="text-[11px] font-extrabold text-slate-600 block mb-1">출고 시작일</label>
              <input type="date" id="stStart" class="w-full border border-slate-300 p-2 rounded-lg text-xs font-bold bg-white" value="${defaultStart}" />
            </div>
            <div>
              <label class="text-[11px] font-extrabold text-slate-600 block mb-1">출고 마감일</label>
              <input type="date" id="stEnd" class="w-full border border-slate-300 p-2 rounded-lg text-xs font-bold bg-white" value="${defaultEnd}" />
            </div>
          </div>
          <div class="border rounded-2xl p-3 space-y-2 ${isM ? 'bg-rose-50/60 border-rose-200' : 'bg-blue-50/60 border-blue-200'}">
            <div class="flex justify-between items-center text-xs">
              <span class="text-slate-700 font-semibold">기간 내 ${wh} 출고 (<span id="stShipCount">0</span>건)</span>
              <span id="stShipSum" class="font-extrabold text-slate-900">0원</span>
            </div>
            ${!isM ? `
              <label class="flex items-center justify-between text-xs pt-1.5 border-t border-blue-200/70 cursor-pointer">
                <div class="flex items-center gap-1.5">
                  <input type="checkbox" id="stIncludeInbound" class="w-4 h-4 rounded" checked />
                  <span class="text-slate-700 font-semibold">기간 내 18.9L 입고 포함 (<span id="stInbCount">0</span>건)</span>
                </div>
                <span id="stInbSum" class="font-extrabold text-slate-900">0원</span>
              </label>
            ` : ''}
            <div class="pt-2 border-t ${isM ? 'border-rose-300' : 'border-blue-300'} flex justify-between items-center">
              <span class="font-extrabold text-xs ${isM ? 'text-rose-900' : 'text-blue-900'}">선택 기간 정산 합계</span>
              <span id="stPeriodTotal" class="text-lg font-extrabold ${isM ? 'text-rose-600' : 'text-blue-600'}">0원</span>
            </div>
          </div>
          <div class="bg-slate-50 border border-slate-200 rounded-xl p-3 space-y-1 text-xs">

              <span>현재 ${wh} 정산 누적</span>

      `);

      const stStart = document.getElementById('stStart');
      const stEnd = document.getElementById('stEnd');
      const stIncludeInbound = document.getElementById('stIncludeInbound');
      let calcResult = { periodTotal: 0, remainTotal: currentTotal, s: defaultStart, e: defaultEnd };

      function updateCalc() {
        const s = stStart.value || '0000-00-00';
        const e = stEnd.value || '9999-12-31';
        const shipList = state.outgoRecords.filter(r => r.warehouse === wh && r.date >= s && r.date <= e);
        const shipSum = shipList.reduce((acc, r) => acc + num(r.total), 0);
        document.getElementById('stShipCount').innerText = shipList.length;
        document.getElementById('stShipSum').innerText = money(shipSum);

        let inbSum = 0;
        if (!isM) {
          const inbList = state.inboundRecords.filter(r => r.type === 'personal_inbound' && r.date >= s && r.date <= e);
          const rawInbSum = inbList.reduce((acc, r) => acc + num(r.amount), 0);
          document.getElementById('stInbCount').innerText = inbList.length;
          document.getElementById('stInbSum').innerText = money(rawInbSum);
          if (stIncludeInbound && stIncludeInbound.checked) inbSum = rawInbSum;
        }

        const periodTotal = shipSum + inbSum;
        const remainTotal = Math.max(0, currentTotal - periodTotal);

        const afterShipSum = state.outgoRecords.filter(r => r.warehouse === wh && r.date > e).reduce((acc, r) => acc + num(r.total), 0);
        const afterInbSum = !isM
          ? state.inboundRecords.filter(r => r.type === 'personal_inbound' && r.date > e).reduce((acc, r) => acc + num(r.amount), 0)
          : 0;
        const afterTotal = afterShipSum + afterInbSum;

        document.getElementById('stPeriodTotal').innerText = money(periodTotal);
        document.getElementById('stRemainTotal').innerText = money(remainTotal);
        document.getElementById('stConfirmPeriod').innerText = `선택 기간 입금 완료 (-${money(periodTotal)})`;
        document.getElementById('stAfterNote').innerHTML = afterTotal > 0
          ? `💡 마감일(${e}) 이후 미정산 금액 <b>${money(afterTotal)}</b>이 누적금에 남습니다.`
          : `※ 마감일(${e}) 이후 입력된 내역은 없습니다.`;

        calcResult = { periodTotal, remainTotal, s, e };
      }

      stStart.addEventListener('input', updateCalc);
      stEnd.addEventListener('input', updateCalc);
      if (stIncludeInbound) stIncludeInbound.addEventListener('change', updateCalc);

      document.getElementById('stQuickYesterday').onclick = () => { stStart.value = defaultStart; stEnd.value = yesterdayStr; updateCalc(); };
      document.getElementById('stQuickToday').onclick = () => { stStart.value = defaultStart; stEnd.value = todayStr; updateCalc(); };
      document.getElementById('stQuickLastMonth').onclick = () => { stStart.value = lastMonthStartStr; stEnd.value = lastMonthEndStr; updateCalc(); };
      document.getElementById('stCloseX').onclick = closeCustomModal;
      document.getElementById('stCancel').onclick = closeCustomModal;

      document.getElementById('stConfirmPeriod').onclick = () => {
        const { periodTotal, remainTotal, s, e } = calcResult;
        if (s > e) {
          showToast('⚠️ 시작일이 마감일보다 늦을 수 없습니다.');
          return;
        }
        closeCustomModal();
        showConfirmModal({
          title: `${wh} 기간 정산 확인`,
          message: `• 정산 기간: ${s} ~ ${e}\n• 차감 금액: ${money(periodTotal)}\n• 남을 누적금: ${money(remainTotal)}\n\n입금 완료 처리할까요?`,
          confirmText: '입금 완료',
          onConfirm: () => {
            if (isM) state.settlement.myeong = remainTotal;
            else state.settlement.eumbong = remainTotal;
            state.lastSettled[wh] = e;
            persistIOData();
            showToast(`✅ ${wh} 정산 완료 (-${money(periodTotal)})`);
            renderSettingsTab();
          }
        });

        showConfirmModal({
          title: `${wh} 정산 전체 초기화`,
          message: `현재 ${wh} 누적 정산금(${money(currentTotal)})을 0원으로 초기화할까요?`,

          onConfirm: () => {

            else state.settlement.eumbong = 0;
            state.lastSettled[wh] = todayStr;
            persistIOData();
            showToast(`✅ ${wh} 정산 누적금이 0원으로 초기화되었습니다.`);
            renderSettingsTab();
          }
        });
      };

      updateCalc();
    }

              ${isPinned ? '⭐ 기본표시' : '☆ 기타접기'}

              <button type="button" data-move="up" data-idx="${idx}" class="w-8 h-7 rounded-lg border border-slate-300 bg-white font-extrabold text-[11px] ${idx === 0 ? 'opacity-30' : ''}" ${idx === 0 ? 'disabled' : ''}>▲</button>

              <div class="text-[10px] font-extrabold text-sky-700">음봉 단가</div>
              <div class="flex items-center mt-0.5">

                <span class="text-[11px] text-slate-400 ml-1 shrink-0">원</span>
              </div>

          if (targetIdx < 0 || targetIdx >= state.items.length) return;
          const tmp = state.items[idx];

          state.items[targetIdx] = tmp;
          saveJSON(KEYS.items, state.items);
          drawItems();

          const idx = Number(btn.dataset.del);

          const i = Number(inp.dataset.i);
          const f = inp.dataset.f;
          if (f === 'name') state.items[i].name = inp.value;

          showToast(applyFrom > todayStr

            : `✅ 오늘부터 새 단가가 즉시 적용되었습니다.`);

  /* ===================================================================
   * 10. 백업 · 복원 · 기존 앱 데이터 마이그레이션
   * =================================================================== */
  function downloadBlob(content, filename, mimeType) {
    const blob = new Blob([content], { type: mimeType });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  function downloadUnifiedBackup() {
    const payload = {
      schemaVersion: 'shinsung-unified-v2',
      exportedAt: new Date().toISOString(),
      clients: state.clients,
      io: {
        items: state.items,
        outgoRecords: state.outgoRecords,
        inboundRecords: state.inboundRecords,
        myStock: state.myStock,
        containerHeld: state.containerHeld,
        settlement: state.settlement,
        lastSettled: state.lastSettled,
        priceSchedule: state.priceSchedule,
        personalRate: state.personalRate,
        truckSize: state.truckSize
      },
      delivery: {
        schedules: state.deliverySchedules,
        records: state.deliveryRecords,
        sellPrices: state.deliverySellPrices,
        dateOrders: state.deliveryDateOrders
      }
    };
    downloadBlob(
      JSON.stringify(payload, null, 2),
      `신성통합백업_${todayISO().replace(/-/g, '')}.json`,
      'application/json'
    );
    showToast('💾 전체 통합 백업 파일이 저장되었습니다.');
  }

  function triggerLegacyClientImport() {
    const inp = document.getElementById('legacyClientFileInput');
    inp.value = '';
    inp.click();
  }

  function triggerLegacyIoImport() {
    const inp = document.getElementById('legacyIoFileInput');
    inp.value = '';
    inp.click();
  }

  function triggerUnifiedRestore() {
    const inp = document.getElementById('unifiedFileInput');
    inp.value = '';
    inp.click();
  }

  function applyLegacyClientData(arr) {
    state.clients = arr;
    persistClients();
    showToast(`✅ 거래처 ${arr.length}곳을 성공적으로 불러왔습니다.`);
    renderSettingsTab();
  }

  function applyLegacyIoData(data) {
    if (Array.isArray(data.items)) state.items = data.items;
    state.outgoRecords = Array.isArray(data.outgoRecords) ? data.outgoRecords : [];
    state.inboundRecords = Array.isArray(data.inboundRecords) ? data.inboundRecords : [];
    state.myStock = data.myStock || { '18.9L': 0 };
    state.containerHeld = data.containerHeld || { 명성: {}, 음봉: {} };
    state.settlement = data.settlement || { myeong: 0, eumbong: 0 };
    state.lastSettled = data.lastSettled || { 명성: '', 음봉: '' };
    state.priceSchedule = data.priceSchedule || { personalRate: null, items: null };
    if (data.personalRate !== undefined) state.personalRate = num(data.personalRate);
    if (data.truckSize !== undefined) state.truckSize = num(data.truckSize);

    normalizeAllData();
    persistIOData();
    showToast(`✅ 입출고 데이터(전표 ${state.outgoRecords.length + state.inboundRecords.length}건)를 불러왔습니다.`);
    renderSettingsTab();
  }

  function applyUnifiedData(data) {
    if (Array.isArray(data.clients)) {
      state.clients = data.clients;
      persistClients();
    }
    if (data.io) {
      applyLegacyIoData(data.io);
    }
    if (data.delivery) {
      state.deliverySchedules = Array.isArray(data.delivery.schedules) ? data.delivery.schedules : [];
      state.deliveryRecords = Array.isArray(data.delivery.records) ? data.delivery.records : [];
      state.deliverySellPrices = (data.delivery.sellPrices && typeof data.delivery.sellPrices === 'object')
        ? data.delivery.sellPrices
        : {};
      state.deliveryDateOrders = (data.delivery.dateOrders && typeof data.delivery.dateOrders === 'object')
        ? data.delivery.dateOrders
        : {};
      persistDeliveryData();
    }
    showToast('✅ 전체 통합 백업 복원이 완료되었습니다.');
    renderSettingsTab();
  }

  document.getElementById('legacyClientFileInput').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        const arr = Array.isArray(parsed) ? parsed : (Array.isArray(parsed.clients) ? parsed.clients : null);
        if (!arr) {
          showToast('⚠️ 올바른 거래처 백업(.json) 파일이 아닙니다.');
          return;
        }
        const sumStock = arr.reduce((a, c) => a + parseClientNum(c.stock), 0);
        showConfirmModal({
          title: '기존 거래처 백업 적용',
          message: `파일 내 거래처 ${arr.length}곳 (통재고 합계 ${sumStock}개)을 확인했습니다.\n현재 거래처 목록에 덮어씌울까요?`,
          confirmText: '불러오기',
          onConfirm: () => applyLegacyClientData(arr)
        });
      } catch (err) {
        showToast('⚠️ JSON 파일을 읽는 중 오류가 발생했습니다.');
      }
    };
    reader.readAsText(file);
  });

  document.getElementById('legacyIoFileInput').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        const ioObj = parsed && parsed.io ? parsed.io : parsed;
        if (!ioObj || (!ioObj.outgoRecords && !ioObj.items && !ioObj.myStock)) {
          showToast('⚠️ 올바른 입출고 백업(.json) 파일이 아닙니다.');
          return;
        }
        const outCnt = (ioObj.outgoRecords || []).length;
        const inCnt = (ioObj.inboundRecords || []).length;
        const mSum = money(ioObj.settlement?.myeong || 0);
        const eSum = money(ioObj.settlement?.eumbong || 0);
        const stock189 = num(ioObj.myStock?.['18.9L'] || 0);
        showConfirmModal({
          title: '기존 입출고 백업 적용',
          message: `• 개인재고(18.9L): ${stock189}통\n• 명성 정산: ${mSum}\n• 음봉 정산: ${eSum}\n• 전표: 출고 ${outCnt}건 / 입고·반납 ${inCnt}건\n\n입출고 데이터를 덮어씌울까요?`,
          confirmText: '불러오기',
          onConfirm: () => applyLegacyIoData(ioObj)
        });
      } catch (err) {
        showToast('⚠️ JSON 파일을 읽는 중 오류가 발생했습니다.');
      }
    };
    reader.readAsText(file);
  });

  document.getElementById('unifiedFileInput').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        if (parsed && (parsed.schemaVersion || (parsed.clients && parsed.io))) {
          const cCnt = (parsed.clients || []).length;
          const outCnt = (parsed.io?.outgoRecords || []).length;
          const delCnt = (parsed.delivery?.records || []).length;
          showConfirmModal({
            title: '통합 백업 복원',
            message: `• 거래처: ${cCnt}곳\n• 입출고 전표: ${outCnt}건\n• 배송·매출 기록: ${delCnt}건\n• 개인재고: ${num(parsed.io?.myStock?.['18.9L'])}통\n\n현재 앱의 모든 데이터를 이 백업으로 복원할까요?`,
            confirmText: '전체 복원',
            onConfirm: () => applyUnifiedData(parsed)
          });
          return;
        }
        if (Array.isArray(parsed)) {
          showConfirmModal({
            title: '기존 거래처 백업 감지',
            message: `기존 거래처 백업 파일(${parsed.length}곳)이 선택되었습니다.\n거래처 데이터만 불러올까요?`,
            confirmText: '거래처 불러오기',
            onConfirm: () => applyLegacyClientData(parsed)
          });
          return;
        }
        if (parsed && (parsed.outgoRecords || parsed.myStock)) {
          showConfirmModal({
            title: '기존 입출고 백업 감지',
            message: '기존 입출고 백업 파일이 선택되었습니다.\n입출고 데이터만 불러올까요?',
            confirmText: '입출고 불러오기',
            onConfirm: () => applyLegacyIoData(parsed)
          });
          return;
        }
        showToast('⚠️ 지원하지 않는 백업 파일 형식입니다.');
      } catch (err) {
        showToast('⚠️ 파일 읽기 중 오류가 발생했습니다.');
      }
    };
    reader.readAsText(file);
  });

  function confirmResetIO() {
    showConfirmModal({
      title: '입출고 데이터 초기화',
      message: '거래처와 배송·매출 기록은 유지하고, 입출고 전표·재고·정산만 모두 0으로 초기화할까요?',
      confirmText: '입출고 초기화',
      danger: true,
      onConfirm: () => {
        [KEYS.items, KEYS.outgo, KEYS.inbound, KEYS.myStock, KEYS.containerHeld, KEYS.settlement, KEYS.lastSettled, KEYS.priceSchedule, KEYS.personalRate, KEYS.truckSize]
          .forEach(k => localStorage.removeItem(k));
        state.items = JSON.parse(JSON.stringify(DEFAULT_ITEMS));
        state.outgoRecords = [];
        state.inboundRecords = [];
        state.myStock = { '18.9L': 0 };
        state.containerHeld = { 명성: {}, 음봉: {} };
        state.settlement = { myeong: 0, eumbong: 0 };
        state.lastSettled = { 명성: '', 음봉: '' };
        state.priceSchedule = { personalRate: null, items: null };
        state.personalRate = 1800;
        state.truckSize = 864;
        normalizeAllData();
        persistIOData();
        showToast('🗑️ 입출고 데이터가 초기화되었습니다.');
        renderSettingsTab();
      }
    });
  }

  function confirmResetAll() {
    showConfirmModal({
      title: '⚠️ 전체 데이터 초기화',
      message: '거래처 목록, 입출고 전표, 배송 일정, 매출·미수금 기록 등 모든 데이터가 삭제됩니다.\n정말 초기화할까요?',
      confirmText: '전체 삭제',
      danger: true,
      onConfirm: () => {
        Object.values(KEYS).forEach(k => localStorage.removeItem(k));
        state.clients = [];
        state.items = JSON.parse(JSON.stringify(DEFAULT_ITEMS));
        state.outgoRecords = [];
        state.inboundRecords = [];
        state.myStock = { '18.9L': 0 };
        state.containerHeld = { 명성: {}, 음봉: {} };
        state.settlement = { myeong: 0, eumbong: 0 };
        state.lastSettled = { 명성: '', 음봉: '' };
        state.priceSchedule = { personalRate: null, items: null };
        state.personalRate = 1800;
        state.truckSize = 864;
        state.deliverySchedules = [];
        state.deliveryRecords = [];
        state.deliverySellPrices = {};
        state.deliveryDateOrders = {};
        normalizeAllData();
        persistIOData();
        persistClients();
        persistDeliveryData();
        showToast('🗑️ 모든 데이터가 초기화되었습니다.');
        renderSettingsTab();
      }
    });
  }

  /* ===================================================================
   * 11. 앱 초기화 및 스플래시 종료
   * =================================================================== */
  history.replaceState({ tab: 'io', ioSubScreen: 'home' }, '', '#io');
  renderApp();

  setTimeout(() => {
    const splash = document.getElementById('introSplash');
    if (splash) {
      splash.classList.add('opacity-0', 'pointer-events-none');
      setTimeout(() => splash.remove(), 500);
    }
  }, 700);
  </script>
</body>
</html>

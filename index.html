  // 특정 거래처가 해당 날짜(dateStr)에 정기 방문 대상인지 판별
  function isClientRegularOnDate(client, dateStr) {
    if (!client || !client.visitCycle || client.visitCycle === 'irregular') return false;
    const target = parseISO(dateStr);
    const dayIdx = target.getDay();

    if (client.visitCycle === 'weekly') {
      return Array.isArray(client.visitDays) && client.visitDays.includes(dayIdx);
    }

    if (client.visitCycle === 'biweekly') {
      if (!Array.isArray(client.visitDays) || !client.visitDays.includes(dayIdx)) return false;
      const anchor = parseISO(client.visitAnchorDate || todayISO());
      const anchorSun = new Date(anchor.getFullYear(), anchor.getMonth(), anchor.getDate() - anchor.getDay());
      const targetSun = new Date(target.getFullYear(), target.getMonth(), target.getDate() - target.getDay());
      const weekDiff = Math.round((targetSun - anchorSun) / (7 * 86400000));
      return Math.abs(weekDiff) % 2 === 0;
    }

    if (client.visitCycle === 'monthly') {
      const lastDay = new Date(target.getFullYear(), target.getMonth() + 1, 0).getDate();
      if (client.visitMonthlyType === 'weekday') {
        const mWeekdays = Array.isArray(client.visitMonthWeekdays) ? client.visitMonthWeekdays : [];
        if (!mWeekdays.includes(dayIdx)) return false;
        const targetDateNum = target.getDate();
        const weekRule = String(client.visitMonthWeek || '1');
        if (weekRule === 'last') {
          return targetDateNum + 7 > lastDay;
        }
        const nthOccurrence = Math.floor((targetDateNum - 1) / 7) + 1;
        return nthOccurrence === Number(weekRule);
      }
      const mDay = num(client.visitMonthDay);
      if (mDay < 1 || mDay > 31) return false;
      const effectiveDay = Math.min(mDay, lastDay);
      return target.getDate() === effectiveDay;
    }

    return false;
  }

  // 특정 날짜의 배송 대기 목록 및 완료 목록 계산
  function getDeliveryTasksForDate(dateStr) {
    const doneRecords = state.deliveryRecords.filter(r => r.date === dateStr);
    const doneClientIds = new Set(doneRecords.filter(r => r.clientId).map(r => r.clientId));
    const doneScheduleIds = new Set(doneRecords.filter(r => r.scheduleId).map(r => String(r.scheduleId)));

    const pendingMap = new Map();

    // 1) 정기 코스 거래처
    for (const c of state.clients) {
      if (!isClientRegularOnDate(c, dateStr)) continue;
      const movedOrSkipped = state.deliverySchedules.some(
        s => s.clientId === c.id && (s.type === 'postpone' || s.type === 'skip') && s.origDate === dateStr
      );
      if (movedOrSkipped) continue;
      if (doneClientIds.has(c.id)) continue;

      pendingMap.set(`client_${c.id}`, {
        taskKey: `client_${c.id}`,
        clientId: c.id,
        isOneTime: false,
        client: c,
        source: 'regular',
        badge: formatClientCycleBadge(c),
        plannedItems: null,
        note: ''
      });
    }

    // 2) 다른 날에서 이월(postpone)되어 온 일정
    for (const s of state.deliverySchedules) {
      if (s.type !== 'postpone' || s.targetDate !== dateStr) continue;
      if (doneScheduleIds.has(String(s.id))) continue;

      if (s.isOneTime && s.customClient) {
        const virtualClient = {
          id: null,
          isOneTime: true,
          name: s.customClient.name || '기타 배송지',
          phone: s.customClient.phone || '',
          addr: s.customClient.addr || '',
          paymentType: s.customClient.paymentType || '현금',
          price: '',
          qty: '',
          stock: '0',
          memo: ''
        };
        pendingMap.set(`sched_${s.id}`, {
          taskKey: `sched_${s.id}`,
          clientId: null,
          isOneTime: true,
          client: virtualClient,
          source: 'postpone',
          scheduleId: s.id,
          origDate: s.origDate,
          badge: `⚡ 1회성 · ↪️ 이월 (${s.origDate.slice(5)})`,
          plannedItems: s.plannedItems || null,
          note: s.note || ''
        });
        continue;
      }

      if (doneClientIds.has(s.clientId)) continue;
      const c = state.clients.find(x => x.id === s.clientId);
      if (!c) continue;
      pendingMap.set(`client_${c.id}`, {
        taskKey: `client_${c.id}`,
        clientId: c.id,
        isOneTime: false,
        client: c,
        source: 'postpone',
        scheduleId: s.id,
        origDate: s.origDate,
        badge: `↪️ 이월 (${s.origDate.slice(5)})`,
        plannedItems: s.plannedItems || null,
        note: s.note || ''
      });
    }

    // 3) 수동 사전 예약(manual) 일정
    for (const s of state.deliverySchedules) {
      if (s.type !== 'manual' || s.date !== dateStr) continue;
      if (doneScheduleIds.has(String(s.id))) continue;

      if (s.isOneTime && s.customClient) {
        const virtualClient = {
          id: null,
          isOneTime: true,
          name: s.customClient.name || '기타 배송지',
          phone: s.customClient.phone || '',
          addr: s.customClient.addr || '',
          paymentType: s.customClient.paymentType || '현금',
          price: '',
          qty: '',
          stock: '0',
          memo: ''
        };
        pendingMap.set(`sched_${s.id}`, {
          taskKey: `sched_${s.id}`,
          clientId: null,
          isOneTime: true,
          client: virtualClient,
          source: 'manual',
          scheduleId: s.id,
          badge: '⚡ 1회성(기타)',
          plannedItems: s.plannedItems || null,
          note: s.note || ''
        });
        continue;
      }

      if (doneClientIds.has(s.clientId)) continue;
      const c = state.clients.find(x => x.id === s.clientId);
      if (!c) continue;
      const key = `client_${c.id}`;
      if (!pendingMap.has(key)) {
        pendingMap.set(key, {
          taskKey: key,
          clientId: c.id,
          isOneTime: false,
          client: c,
          source: 'manual',
          scheduleId: s.id,
          badge: '📞 예약',
          plannedItems: s.plannedItems || null,
          note: s.note || ''
        });
      } else {
        const existing = pendingMap.get(key);
        existing.scheduleId = s.id;
        if (s.plannedItems) existing.plannedItems = s.plannedItems;
        if (s.note) existing.note = s.note;
      }
    }

    // 해당 날짜에 저장된 커스텀 순서(deliveryDateOrders)가 있으면 우선 반영, 없으면 기본 courseOrder 순
    const customDateOrder = Array.isArray(state.deliveryDateOrders?.[dateStr])
      ? state.deliveryDateOrders[dateStr]
      : null;

    const pending = Array.from(pendingMap.values()).sort((a, b) => {
      if (customDateOrder) {
        const ia = customDateOrder.indexOf(a.taskKey);
        const ib = customDateOrder.indexOf(b.taskKey);
        if (ia !== -1 && ib !== -1) return ia - ib;
        if (ia !== -1) return -1;
        if (ib !== -1) return 1;
      }
      const oa = a.client.courseOrder !== undefined ? a.client.courseOrder : 999999;
      const ob = b.client.courseOrder !== undefined ? b.client.courseOrder : 999999;
      if (oa !== ob) return oa - ob;
      return (a.client.name || '').localeCompare(b.client.name || '');
    });

    const done = [...doneRecords].sort((a, b) => (b.createdAt || b.id) - (a.createdAt || a.id));
    return { pending, done };
  }

  // 예약된 품목·수량 요약 텍스트 생성
  function formatPlannedItemsSummary(planned) {
    if (!planned) return '';
    const parts = [];
    if (num(planned.qty189) > 0) parts.push(`18.9L ${num(planned.qty189)}통`);
    if (Array.isArray(planned.extraItems)) {
      planned.extraItems.forEach(ex => {
        if (num(ex.qty) > 0) parts.push(`${ex.name} ${num(ex.qty)}개`);
      });
    }
    return parts.join(', ');
  }

      ? 'bg-teal-100 text-teal-900 border-teal-300'

    // 코스 순서 편집 모드 전용 카드 UI (▲ / ▼ 버튼 + ☰ 터치 드래그 손잡이)

            ${(c.addr || c.name) ? `<button type="button" onclick="openNaverMap(event, '${searchQuery}')" class="px-2.5 py-1.5 rounded-lg bg-emerald-50 border border-emerald-200 text-emerald-700 text-xs font-extrabold inline-flex items-center gap-1 active:scale-90">🗺️ 지도</button>` : ''}

          ${c.addr ? `<div class="text-xs text-slate-600">📍 ${escapeHtml(c.addr)}</div>` : ''}

          ${isOneTime ? `
            <div class="flex flex-wrap items-center gap-1.5 text-xs">
              <span class="px-2 py-0.5 rounded-md bg-teal-50 text-teal-800 font-bold">미등록 1회성 배송</span>
              ${c.paymentType ? `<span class="px-2 py-0.5 rounded-md bg-amber-50 text-amber-800 font-bold">💳 ${escapeHtml(c.paymentType)}</span>` : ''}
            </div>
          ` : `
            <div class="flex flex-wrap items-center gap-1.5 text-xs">
              <span class="px-2 py-0.5 rounded-md bg-slate-100 text-slate-700 font-bold">
                ${isPet ? `패트 기본 ${formatUnitDisplay(c.qty, '팩', '미지정')}` : `18.9L 기본 ${formatUnitDisplay(c.qty, '통', '미지정')}`}
              </span>

  // 배송 대기 목록에서 직접 코스 순서 변경 토글 & 이동 로직
  function toggleDeliveryReorderMode() {
    state.deliveryReorderMode = !state.deliveryReorderMode;
    renderDeliveryTab();
  }

  function applyNewPendingTaskOrder(orderedTasks) {
    const dateStr = state.deliveryDate;
    // 1) 당일 배송 대기 목록 커스텀 순서 저장 (1회성 기타 배송지 포함)
    state.deliveryDateOrders[dateStr] = orderedTasks.map(t => t.taskKey);

    // 2) 등록된 거래처의 기본 정기 코스 순서(courseOrder)도 함께 업데이트하여 다음 방문에도 유지
    const registeredInOrder = orderedTasks.filter(t => !t.isOneTime && t.clientId);
    if (registeredInOrder.length > 1) {
      const existingRanks = registeredInOrder
        .map((t, i) => (t.client.courseOrder !== undefined ? t.client.courseOrder : (1000 + i)))
        .sort((a, b) => a - b);
      registeredInOrder.forEach((t, idx) => {
        const real = state.clients.find(c => c.id === t.clientId);
        if (real) real.courseOrder = existingRanks[idx];
      });
      persistClients();
    }

    persistDeliveryData();
    renderDeliveryTab();
  }

  function movePendingDeliveryOrder(idx, delta) {
    const { pending } = getDeliveryTasksForDate(state.deliveryDate);
    const targetIdx = idx + delta;
    if (targetIdx < 0 || targetIdx >= pending.length) return;
    tap(25);
    const copy = [...pending];
    [copy[idx], copy[targetIdx]] = [copy[targetIdx], copy[idx]];
    applyNewPendingTaskOrder(copy);
  }

  function bindDeliveryListDragSort() {
    const wrap = document.getElementById('deliveryPendingListWrap');
    if (!wrap) return;
    const handles = wrap.querySelectorAll('.delivery-drag-handle');

    handles.forEach(handle => {
      handle.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        const card = handle.closest('.delivery-reorder-card');
        if (!card) return;
        const startIdx = Number(card.dataset.reorderIdx);
        tap(30);

        card.classList.add('ring-2', 'ring-indigo-500', 'bg-indigo-50/70', 'scale-[1.01]', 'z-20');
        let currentIdx = startIdx;

        const onPointerMove = (ev) => {
          const cards = Array.from(wrap.querySelectorAll('.delivery-reorder-card'));
          for (let i = 0; i < cards.length; i++) {
            if (i === currentIdx) continue;
            const rect = cards[i].getBoundingClientRect();
            const midY = rect.top + rect.height / 2;
            if ((i < currentIdx && ev.clientY < midY) || (i > currentIdx && ev.clientY > midY)) {
              if (i < currentIdx) wrap.insertBefore(card, cards[i]);
              else wrap.insertBefore(card, cards[i].nextSibling);
              currentIdx = i;
              tap(15);
              break;
            }
          }
        };

        const onPointerUp = () => {
          window.removeEventListener('pointermove', onPointerMove);
          window.removeEventListener('pointerup', onPointerUp);
          window.removeEventListener('pointercancel', onPointerUp);
          card.classList.remove('ring-2', 'ring-indigo-500', 'bg-indigo-50/70', 'scale-[1.01]', 'z-20');

          const finalKeys = Array.from(wrap.querySelectorAll('.delivery-reorder-card')).map(el => el.dataset.taskKey);
          const { pending } = getDeliveryTasksForDate(state.deliveryDate);
          const taskMap = new Map(pending.map(t => [t.taskKey, t]));
          const reordered = finalKeys.map(k => taskMap.get(k)).filter(Boolean);
          if (reordered.length === pending.length) {
            applyNewPendingTaskOrder(reordered);
            showToast('↕️ 배송 코스 순서가 변경되었습니다.');
          }
        };

        window.addEventListener('pointermove', onPointerMove);
        window.addEventListener('pointerup', onPointerUp);
        window.addEventListener('pointercancel', onPointerUp);
      });
    });
  }

  // 월별 달력 HTML 생성
  function buildDeliveryCalendarHtml() {
    const { year, month } = state.deliveryCalendarMonth;
    const firstDay = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const todayStr = todayISO();

    let cells = '';
    for (let i = 0; i < firstDay; i++) {
      cells += `<div class="h-12"></div>`;
    }
    for (let d = 1; d <= daysInMonth; d++) {
      const iso = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
      const tasks = getDeliveryTasksForDate(iso);
      const pCnt = tasks.pending.length;
      const dCnt = tasks.done.length;
      const isSelected = iso === state.deliveryDate;
      const isToday = iso === todayStr;

      cells += `
        <button type="button" onclick="selectCalendarDate('${iso}')" class="h-12 rounded-xl flex flex-col items-center justify-center relative transition active:scale-95 ${
          isSelected
            ? 'bg-indigo-600 text-white shadow-sm'
            : (isToday ? 'bg-indigo-50 text-indigo-700 border border-indigo-300' : 'bg-slate-50 text-slate-700 hover:bg-slate-100')
        }">
          <span class="text-xs font-extrabold">${d}</span>
          <div class="flex items-center gap-0.5 mt-0.5">
            ${pCnt > 0 ? `<span class="text-[9px] font-extrabold px-1 rounded ${isSelected ? 'bg-amber-300 text-slate-900' : 'bg-amber-100 text-amber-800'}">${pCnt}</span>` : ''}
            ${dCnt > 0 ? `<span class="text-[9px] font-extrabold px-1 rounded ${isSelected ? 'bg-emerald-300 text-slate-900' : 'bg-emerald-100 text-emerald-800'}">✓${dCnt}</span>` : ''}
          </div>

      `;
    }

    return `
      <div class="space-y-2">
        <div class="flex items-center justify-between px-1">
          <button type="button" onclick="shiftCalendarMonth(-1)" class="px-2.5 py-1 rounded-lg bg-slate-100 text-xs font-extrabold text-slate-700">◀ 이전달</button>
          <span class="text-sm font-extrabold text-slate-900">${year}년 ${month + 1}월</span>
          <button type="button" onclick="shiftCalendarMonth(1)" class="px-2.5 py-1 rounded-lg bg-slate-100 text-xs font-extrabold text-slate-700">다음달 ▶</button>

        <div class="grid grid-cols-7 gap-1">${cells}</div>
        <div class="flex items-center justify-end gap-3 text-[10px] text-slate-500 pt-1">
          <span><span class="inline-block px-1 rounded bg-amber-100 text-amber-800 font-bold">숫자</span> 예정</span>
          <span><span class="inline-block px-1 rounded bg-emerald-100 text-emerald-800 font-bold">✓숫자</span> 완료</span>
        </div>
      </div>

  function shiftDeliveryDate(delta) {
    state.deliveryReorderMode = false;
    state.deliveryDate = addDaysISO(state.deliveryDate, delta);
    const d = parseISO(state.deliveryDate);
    state.deliveryCalendarMonth = { year: d.getFullYear(), month: d.getMonth() };
    renderDeliveryTab();
  }

  function setDeliveryDate(isoStr) {
    state.deliveryReorderMode = false;
    state.deliveryDate = isoStr;
    const d = parseISO(isoStr);
    state.deliveryCalendarMonth = { year: d.getFullYear(), month: d.getMonth() };
    renderDeliveryTab();
  }

  function toggleDeliveryCalendar() {
    state.deliveryCalendarOpen = !state.deliveryCalendarOpen;
    if (state.deliveryCalendarOpen) {
      const d = parseISO(state.deliveryDate);
      state.deliveryCalendarMonth = { year: d.getFullYear(), month: d.getMonth() };
    }
    renderDeliveryTab();
  }

  function shiftCalendarMonth(delta) {
    let { year, month } = state.deliveryCalendarMonth;
    month += delta;
    if (month < 0) { month = 11; year--; }
    else if (month > 11) { month = 0; year++; }
    state.deliveryCalendarMonth = { year, month };
    renderDeliveryTab();
  }

  function selectCalendarDate(isoStr) {
    state.deliveryReorderMode = false;
    state.deliveryDate = isoStr;
    state.deliveryCalendarOpen = false;
    renderDeliveryTab();
  }

  function setDeliveryFilter(f) {
    if (f === 'done') state.deliveryReorderMode = false;
    state.deliveryFilter = f;
    renderDeliveryTab();
  }

  function toggleDeliveryCompactMode() {
    state.deliveryCompactMode = !state.deliveryCompactMode;
    renderDeliveryTab();
  }

  /* 7-0. 배달 전 대기 일정 취소(삭제) */
  function confirmCancelPendingDelivery(clientId, source, scheduleId, currentDateStr, targetName) {
    const isRegular = source === 'regular';
    showConfirmModal({
      title: '배송 일정 취소',
      message: isRegular
        ? `'${targetName}'의 ${formatKoreanDate(currentDateStr)} 배송만 취소할까요?\n(매주/격주/매월 정기 방문 요일 설정은 그대로 유지됩니다.)`
        : `'${targetName}'의 예약된 배송 일정을 취소(삭제)할까요?`,
      confirmText: '일정 취소',
      danger: true,
      onConfirm: () => {
        if ((source === 'manual' || source === 'postpone') && scheduleId) {
          state.deliverySchedules = state.deliverySchedules.filter(x => String(x.id) !== String(scheduleId));
        } else if (clientId) {
          state.deliverySchedules.push({
            id: uid(),
            type: 'skip',
            clientId,
            origDate: currentDateStr
          });
        }
        persistDeliveryData();
        showToast(`🗑️ '${targetName}' 배송 일정이 취소되었습니다.`);
        renderDeliveryTab();
      }
    });
  }

  /* 7-1. 내일로 미루기 / 일정 이월 모달 */
  function openPostponeModal(clientId, source, scheduleId, currentDateStr) {
    const schedObj = scheduleId ? state.deliverySchedules.find(x => String(x.id) === String(scheduleId)) : null;
    const isOneTime = !!(schedObj && schedObj.isOneTime);
    const client = (!isOneTime && clientId) ? state.clients.find(c => c.id === clientId) : null;
    const targetName = isOneTime ? (schedObj.customClient?.name || '기타 배송지') : (client ? client.name : '');
    if (!targetName) return;

    const tomorrow = addDaysISO(currentDateStr, 1);
    const dayAfter = addDaysISO(currentDateStr, 2);
    const nextWeek = addDaysISO(currentDateStr, 7);

    openCustomModal(`

        <div class="flex items-center justify-between">

          <button type="button" id="ppNextWeek" class="py-2.5 rounded-xl bg-slate-100 text-slate-800 text-xs font-extrabold active:scale-95">다음 주</button>
        </div>

        <div class="flex items-center gap-2">
          <input type="date" id="ppDateInput" value="${tomorrow}" class="flex-1 border border-slate-300 px-3 py-2 rounded-xl text-xs font-extrabold bg-slate-50" />
          <button type="button" id="ppConfirm" class="px-4 py-2.5 rounded-xl bg-indigo-600 text-white text-xs font-extrabold shrink-0 active:scale-95">날짜 지정</button>

        <div class="pt-2 border-t border-slate-100 grid grid-cols-2 gap-2">
          <button type="button" id="ppSkip" class="py-2.5 rounded-xl bg-rose-50 text-rose-700 border border-rose-200 text-xs font-extrabold active:scale-95">이번 일정 제외</button>
          <button type="button" onclick="closeCustomModal()" class="py-2.5 rounded-xl bg-slate-100 text-slate-600 text-xs font-bold">닫기</button>
        </div>
      </div>
    `);

    const applyPostpone = (targetDate) => {
      if (!targetDate) return;
      if (targetDate === currentDateStr) {
        showToast('⚠️ 현재와 같은 날짜입니다.');
        return;
      }
      if (source === 'manual' && scheduleId) {
        const s = state.deliverySchedules.find(x => String(x.id) === String(scheduleId));
        if (s) s.date = targetDate;
      } else if (source === 'postpone' && scheduleId) {
        const s = state.deliverySchedules.find(x => String(x.id) === String(scheduleId));
        if (s) s.targetDate = targetDate;
      } else {
        state.deliverySchedules.push({
          id: uid(),
          type: 'postpone',
          clientId,
          origDate: currentDateStr,
          targetDate,
          plannedItems: null,
          note: ''
        });

      persistDeliveryData();
      closeCustomModal();
      showToast(`⏭️ ${targetName} 일정이 ${formatKoreanDate(targetDate)}로 이월되었습니다.`);
      renderDeliveryTab();
    };

    document.getElementById('ppTom').onclick = () => applyPostpone(tomorrow);

    document.getElementById('ppSkip').onclick = () => {
      if ((source === 'manual' || source === 'postpone') && scheduleId) {
        state.deliverySchedules = state.deliverySchedules.filter(x => String(x.id) !== String(scheduleId));
      } else {

          id: uid(),
          type: 'skip',
          clientId,
          origDate: currentDateStr
        });

      closeCustomModal();
      showToast(`✅ ${targetName}의 이번 일정만 제외했습니다.`);
      renderDeliveryTab();
    };
  }

            ` : `
              <div class="bg-teal-50/60 border border-teal-200 rounded-2xl p-3 space-y-2.5">
                <div class="text-xs font-extrabold text-teal-900">⚡ 1회성 / 미등록 배송지 직접 입력</div>
                <div>
                  <label class="text-[11px] font-bold text-slate-600 block mb-1">배송지 / 고객명 *</label>
                  <input type="text" id="msCustomName" value="${escapeHtml(customInfo.name)}" placeholder="예: 천안시청 행사장, 홍길동님" class="w-full border border-slate-300 px-3 py-2 rounded-xl text-sm font-bold bg-white outline-none focus:border-teal-500" />
                </div>
                <div class="grid grid-cols-2 gap-2">
                  <div>
                    <label class="text-[11px] font-bold text-slate-600 block mb-1">연락처 (선택)</label>
                    <input type="tel" id="msCustomPhone" value="${escapeHtml(customInfo.phone)}" oninput="formatPhoneInput(this)" placeholder="010-0000-0000" class="w-full border border-slate-300 px-2.5 py-2 rounded-xl text-xs font-bold bg-white outline-none" />
                  </div>
                  <div>
                    <label class="text-[11px] font-bold text-slate-600 block mb-1">결제 방식</label>
                    <select id="msCustomPay" class="w-full border border-slate-300 px-2 py-2 rounded-xl text-xs font-extrabold bg-white">
                      ${DELIVERY_PAYMENT_TYPES.map(p => `<option value="${p}" ${p === customInfo.paymentType ? 'selected' : ''}>${p}</option>`).join('')}
                    </select>
                  </div>
                </div>
                <div>
                  <label class="text-[11px] font-bold text-slate-600 block mb-1">주소 (선택 · 네이버지도 연동)</label>
                  <input type="text" id="msCustomAddr" value="${escapeHtml(customInfo.addr)}" placeholder="도로명 또는 지번 주소" class="w-full border border-slate-300 px-3 py-2 rounded-xl text-xs font-semibold bg-white outline-none" />
                </div>
              </div>
            `}

            <div class="grid grid-cols-3 gap-2 pt-1">
              <button type="button" onclick="closeCustomModal()" class="py-3 rounded-xl bg-slate-100 text-slate-600 font-bold text-sm">취소</button>
              <button type="button" id="msNextStepBtn" class="col-span-2 py-3 rounded-xl bg-indigo-600 text-white font-extrabold text-sm shadow active:scale-95">다음: 품목·수량 지정 →</button>
            </div>
          </div>
        `);

        const msDate = document.getElementById('msDate');
        msDate.onchange = () => { targetDate = msDate.value || todayISO(); };
        document.getElementById('msToday').onclick = () => { targetDate = todayISO(); msDate.value = targetDate; };
        document.getElementById('msTom').onclick = () => { targetDate = tomorrow; msDate.value = targetDate; };
        document.getElementById('msNextW').onclick = () => { targetDate = addDaysISO(todayISO(), 7); msDate.value = targetDate; };

        document.getElementById('msModeClient').onclick = () => {
          if (targetMode === 'custom') saveCustomInputs();
          targetMode = 'client';
          renderModalStep();
        };
        document.getElementById('msModeCustom').onclick = () => {
          targetMode = 'custom';
          renderModalStep();
        };

        function saveCustomInputs() {
          const n = document.getElementById('msCustomName');
          const p = document.getElementById('msCustomPhone');
          const a = document.getElementById('msCustomAddr');
          const pay = document.getElementById('msCustomPay');
          if (n) customInfo.name = n.value.trim();
          if (p) customInfo.phone = p.value.trim();
          if (a) customInfo.addr = a.value.trim();
          if (pay) customInfo.paymentType = pay.value;
        }

        if (targetMode === 'client') {
          const msSearch = document.getElementById('msSearch');
          const msList = document.getElementById('msClientList');

          function drawClientOptions() {
            const kw = (msSearch.value || '').trim().toLowerCase();
            const sorted = [...state.clients].sort((a, b) => (a.name || '').localeCompare(b.name || ''));
            const matched = sorted.filter(c =>
              !kw ||
              (c.name || '').toLowerCase().includes(kw) ||
              getChosung(c.name || '').toLowerCase().includes(kw) ||
              (c.addr || '').toLowerCase().includes(kw)
            );

            if (matched.length === 0) {
              msList.innerHTML = `<div class="p-4 text-center text-xs text-slate-400">검색된 거래처가 없습니다.<br/>위 <b>[✏️ 기타 (직접 입력)]</b>을 눌러 바로 등록할 수 있습니다.</div>`;
              return;
            }

            msList.innerHTML = matched.map(c => {
              const isSel = c.id === selectedId;
              const isPet = isPetOnlyClient(c);
              const qtyHint = isPet ? formatUnitDisplay(c.qty, '팩', '') : formatUnitDisplay(c.qty, '통', '');
              return `
                <button type="button" data-cid="${c.id}" class="ms-client-opt w-full px-3 py-2.5 text-left flex items-center justify-between text-xs transition ${isSel ? 'bg-indigo-600 text-white font-extrabold' : 'hover:bg-slate-50 text-slate-800 font-bold'}">
                  <span class="truncate">${escapeHtml(c.name)}</span>
                  <span class="text-[11px] shrink-0 ml-2 ${isSel ? 'text-indigo-100' : 'text-slate-400'}">${qtyHint}</span>
                </button>
              `;
            }).join('');

            msList.querySelectorAll('.ms-client-opt').forEach(btn => {
              btn.onclick = () => {
                selectedId = Number(btn.dataset.cid);
                drawClientOptions();
              };
            });
          }

          msSearch.oninput = drawClientOptions;
          drawClientOptions();
        }

        document.getElementById('msNextStepBtn').onclick = () => {
          targetDate = msDate.value || todayISO();
          if (targetMode === 'client') {
            if (!selectedId) {
              showToast('⚠️ 거래처를 선택하거나 [기타 (직접 입력)]을 이용해 주세요.');
              return;
            }
          } else {
            saveCustomInputs();
            if (!customInfo.name) {
              showToast('⚠️ 배송지 또는 고객명을 입력해 주세요.');
              document.getElementById('msCustomName')?.focus();
              return;
            }
          }
          step = 2;
          renderModalStep();
        };
      } else {
        // STEP 2: 배송 품목 및 수량 지정 화면
        const client = targetMode === 'client' ? state.clients.find(c => c.id === selectedId) : null;
        const displayTitle = client ? client.name : customInfo.name;
        const isPet = client ? isPetOnlyClient(client) : false;

        openCustomModal(`
          <div class="bg-white rounded-2xl p-4 w-full max-w-md shadow-2xl border border-slate-200 space-y-3 max-h-[92vh] overflow-y-auto">
            <div class="flex items-center justify-between">
              <div>
                <div class="text-base font-extrabold text-indigo-800">📦 배송 품목 · 수량 지정 (2/2단계)</div>
                <div class="text-xs font-bold text-slate-600 mt-0.5">
                  ${escapeHtml(displayTitle)}
                  ${targetMode === 'custom' ? `<span class="px-1.5 py-0.5 rounded bg-teal-100 text-teal-800 text-[10px] font-extrabold ml-1">1회성</span>` : ''}
                  · ${formatKoreanDate(targetDate)}
                </div>
              </div>
              <button type="button" onclick="closeCustomModal()" class="w-8 h-8 rounded-full bg-slate-100 text-slate-600 font-extrabold">✕</button>
            </div>

            <button type="button" id="msSaveUnspecifiedBtn" class="w-full py-2.5 px-3 rounded-xl bg-slate-100 hover:bg-slate-200 border border-slate-300 text-slate-800 text-xs font-extrabold flex items-center justify-between active:scale-[0.99] transition">
              <span>📋 수량 미정으로 바로 등록 (방문 후 현장 확인)</span>
              <span class="text-indigo-600">바로등록 →</span>
            </button>

            <div class="bg-indigo-50/70 border border-indigo-200 rounded-2xl p-3 flex items-center justify-between gap-2">
              <div>
                <div class="text-xs font-extrabold text-indigo-950">🚰 18.9L 생수 (통)</div>
                <div class="text-[11px] text-indigo-700">
                  ${client && !isPet && client.qty ? `거래처 기본: ${escapeHtml(String(client.qty))}` : '필요 시 수량 입력 (0 = 미지정)'}
                </div>
              </div>
              <div class="flex items-center gap-1 shrink-0">
                <button type="button" id="ms189Minus" class="w-9 h-9 rounded-lg bg-white border border-slate-300 font-extrabold text-slate-700">−</button>
                <input id="ms189Qty" type="number" inputmode="numeric" value="${qty189Val}" class="w-16 border border-slate-300 py-1.5 px-2 rounded-lg text-right font-extrabold text-sm bg-white" />
                <button type="button" id="ms189Plus" class="w-9 h-9 rounded-lg bg-white border border-slate-300 font-extrabold text-slate-700">+</button>
              </div>
            </div>

            <div class="border border-slate-200 rounded-2xl p-3 bg-slate-50/70 space-y-2">
              <div class="flex items-center justify-between">
                <span class="text-xs font-extrabold text-slate-800">🧴 기타 품목 (패트 · 종이컵 등)</span>
                ${isPet && client?.qty ? `<span class="text-[11px] font-bold text-teal-700">거래처 기본: ${escapeHtml(String(client.qty))}</span>` : ''}
              </div>
              <div class="space-y-1.5 max-h-48 overflow-y-auto pr-0.5">
                ${otherCatalog.map((it, idx) => `
                  <div class="bg-white border border-slate-200 rounded-xl px-2.5 py-2 flex items-center justify-between gap-2">
                    <span class="text-xs font-extrabold text-slate-800 truncate">${escapeHtml(it.name)}</span>
                    <div class="flex items-center gap-1 shrink-0">
                      <button type="button" data-ms-ex-step="-1" data-ms-ex-idx="${idx}" class="ms-ex-btn w-8 h-8 rounded-lg bg-slate-100 font-extrabold text-slate-700">−</button>
                      <input data-ms-ex-qty="${idx}" data-ms-ex-name="${escapeHtml(it.name)}" type="number" inputmode="numeric" value="${extraQtyMap[it.name] || 0}" class="w-14 border border-slate-300 py-1 px-1.5 rounded-lg text-right font-extrabold text-xs bg-white" />
                      <button type="button" data-ms-ex-step="1" data-ms-ex-idx="${idx}" class="ms-ex-btn w-8 h-8 rounded-lg bg-slate-100 font-extrabold text-slate-700">+</button>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>

            <div class="space-y-1">
              <label class="text-xs font-bold text-slate-600 block">예약 메모 (선택)</label>
              <input type="text" id="msNote" value="${escapeHtml(memoVal)}" placeholder="예: 오전 도착 요청, 문 앞에 놓아주세요" class="w-full border border-slate-300 px-3 py-2 rounded-xl text-xs bg-slate-50 outline-none focus:bg-white" />
            </div>

            <div class="grid grid-cols-3 gap-2 pt-1">
              <button type="button" id="msBackStepBtn" class="py-3 rounded-xl bg-slate-100 text-slate-700 font-bold text-sm">← 이전</button>
              <button type="button" id="msSaveFinalBtn" class="col-span-2 py-3 rounded-xl bg-indigo-600 text-white font-extrabold text-sm shadow active:scale-95">✅ 일정 등록 완료</button>
            </div>
          </div>
        `);

        const inp189 = document.getElementById('ms189Qty');
        bindAutoSelectInput(inp189);
        document.getElementById('ms189Minus').onclick = () => { inp189.value = Math.max(0, num(inp189.value) - 1); };
        document.getElementById('ms189Plus').onclick = () => { inp189.value = num(inp189.value) + 1; };

        document.querySelectorAll('.ms-ex-btn').forEach(btn => {
          btn.onclick = () => {
            const idx = btn.dataset.msExIdx;
            const stepVal = Number(btn.dataset.msExStep);
            const inp = document.querySelector(`input[data-ms-ex-qty="${idx}"]`);
            if (inp) inp.value = Math.max(0, num(inp.value) + stepVal);
          };
        });
        document.querySelectorAll('input[data-ms-ex-qty]').forEach(bindAutoSelectInput);

        function captureStep2State() {
          qty189Val = num(inp189.value);
          document.querySelectorAll('input[data-ms-ex-qty]').forEach(inp => {
            extraQtyMap[inp.dataset.msExName] = num(inp.value);
          });
          memoVal = (document.getElementById('msNote')?.value || '').trim();
        }

        document.getElementById('msBackStepBtn').onclick = () => {
          captureStep2State();
          step = 1;
          renderModalStep();
        };

        function commitSchedule(ignoreQuantities = false) {
          captureStep2State();
          let plannedItems = null;
          if (!ignoreQuantities) {
            const extras = [];
            Object.keys(extraQtyMap).forEach(name => {
              if (num(extraQtyMap[name]) > 0) extras.push({ name, qty: num(extraQtyMap[name]) });
            });
            if (qty189Val > 0 || extras.length > 0) {
              plannedItems = { qty189: qty189Val, extraItems: extras };
            }
          }

          if (targetMode === 'custom') {
            state.deliverySchedules.push({
              id: uid(),
              type: 'manual',
              isOneTime: true,
              clientId: null,
              customClient: { ...customInfo },
              date: targetDate,
              plannedItems,
              note: memoVal
            });
          } else {
            state.deliverySchedules = state.deliverySchedules.filter(
              s => !(s.type === 'skip' && s.clientId === selectedId && s.origDate === targetDate)
            );
            const exists = state.deliverySchedules.find(
              s => s.type === 'manual' && !s.isOneTime && s.clientId === selectedId && s.date === targetDate
            );
            if (exists) {
              exists.plannedItems = plannedItems;
              exists.note = memoVal || exists.note;
            } else {
              state.deliverySchedules.push({
                id: uid(),
                type: 'manual',
                isOneTime: false,
                clientId: selectedId,
                date: targetDate,
                plannedItems,
                note: memoVal
              });
            }
          }

          persistDeliveryData();
          closeCustomModal();
          const summaryBadge = formatPlannedItemsSummary(plannedItems);
          showToast(
            summaryBadge
              ? `📅 ${displayTitle} (${summaryBadge}) 등록 완료!`
              : `📅 ${displayTitle} (수량 미정) 등록 완료!`
          );
          if (state.activeTab === 'delivery') {
            state.deliveryDate = targetDate;
            renderDeliveryTab();
          }
        }

        document.getElementById('msSaveUnspecifiedBtn').onclick = () => commitSchedule(true);
        document.getElementById('msSaveFinalBtn').onclick = () => commitSchedule(false);
      }
    }

    renderModalStep();
  }

  /* 7-3. 배송 완료 모달 (빈통 회수 자동 연동 + 수정 단가 거래처 정보 자동 반영) */
  function openCompleteDeliveryModal(clientId, dateStr, editingRecord = null, scheduleId = '') {
    const schedObj = scheduleId ? state.deliverySchedules.find(s => String(s.id) === String(scheduleId)) : null;
    const isOneTime = editingRecord ? !!editingRecord.isOneTime : !!(schedObj && schedObj.isOneTime);
    const client = (!isOneTime && clientId) ? state.clients.find(c => c.id === clientId) : null;
    if (!client && !isOneTime && !editingRecord) return;

    const customClient = schedObj?.customClient || null;
    const cName = editingRecord
      ? editingRecord.clientName
      : (isOneTime ? (customClient?.name || '기타 배송지') : client.name);
    const isPet = isPetOnlyClient(client);
    const planned = editingRecord ? null : (schedObj?.plannedItems || null);

    let defaultQty189 = 1;
    if (editingRecord) {
      defaultQty189 = num(editingRecord.qty189);
    } else if (planned) {
      defaultQty189 = num(planned.qty189);
    } else if (isOneTime || isPet) {
      defaultQty189 = 0;
    } else {
      defaultQty189 = parseClientNum(client?.qty) || 1;
    }

    const defaultPrice189 = editingRecord ? num(editingRecord.price189) : parseClientNum(client?.price);
    const defaultEmpty = editingRecord ? num(editingRecord.emptyReturned) : (isOneTime || isPet ? 0 : defaultQty189);

    const rawPayType = editingRecord
      ? editingRecord.paymentType
      : (isOneTime ? customClient?.paymentType : client?.paymentType);
    const defaultPay = DELIVERY_PAYMENT_TYPES.includes(rawPayType) ? rawPayType : '월말정산';
    const defaultPaid = editingRecord ? !!editingRecord.paid : (defaultPay !== '월말정산');

    const otherCatalog = state.items.filter(it => it.name !== '18.9L');
    const prefilledExtras = editingRecord
      ? (editingRecord.extraItems || [])
      : (planned?.extraItems || []);
    const hasInitialExtra = prefilledExtras.length > 0 || isPet || (isOneTime && defaultQty189 === 0);

    openCustomModal(`
      <div class="bg-white rounded-2xl p-4 w-full max-w-md shadow-2xl border border-slate-200 space-y-3.5 max-h-[92vh] overflow-y-auto">
        <div class="flex items-center justify-between">
          <div>
            <div class="text-base font-extrabold text-emerald-700">${editingRecord ? '✏️ 배송 내역 수정' : '✅ 배송 완료 기록'}</div>
            <div class="text-xs font-bold text-slate-500">
              ${escapeHtml(cName)}
              ${isOneTime ? `<span class="px-1.5 py-0.5 rounded bg-teal-100 text-teal-800 text-[10px] font-extrabold ml-1">1회성</span>` : ''}
              · ${dateStr}
            </div>
          </div>
          <button type="button" onclick="closeCustomModal()" class="w-8 h-8 rounded-full bg-slate-100 text-slate-600 font-extrabold">✕</button>
        </div>

        <!-- 18.9L 기본 납품 영역 -->
        <div class="bg-indigo-50/60 border border-indigo-200 rounded-2xl p-3 space-y-2.5">
          <div class="flex items-center justify-between">
            <span class="text-xs font-extrabold text-indigo-900">🚰 18.9L 생수 납품 (기본)</span>
            ${client && !isPet ? `<span class="text-[11px] font-bold text-indigo-700">현재 통재고 ${parseClientNum(client.stock)}개</span>` : `<span class="text-[11px] font-bold text-slate-500">${isOneTime ? '1회성 배송' : '패트 거래처'}</span>`}
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="text-[11px] font-bold text-slate-600 block mb-1">납품 수량 (통)</label>
              <div class="flex items-center gap-1">
                <button type="button" id="cdQtyMinus" class="w-9 h-9 rounded-lg bg-white border border-slate-300 font-extrabold text-slate-700">−</button>
                <input id="cdQty189" type="number" inputmode="numeric" value="${defaultQty189}" class="w-full min-w-0 border border-slate-300 py-1.5 px-2 rounded-lg text-right font-extrabold text-sm bg-white" />
                <button type="button" id="cdQtyPlus" class="w-9 h-9 rounded-lg bg-white border border-slate-300 font-extrabold text-slate-700">+</button>
              </div>
            </div>
            <div>
              <label class="text-[11px] font-bold text-slate-600 block mb-1">18.9L 단가 (원)</label>
              <input id="cdPrice189" type="number" inputmode="numeric" value="${defaultPrice189}" class="w-full border border-slate-300 py-2 px-2.5 rounded-lg text-right font-extrabold text-sm bg-white" />
            </div>
          </div>

          <div class="pt-2 border-t border-indigo-200/70 flex items-center justify-between gap-2">
            <div>
              <div class="text-xs font-extrabold text-slate-800">♻️ 빈통 회수 (개)</div>
              <div id="cdStockPreview" class="text-[11px] text-indigo-700 font-bold">${isOneTime ? '1회성 배송 (통재고 미연동)' : ''}</div>
            </div>
            <div class="flex items-center gap-1 shrink-0">
              <button type="button" id="cdEmptyMinus" class="w-9 h-9 rounded-lg bg-white border border-slate-300 font-extrabold text-slate-700">−</button>
              <input id="cdEmpty" type="number" inputmode="numeric" value="${defaultEmpty}" class="w-16 border border-slate-300 py-1.5 px-2 rounded-lg text-right font-extrabold text-sm bg-white" />
              <button type="button" id="cdEmptyPlus" class="w-9 h-9 rounded-lg bg-white border border-slate-300 font-extrabold text-slate-700">+</button>
            </div>
          </div>
        </div>

        <!-- 기타 품목 접기/펼치기 영역 -->
        <div class="border border-slate-200 rounded-2xl bg-slate-50/80 overflow-hidden">
          <button type="button" id="cdToggleExtraBtn" class="w-full px-3 py-2.5 flex items-center justify-between text-xs font-extrabold text-slate-700">
            <span id="cdToggleExtraLabel">${hasInitialExtra ? '▲ 기타 품목 접기' : '▼ 기타 품목 추가 (500ml·2.0L·종이컵 등)'}</span>
            <span id="cdExtraCountBadge" class="hidden px-2 py-0.5 rounded-full bg-indigo-100 text-indigo-700 text-[10px] font-extrabold"></span>
          </button>
          <div id="cdExtraWrap" class="${hasInitialExtra ? 'block' : 'hidden'} p-2.5 pt-0 space-y-2 border-t border-slate-200/70">
            <div class="text-[10px] text-slate-400 pt-2">※ 수정한 18.9L 단가와 기타 품목 판매가는 거래처 정보에 자동 기억됩니다.</div>
            ${otherCatalog.map((it, idx) => {
              const found = prefilledExtras.find(x => x.name === it.name);
              const qVal = found ? found.qty : 0;
              const clientSavedPrice = (client && client.customItemPrices && client.customItemPrices[it.name] !== undefined)
                ? num(client.customItemPrices[it.name])
                : 0;
              const pVal = (found && found.price !== undefined) ? num(found.price) : clientSavedPrice;
              return `
                <div class="bg-white border border-slate-200 rounded-xl p-2 flex items-center justify-between gap-2">
                  <div class="min-w-0 flex-1">
                    <div class="text-xs font-extrabold text-slate-800 truncate">${escapeHtml(it.name)}</div>
                    <div class="flex items-center gap-1 mt-1">
                      <span class="text-[10px] text-slate-400">판매가</span>
                      <input data-ex-price="${idx}" data-ex-name="${escapeHtml(it.name)}" type="number" inputmode="numeric" value="${pVal}" class="w-20 border border-slate-200 px-1.5 py-0.5 rounded text-right text-xs font-bold bg-slate-50" />
                      <span class="text-[10px] text-slate-400">원</span>
                    </div>
                  </div>
                  <div class="flex items-center gap-1 shrink-0">
                    <button type="button" data-ex-step="-1" data-ex-idx="${idx}" class="cd-ex-btn w-8 h-8 rounded-lg bg-slate-100 font-extrabold text-slate-700">−</button>
                    <input data-ex-qty="${idx}" data-ex-name="${escapeHtml(it.name)}" type="number" inputmode="numeric" value="${qVal}" class="w-12 border border-slate-300 py-1 px-1.5 rounded-lg text-right font-extrabold text-xs bg-white" />
                    <button type="button" data-ex-step="1" data-ex-idx="${idx}" class="cd-ex-btn w-8 h-8 rounded-lg bg-slate-100 font-extrabold text-slate-700">+</button>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>

        <!-- 결제 방식 및 수금 여부 -->
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-[11px] font-bold text-slate-500 block mb-1">결제 방식</label>
            <select id="cdPayType" class="w-full border border-slate-300 px-2.5 py-2 rounded-xl text-xs font-extrabold bg-slate-50">
              ${DELIVERY_PAYMENT_TYPES.map(p => `<option value="${p}" ${p === defaultPay ? 'selected' : ''}>${p}</option>`).join('')}
            </select>
          </div>
          <div>
            <label class="text-[11px] font-bold text-slate-500 block mb-1">수금 상태</label>
            <button type="button" id="cdPaidToggle" class="w-full py-2 rounded-xl text-xs font-extrabold border transition"></button>
          </div>
        </div>

        <input type="text" id="cdMemo" value="${escapeHtml(editingRecord?.memo || schedObj?.note || '')}" placeholder="배송 메모 (선택)" class="w-full border border-slate-200 px-3 py-2 rounded-xl text-xs bg-slate-50 outline-none" />

        <!-- 총 납품 금액 -->
        <div class="flex items-center justify-between bg-slate-900 text-white rounded-2xl px-4 py-3">
          <span class="text-xs font-bold text-slate-300">총 납품 매출</span>
          <span id="cdTotalAmt" class="text-xl font-extrabold text-emerald-400">0원</span>
        </div>

        <div class="grid grid-cols-3 gap-2">
          <button type="button" onclick="closeCustomModal()" class="py-3 rounded-xl bg-slate-100 text-slate-600 font-bold text-sm">취소</button>
          <button type="button" id="cdSaveBtn" class="col-span-2 py-3 rounded-xl bg-emerald-600 text-white font-extrabold text-sm shadow-md active:scale-95">
            ${editingRecord ? '수정 저장' : '✅ 배송 완료 저장'}
          </button>
        </div>
      </div>
    `);

    const qty189El = document.getElementById('cdQty189');
    const price189El = document.getElementById('cdPrice189');
    const emptyEl = document.getElementById('cdEmpty');
    const payTypeEl = document.getElementById('cdPayType');
    const paidToggleBtn = document.getElementById('cdPaidToggle');
    const extraWrap = document.getElementById('cdExtraWrap');
    const extraLabel = document.getElementById('cdToggleExtraLabel');
    const extraBadge = document.getElementById('cdExtraCountBadge');

    let isPaid = defaultPaid;
    let prevQty189 = defaultQty189;
    let emptyManualTouched = false;

    function updatePaidUI() {
      if (isPaid) {
        paidToggleBtn.className = 'w-full py-2 rounded-xl text-xs font-extrabold border bg-emerald-600 text-white border-emerald-600 transition';
        paidToggleBtn.innerText = '✅ 수금 완료';
      } else {
        paidToggleBtn.className = 'w-full py-2 rounded-xl text-xs font-extrabold border bg-rose-50 text-rose-700 border-rose-300 transition';
        paidToggleBtn.innerText = '⏳ 미수금';
      }
    }

    function recalcDeliveryModal() {
      const q189 = num(qty189El.value);
      const p189 = num(price189El.value);
      const emp = num(emptyEl.value);
      let total = q189 * p189;

      let activeExtraCount = 0;
      extraWrap.querySelectorAll('input[data-ex-qty]').forEach(qInp => {
        const idx = qInp.dataset.exQty;
        const q = num(qInp.value);
        const pInp = extraWrap.querySelector(`input[data-ex-price="${idx}"]`);
        const p = num(pInp?.value);
        if (q !== 0) {
          activeExtraCount++;
          total += q * p;
        }
      });

      document.getElementById('cdTotalAmt').innerText = money(total);

      if (activeExtraCount > 0) {
        extraBadge.classList.remove('hidden');
        extraBadge.innerText = `${activeExtraCount}종 선택`;
      } else {
        extraBadge.classList.add('hidden');
      }

      if (client && !isPet) {
        const baseStock = editingRecord
          ? Math.max(0, parseClientNum(client.stock) - num(editingRecord.stockDelta))
          : parseClientNum(client.stock);
        const nextStock = Math.max(0, baseStock + (q189 - emp));
        const delta = q189 - emp;
        const deltaStr = delta > 0 ? `+${delta}` : String(delta);
        document.getElementById('cdStockPreview').innerText = `반영 후 통재고: ${nextStock}개 (${deltaStr})`;
      }
      return total;
    }

    // 18.9L 납품 수량 변경 시 빈통 회수 수량도 자동 연동 (수동 조절도 자유롭게 가능)
    function handleQty189Change(newVal) {
      const safeNew = Math.max(0, num(newVal));
      qty189El.value = safeNew;
      if (!isOneTime && !isPet) {
        if (!emptyManualTouched) {
          emptyEl.value = safeNew;
        } else {
          const diff = safeNew - prevQty189;
          emptyEl.value = Math.max(0, num(emptyEl.value) + diff);
        }
      }
      prevQty189 = safeNew;
      recalcDeliveryModal();
    }

    document.getElementById('cdQtyMinus').onclick = () => handleQty189Change(num(qty189El.value) - 1);
    document.getElementById('cdQtyPlus').onclick = () => handleQty189Change(num(qty189El.value) + 1);
    qty189El.addEventListener('input', () => handleQty189Change(qty189El.value));

    document.getElementById('cdEmptyMinus').onclick = () => {
      emptyManualTouched = true;
      emptyEl.value = Math.max(0, num(emptyEl.value) - 1);
      recalcDeliveryModal();
    };
    document.getElementById('cdEmptyPlus').onclick = () => {
      emptyManualTouched = true;
      emptyEl.value = num(emptyEl.value) + 1;
      recalcDeliveryModal();
    };
    emptyEl.addEventListener('input', () => {
      emptyManualTouched = true;
      recalcDeliveryModal();
    });

    document.getElementById('cdToggleExtraBtn').onclick = () => {
      const hidden = extraWrap.classList.toggle('hidden');
      extraLabel.innerText = hidden ? '▼ 기타 품목 추가 (500ml·2.0L·종이컵 등)' : '▲ 기타 품목 접기';
    };

    extraWrap.querySelectorAll('.cd-ex-btn').forEach(btn => {
      btn.onclick = () => {
        const idx = btn.dataset.exIdx;
        const step = Number(btn.dataset.exStep);
        const inp = extraWrap.querySelector(`input[data-ex-qty="${idx}"]`);
        inp.value = Math.max(0, num(inp.value) + step);
        recalcDeliveryModal();
      };
    });

    [qty189El, price189El, emptyEl].forEach(bindAutoSelectInput);
    price189El.addEventListener('input', recalcDeliveryModal);
    extraWrap.querySelectorAll('input[type="number"]').forEach(el => {
      bindAutoSelectInput(el);
      el.addEventListener('input', recalcDeliveryModal);
    });

    payTypeEl.onchange = () => {
      isPaid = payTypeEl.value !== '월말정산';
      updatePaidUI();
    };
    paidToggleBtn.onclick = () => {
      isPaid = !isPaid;
      updatePaidUI();
    };

    document.getElementById('cdSaveBtn').onclick = () => {
      const q189 = num(qty189El.value);
      const p189 = num(price189El.value);
      const emp = num(emptyEl.value);

      const extraItems = [];
      let clientUpdated = false;
      if (client && (!client.customItemPrices || typeof client.customItemPrices !== 'object')) {
        client.customItemPrices = {};
      }

      extraWrap.querySelectorAll('input[data-ex-qty]').forEach(qInp => {
        const idx = qInp.dataset.exQty;
        const q = num(qInp.value);
        const pInp = extraWrap.querySelector(`input[data-ex-price="${idx}"]`);
        const p = num(pInp?.value);
        const name = qInp.dataset.exName;
        if (q > 0) {
          extraItems.push({ name, qty: q, price: p });
        }
        if (client) {
          if (p > 0 && client.customItemPrices[name] !== p) {
            client.customItemPrices[name] = p;
            clientUpdated = true;
          } else if (p === 0 && client.customItemPrices[name] !== undefined && client.customItemPrices[name] !== 0) {
            client.customItemPrices[name] = 0;
            clientUpdated = true;
          }
        }
      });

      // 수정된 18.9L 단가를 거래처 탭의 거래처 정보에도 자동 반영
      if (client && p189 > 0 && parseClientNum(client.price) !== p189) {
        client.price = p189.toLocaleString();
        clientUpdated = true;
      }

      if (q189 === 0 && emp === 0 && extraItems.length === 0) {
        if (clientUpdated) persistClients();
        showToast('⚠️ 납품 수량 또는 회수 수량을 입력해 주세요.');
        return;
      }

      const totalAmount = recalcDeliveryModal();
      const newDelta = (client && !isPet) ? (q189 - emp) : 0;

      if (client && !isPet) {
        const baseStock = editingRecord
          ? Math.max(0, parseClientNum(client.stock) - num(editingRecord.stockDelta))
          : parseClientNum(client.stock);
        const nextStock = Math.max(0, baseStock + newDelta);
        client.stock = String(nextStock);
        clientUpdated = true;
      }

      if (client && clientUpdated) {
        persistClients();
      }

      const recordObj = {
        id: editingRecord ? editingRecord.id : uid(),
        date: dateStr,
        isOneTime,
        scheduleId: editingRecord ? (editingRecord.scheduleId || '') : (scheduleId || ''),
        clientId: isOneTime ? null : clientId,
        clientName: cName,
        qty189: q189,
        price189: p189,
        emptyReturned: emp,
        extraItems,
        totalAmount,
        paymentType: payTypeEl.value,
        paid: isPaid,
        paidAmount: isPaid ? totalAmount : (editingRecord ? Math.min(totalAmount, num(editingRecord.paidAmount)) : 0),
        paidAt: isPaid ? (editingRecord?.paidAt || todayISO()) : '',
        memo: (document.getElementById('cdMemo').value || '').trim(),
        stockDelta: newDelta,
        createdAt: editingRecord ? editingRecord.createdAt : Date.now()
      };

      if (editingRecord) {
        const idx = state.deliveryRecords.findIndex(r => r.id === editingRecord.id);
        if (idx > -1) state.deliveryRecords[idx] = recordObj;
      } else {
        state.deliveryRecords.push(recordObj);
      }

      persistDeliveryData();
      closeCustomModal();
      showToast(editingRecord ? '✅ 배송 내역이 수정되었습니다.' : `✅ ${cName} 배송 완료 (${money(totalAmount)})`);
      renderApp();
    };

    updatePaidUI();
    recalcDeliveryModal();
  }

  // 완료된 배송 전표 관리 (수정 / 수금상태 전환 / 삭제)
  function openDeliveryRecordMenu(recordId) {
    const rec = state.deliveryRecords.find(r => r.id === recordId);
    if (!rec) return;
    const rem = getRecordUnpaidAmount(rec);

    openCustomModal(`
      <div class="bg-white rounded-2xl p-5 w-full max-w-xs shadow-2xl border border-slate-200 space-y-2.5 text-center">
        <div class="text-base font-extrabold text-slate-900">${escapeHtml(rec.clientName)}</div>
        <div class="text-xs text-slate-500 pb-1">${rec.date} · 총 ${money(rec.totalAmount)} (${rec.paid ? '수금완료' : `미수잔액 ${money(rem)}`})</div>
        <button type="button" id="drTogglePaid" class="w-full py-3 rounded-xl ${rec.paid ? 'bg-amber-50 text-amber-800 border border-amber-300' : 'bg-emerald-600 text-white'} font-extrabold text-sm active:scale-95">
          ${rec.paid ? '⏳ 미수금으로 변경' : '✅ 전액 수금 완료 처리'}
        </button>
        <button type="button" id="drEdit" class="w-full py-3 rounded-xl bg-indigo-600 text-white font-extrabold text-sm active:scale-95">✏️ 내역 수정</button>
        <button type="button" id="drDel" class="w-full py-3 rounded-xl bg-rose-50 text-rose-600 border border-rose-200 font-extrabold text-sm active:scale-95">🗑️ 배송 취소 (통재고 복구)</button>
        <button type="button" onclick="closeCustomModal()" class="w-full py-2.5 rounded-xl bg-slate-100 text-slate-600 font-bold text-sm">닫기</button>
      </div>
    `);

    document.getElementById('drTogglePaid').onclick = () => {
      rec.paid = !rec.paid;
      rec.paidAmount = rec.paid ? num(rec.totalAmount) : 0;
      rec.paidAt = rec.paid ? todayISO() : '';
      persistDeliveryData();
      closeCustomModal();
      showToast(rec.paid ? '✅ 수금 완료로 처리되었습니다.' : '⏳ 미수금 상태로 변경되었습니다.');
      renderApp();
    };

    document.getElementById('drEdit').onclick = () => {
      closeCustomModal();
      openCompleteDeliveryModal(rec.clientId, rec.date, rec);
    };

    document.getElementById('drDel').onclick = () => {
      closeCustomModal();
      showConfirmModal({
        title: '배송 완료 취소',
        message: `${rec.clientName} (${rec.date}) 배송 기록을 삭제할까요?\n반영된 거래처 통재고도 함께 되돌려집니다.`,
        confirmText: '삭제하기',
        danger: true,
        onConfirm: () => {
          const client = state.clients.find(c => c.id === rec.clientId);
          if (client && rec.stockDelta) {
            client.stock = String(Math.max(0, parseClientNum(client.stock) - num(rec.stockDelta)));
            persistClients();
          }
          state.deliveryRecords = state.deliveryRecords.filter(r => r.id !== rec.id);
          persistDeliveryData();
          showToast('🗑️ 배송 기록이 취소되고 통재고가 복구되었습니다.');
          renderApp();
        }
      });
    };
  }

  /* ===================================================================
   * 8. TAB 4: 매출 · 미수금 · 거래처별 원장
   * =================================================================== */
  function renderSalesTab() {
    const unpaidAll = state.deliveryRecords.filter(r => getRecordUnpaidAmount(r) > 0);
    const unpaidClientCount = new Set(unpaidAll.map(r => String(r.clientId || r.clientName))).size;
    const isClientBadge = state.unpaidBadgeMode === 'clients';
    const unpaidTabLabel = isClientBadge
      ? `💳 미수 (${unpaidClientCount}곳)`
      : `💳 미수 (${unpaidAll.length}건)`;

    setHeader({
      title: '💰 매출 · 미수금',
      badge: state.salesSubTab === 'unpaid'
        ? (isClientBadge ? `거래처 ${unpaidClientCount}곳` : `전표 ${unpaidAll.length}건`)
        : (state.salesSubTab === 'ledger' ? '거래처 원장' : '집계'),
      showBack: false,
      rightHtml: `
        <button type="button" onclick="exportSalesCSV()" class="px-2.5 py-1.5 rounded-lg bg-emerald-600 text-white text-xs font-extrabold active:scale-95">
          📊 CSV
        </button>
      `
    });

    const main = document.getElementById('appMain');
    main.innerHTML = `
      <div class="space-y-3.5">
        <!-- 서브 탭 전환 (매출 요약 / 거래처별 원장 / 미수금) -->
        <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm p-1.5 grid grid-cols-3 gap-1">
          <button type="button" onclick="setSalesSubTab('summary')" class="py-2.5 px-1 rounded-xl text-xs font-extrabold transition whitespace-nowrap ${
            state.salesSubTab === 'summary' ? 'bg-indigo-600 text-white shadow-sm' : 'text-slate-600'
          }">📊 매출 요약</button>
          <button type="button" onclick="setSalesSubTab('ledger')" class="py-2.5 px-1 rounded-xl text-xs font-extrabold transition whitespace-nowrap ${
            state.salesSubTab === 'ledger' ? 'bg-slate-900 text-white shadow-sm' : 'text-slate-600'
          }">🏢 거래처 원장</button>
          <button type="button" onclick="onClickUnpaidSubTab()" title="터치 시 미수 거래처 수 / 전표 건수 전환" class="py-2.5 px-1 rounded-xl text-xs font-extrabold transition whitespace-nowrap truncate ${
            state.salesSubTab === 'unpaid' ? 'bg-rose-600 text-white shadow-sm' : 'text-slate-600'
          }">${unpaidTabLabel}</button>
        </div>

        <div id="salesContentArea"></div>
      </div>
    `;

    if (state.salesSubTab === 'summary') renderSalesSummaryView();
    else if (state.salesSubTab === 'ledger') renderClientLedgerTabView();
    else renderUnpaidView();
  }

  function onClickUnpaidSubTab() {
    if (state.salesSubTab === 'unpaid') {
      state.unpaidBadgeMode = state.unpaidBadgeMode === 'clients' ? 'records' : 'clients';
      showToast(state.unpaidBadgeMode === 'clients' ? '🏢 미수 거래처 수 기준으로 표시합니다.' : '📄 미수 전표 건수 기준으로 표시합니다.');
    } else {
      state.salesSubTab = 'unpaid';
    }
    renderSalesTab();
  }

  function setSalesSubTab(sub) {
    state.salesSubTab = sub;
    renderSalesTab();
  }

  function setSalesQuickPeriod(mode) {
    state.salesQuickPeriod = mode;
    const now = new Date();
    if (mode === 'today') {
      state.salesStart = todayISO();
      state.salesEnd = todayISO();
    } else if (mode === 'thisMonth') {
      state.salesStart = toLocalISO(new Date(now.getFullYear(), now.getMonth(), 1));
      state.salesEnd = todayISO();
    } else if (mode === 'lastMonth') {
      state.salesStart = toLocalISO(new Date(now.getFullYear(), now.getMonth() - 1, 1));
      state.salesEnd = toLocalISO(new Date(now.getFullYear(), now.getMonth(), 0));
    }
    renderSalesTab();
  }

  function renderSalesSummaryView() {
    const s = state.salesStart;
    const e = state.salesEnd;
    const records = state.deliveryRecords.filter(r => r.date >= s && r.date <= e);

    const totalSales = records.reduce((acc, r) => acc + num(r.totalAmount), 0);
    const paidSales = records.reduce((acc, r) => acc + getRecordPaidAmount(r), 0);
    const unpaidSales = records.reduce((acc, r) => acc + getRecordUnpaidAmount(r), 0);

    const outgoPurchase = state.outgoRecords
      .filter(r => r.date >= s && r.date <= e)
      .reduce((acc, r) => acc + num(r.total), 0);
    const inboundPurchase = state.inboundRecords
      .filter(r => r.type === 'personal_inbound' && r.date >= s && r.date <= e)
      .reduce((acc, r) => acc + num(r.amount), 0);
    const totalPurchase = outgoPurchase + inboundPurchase;
    const marginDiff = totalSales - totalPurchase;

    const byPay = {};
    DELIVERY_PAYMENT_TYPES.forEach(p => byPay[p] = 0);
    records.forEach(r => {
      const k = r.paymentType || '월말정산';
      byPay[k] = (byPay[k] || 0) + num(r.totalAmount);
    });

    const byItem = {};
    records.forEach(r => {
      if (num(r.qty189) > 0) {
        if (!byItem['18.9L']) byItem['18.9L'] = { qty: 0, amt: 0 };
        byItem['18.9L'].qty += num(r.qty189);
        byItem['18.9L'].amt += num(r.qty189) * num(r.price189);
      }
      (r.extraItems || []).forEach(ex => {
        if (!byItem[ex.name]) byItem[ex.name] = { qty: 0, amt: 0 };
        byItem[ex.name].qty += num(ex.qty);
        byItem[ex.name].amt += num(ex.qty) * num(ex.price);
      });
    });

    const byDate = {};
    records.forEach(r => {
      if (!byDate[r.date]) byDate[r.date] = { count: 0, total: 0, qty189: 0, items: [] };
      byDate[r.date].count++;
      byDate[r.date].total += num(r.totalAmount);
      byDate[r.date].qty189 += num(r.qty189);
      byDate[r.date].items.push(r);
    });
    const sortedDates = Object.keys(byDate).sort((a, b) => (a < b ? 1 : -1));

    const area = document.getElementById('salesContentArea');
    area.innerHTML = `
      <div class="space-y-3.5">
        <!-- 기간 선택기 -->
        <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm p-3 space-y-2.5">
          <div class="grid grid-cols-4 gap-1.5">
            ${[
              { k: 'today', l: '오늘' },
              { k: 'thisMonth', l: '이번 달' },
              { k: 'lastMonth', l: '지난 달' },
              { k: 'custom', l: '직접선택' }
            ].map(p => `
              <button type="button" onclick="setSalesQuickPeriod('${p.k}')" class="py-2 rounded-xl text-xs font-extrabold transition ${
                state.salesQuickPeriod === p.k ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-600'
              }">${p.l}</button>
            `).join('')}
          </div>
          <div class="grid grid-cols-2 gap-2">
            <input id="salesStartInp" type="date" value="${s}" class="w-full border border-slate-200 px-2.5 py-2 rounded-xl bg-slate-50 text-xs font-bold" />
            <input id="salesEndInp" type="date" value="${e}" class="w-full border border-slate-200 px-2.5 py-2 rounded-xl bg-slate-50 text-xs font-bold" />
          </div>
        </div>

        <!-- 핵심 매출 요약 카드 -->
        <div class="bg-gradient-to-br from-slate-900 to-indigo-950 text-white rounded-2xl p-4 shadow-md space-y-3">
          <div class="flex items-center justify-between">
            <span class="text-xs font-bold text-indigo-200">선택 기간 총 매출 (${records.length}건)</span>
            <span class="text-[11px] text-slate-300">${s} ~ ${e}</span>
          </div>
          <div class="text-3xl font-extrabold tracking-tight text-emerald-400">${money(totalSales)}</div>
          <div class="grid grid-cols-2 gap-2 pt-2 border-t border-white/10 text-xs">
            <div class="bg-white/10 rounded-xl p-2.5">
              <div class="text-slate-300 text-[11px]">수금 완료</div>
              <div class="font-extrabold text-sm text-white mt-0.5">${money(paidSales)}</div>
            </div>
            <div class="bg-white/10 rounded-xl p-2.5">
              <div class="text-rose-200 text-[11px]">기간 미수금</div>
              <div class="font-extrabold text-sm text-rose-300 mt-0.5">${money(unpaidSales)}</div>
            </div>
          </div>
          <div class="bg-white/5 rounded-xl px-3 py-2 flex items-center justify-between text-xs border border-white/10">
            <span class="text-slate-300">창고 매입(${money(totalPurchase)}) 대비 차액</span>
            <span class="font-extrabold ${marginDiff >= 0 ? 'text-emerald-300' : 'text-rose-300'}">${marginDiff >= 0 ? '+' : ''}${money(marginDiff)}</span>
          </div>

        <!-- 결제 방식별 집계 -->
        <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm p-4 space-y-2.5">
          <div class="font-extrabold text-sm text-slate-900">💳 결제 방식별 매출</div>
          <div class="space-y-2">
            ${Object.keys(byPay).map(k => {
              const amt = byPay[k];
              const pct = totalSales > 0 ? Math.round((amt / totalSales) * 100) : 0;
              return `
                <div class="space-y-1">
                  <div class="flex justify-between text-xs">
                    <span class="font-bold text-slate-700">${escapeHtml(k)}</span>
                    <span class="font-extrabold text-slate-900">${money(amt)} <span class="text-slate-400 font-semibold">(${pct}%)</span></span>
                  </div>
                  <div class="w-full h-2 rounded-full bg-slate-100 overflow-hidden">
                    <div class="h-full rounded-full bg-indigo-500" style="width:${pct}%"></div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>

        <!-- 품목별 납품 합계 -->
        <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm p-4 space-y-2">
          <div class="font-extrabold text-sm text-slate-900">📦 품목별 납품 합계</div>
          ${Object.keys(byItem).length > 0 ? Object.keys(byItem).map(name => `
            <div class="flex items-center justify-between py-1.5 border-b border-slate-100 last:border-0 text-xs">
              <div><span class="font-extrabold text-slate-800">${escapeHtml(name)}</span> <span class="text-slate-500">(${byItem[name].qty.toLocaleString()}개)</span></div>
              <div class="font-extrabold text-indigo-700">${money(byItem[name].amt)}</div>
            </div>
          `).join('') : `<div class="text-xs text-slate-400 py-3 text-center">선택한 기간에 납품 내역이 없습니다.</div>`}
        </div>

        <!-- 일별 매출 리스트 -->
        <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm p-4 space-y-2.5">
          <div class="font-extrabold text-sm text-slate-900">📅 일별 매출 내역</div>
          ${sortedDates.length > 0 ? sortedDates.map(d => `
            <div class="border border-slate-200 rounded-xl p-3 bg-slate-50/70 space-y-2">
              <div class="flex items-center justify-between">
                <span class="text-xs font-extrabold text-slate-900">${formatKoreanDate(d)} <span class="text-slate-400 font-normal">(${byDate[d].count}건 · 18.9L ${byDate[d].qty189}통)</span></span>
                <span class="text-sm font-extrabold text-emerald-700">${money(byDate[d].total)}</span>
              </div>
              <div class="space-y-1 pt-1 border-t border-slate-200/70">
                ${byDate[d].items.map(r => {
                  const rem = getRecordUnpaidAmount(r);
                  const isPartial = !r.paid && getRecordPaidAmount(r) > 0;
                  return `
                    <div onclick="openDeliveryRecordMenu(${r.id})" class="cursor-pointer flex items-center justify-between text-xs py-1 px-2 rounded-lg bg-white border border-slate-100 active:scale-[0.99]">
                      <div class="truncate">
                        <span class="font-bold text-slate-800">${escapeHtml(r.clientName)}</span>
                        <span class="text-[10px] ml-1 px-1.5 py-0.5 rounded ${
                          r.paid
                            ? 'bg-emerald-50 text-emerald-700'
                            : (isPartial ? 'bg-amber-50 text-amber-800' : 'bg-rose-50 text-rose-700')
                        } font-bold">${r.paid ? '수금' : (isPartial ? `잔액 ${money(rem)}` : '미수')}</span>

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>(주) 신성에프앤디 통합 관리 v2</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 가독성 높은 한글/영문 폰트 로드 -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Pretendard', 'Inter', 'Apple SD Gothic Neo', 'Noto Sans KR', 'sans-serif'],
          }
        }
      }
    };
  </script>
</head>
<body class="bg-slate-100 text-slate-900 font-sans antialiased selection:bg-indigo-100 selection:text-indigo-900 min-h-screen">

  <!-- =========================================================
       0. 인트로 스플래시 오버레이 (앱 진입 시 0.7초간 부드럽게 표시)
       ========================================================= -->
  <div id="introSplash" class="fixed inset-0 z-[100] flex flex-col items-center justify-center bg-slate-900 text-white transition-opacity duration-500">
    <div class="w-16 h-16 rounded-2xl bg-indigo-600 flex items-center justify-center text-3xl shadow-lg mb-4">🚰</div>
    <div class="text-sm font-semibold text-indigo-300 tracking-wide">입출고 · 거래처 · 배송 · 매출 통합</div>
    <div class="text-2xl font-extrabold mt-1 tracking-tight">(주) 신성에프앤디</div>
  </div>

  <!-- =========================================================
       1. 상단 고정 헤더
       ========================================================= -->
  <header class="sticky top-0 z-30 bg-white/95 backdrop-blur border-b border-slate-200/80 shadow-sm">
    <div class="max-w-2xl mx-auto px-4 h-14 flex items-center justify-between gap-2">
      <div class="flex items-center gap-2 min-w-0">
        <button id="headerBackBtn" type="button" onclick="handleHeaderBack()" class="hidden w-9 h-9 rounded-xl bg-slate-100 active:scale-95 text-slate-700 font-extrabold flex items-center justify-center shrink-0 transition">
          ←
        </button>
        <div class="min-w-0">
          <div class="flex items-center gap-1.5">
            <span id="headerTitle" class="text-lg font-extrabold text-slate-900 truncate tracking-tight">🚰 입출고 관리</span>
            <span id="headerBadge" class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-indigo-50 text-indigo-600 border border-indigo-200 shrink-0">통합 v2</span>
          </div>
        </div>
      </div>
      <div id="headerRightAction" class="flex items-center gap-1.5 shrink-0"></div>
    </div>
  </header>

  <!-- =========================================================
       2. 메인 콘텐츠 영역
       ========================================================= -->
  <main id="appMain" class="max-w-2xl mx-auto px-3.5 pt-3.5 pb-28">
    <!-- 동적으로 탭별 화면이 렌더링됩니다 -->
  </main>

  <!-- =========================================================
       3. 하단 고정 네비게이션 바 (5탭)
       ========================================================= -->
  <nav class="fixed bottom-0 inset-x-0 z-40 bg-white/95 backdrop-blur border-t border-slate-200 shadow-[0_-4px_16px_rgba(15,23,42,0.06)]">
    <div class="max-w-2xl mx-auto grid grid-cols-5 h-16 px-1">
      <button type="button" data-tab="io" onclick="switchTab('io')" class="nav-tab-btn flex flex-col items-center justify-center gap-0.5 rounded-xl transition active:scale-95">
        <span class="text-xl leading-none">📥</span>
        <span class="text-[11px] font-bold">입출고</span>
      </button>
      <button type="button" data-tab="clients" onclick="switchTab('clients')" class="nav-tab-btn flex flex-col items-center justify-center gap-0.5 rounded-xl transition active:scale-95">
        <span class="text-xl leading-none">🏢</span>
        <span class="text-[11px] font-bold">거래처</span>
      </button>
      <button type="button" data-tab="delivery" onclick="switchTab('delivery')" class="nav-tab-btn flex flex-col items-center justify-center gap-0.5 rounded-xl transition active:scale-95 relative">
        <span class="text-xl leading-none">🚚</span>
        <span class="text-[11px] font-bold">배송</span>
      </button>
      <button type="button" data-tab="sales" onclick="switchTab('sales')" class="nav-tab-btn flex flex-col items-center justify-center gap-0.5 rounded-xl transition active:scale-95 relative">
        <span class="text-xl leading-none">💰</span>
        <span class="text-[11px] font-bold">매출</span>
      </button>
      <button type="button" data-tab="settings" onclick="switchTab('settings')" class="nav-tab-btn flex flex-col items-center justify-center gap-0.5 rounded-xl transition active:scale-95">

      </button>
    </div>

  <!-- =========================================================
       4. 공용 모달 레이어 (alert / confirm 완전 대체)
       ========================================================= -->
  <div id="modalRoot" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-900/50 backdrop-blur-[2px] p-4"></div>

  <!-- =========================================================
       5. 토스트 알림 컨테이너
       ========================================================= -->
  <div id="toastContainer" class="fixed bottom-20 left-1/2 -translate-x-1/2 z-[70] flex flex-col items-center gap-2 pointer-events-none w-full max-w-xs px-4"></div>

  <!-- 숨겨진 파일 입력 (통합 복원 / 기존 거래처 / 기존 입출고) -->
  <input type="file" id="unifiedFileInput" accept=".json,application/json" class="hidden" />
  <input type="file" id="legacyClientFileInput" accept=".json,application/json" class="hidden" />
  <input type="file" id="legacyIoFileInput" accept=".json,application/json" class="hidden" />

  <script>
  /*********************************************************************
   * (주) 신성에프앤디 통합 관리 앱 v2
   *
   * [아키텍처 구성]
   * 1. Storage Keys & Defaults (기존 데이터 100% 호환 + 배송/매출/원장 키)
   * 2. Utils (안전한 저장소, 날짜/달력, 금액, 초성검색, 진동/사운드, 토스트/모달)
   * 3. Global State & Data Normalization
   * 4. Navigation & Android Back Button Router
   * 5. Tab 1: 입출고 관리 (홈 / 출고 / 명성·음봉 조회 / 입고·반납 / 입고·반납 조회)
   * 6. Tab 2: 거래처 관리 (대시보드 / 등록·수정(마감일·격주·월간주기) / 납품내역서)
   * 7. Tab 3: 스마트 배송 스케줄러 (정기코스 / 미루기 / 달력예약 / 대기목록 직접 순서변경)
   * 8. Tab 4: 매출 · 미수금 · 거래처별 원장 (선입선출 금액수금 / 계산서 마감집계 / 카톡복사)
   * 9. Tab 5: 통합 설정 (단가 예약 변경 / 기간 정산 / 기존 백업 복구 / 통합 백업)
   *********************************************************************/

  /* ===================================================================
   * 1. Storage Keys & Defaults
   * =================================================================== */
  const KEYS = {
    // [거래처 앱 기존 키 유지]
    clients: 'bizAppDB',
    clientViewMode: 'viewMode',

    // [입출고 앱 기존 키 유지]
    items: 'items',
    outgo: 'outgoRecords',
    inbound: 'inboundRecords',
    myStock: 'myStock',
    containerHeld: 'containerHeld',
    settlement: 'settlement',
    personalRate: 'personalRate189',
    truckSize: 'truckSize864',
    lastSettled: 'lastSettledDate',
    priceSchedule: 'priceScheduleData',
    lastShipId: 'lastShipId',
    lastInboundId: 'lastInboundId',

    // [통합 앱 설정 & 배송/매출 키]
    soundEnabled: 'shinsungSoundEnabled',
    deliverySchedules: 'deliverySchedules',   // 수동 예약(manual), 이월(postpone), 건너뛰기(skip)
    deliveryRecords: 'deliveryRecords',       // 완료된 배송 전표 & 매출/미수금 기록
    deliverySellPrices: 'deliverySellPrices', // 기타 품목 납품 판매 단가 자동 기억
    deliveryDateOrders: 'deliveryDateOrders'  // 날짜별 배송 대기 목록 커스텀 순서
  };

  const DEFAULT_ITEMS = [
    { name: '18.9L', myeongseong: 0, eumbong: 1800, lock: true, pinned: true },
    { name: '500ml', myeongseong: 2150, eumbong: 2600, pinned: true },
    { name: '2.0L', myeongseong: 2000, eumbong: 1850, pinned: false },
    { name: '330ml', myeongseong: 2600, eumbong: 2508, pinned: false },
    { name: '1.0L (12개)', myeongseong: 2530, eumbong: 2530, pinned: false },
    { name: '종이컵(6.5oz)', myeongseong: 8100, eumbong: 8800, pinned: false },
    { name: '봉투컵', myeongseong: 13000, eumbong: 0, pinned: false },
    { name: '(동원)13L', myeongseong: 2200, eumbong: 0, pinned: false }
  ];

  const CONTAINER_TYPES = [
    { key: '189_crate', label: '18.9L 크레이트' },
    { key: '189_empty', label: '18.9L 빈통' },
    { key: '13_crate',  label: '13L 크레이트' },
    { key: '13_empty',  label: '13L 빈통' }
  ];

  const WEEKDAYS = ['일', '월', '화', '수', '목', '금', '토'];
  const PAYMENT_TYPES = ['미지정', '월말정산', '현금', '계좌이체', '카드'];
  const DELIVERY_PAYMENT_TYPES = ['월말정산', '현금', '계좌이체', '카드'];
  const CLOSING_DAYS = [
    { value: 'none', label: '미지정' },
    { value: 'eom',  label: '말일 마감 (1일~말일)' },
    { value: '25',   label: '25일 마감 (전월26일~당월25일)' },
    { value: '20',   label: '20일 마감 (전월21일~당월20일)' },
    { value: '15',   label: '15일 마감 (전월16일~당월15일)' },
    { value: '10',   label: '10일 마감 (전월11일~당월10일)' },
    { value: '5',    label: '5일 마감 (전월6일~당월5일)' }
  ];
  const VISIT_CYCLES = [
    { value: 'irregular', label: '비정기(수시)' },
    { value: 'weekly',    label: '매주' },
    { value: 'biweekly',  label: '격주' },
    { value: 'monthly',   label: '매월' }
  ];

  /* ===================================================================
   * 2. Utils (저장소 / 날짜 / 숫자 / 한글 초성 / 피드백 / 커스텀 모달)
   * =================================================================== */
  function loadJSON(key, fallback) {
    try {
      const v = localStorage.getItem(key);
      return v ? JSON.parse(v) : fallback;
    } catch (e) {
      return fallback;
    }
  }

  function saveJSON(key, value) {
    try {
      localStorage.setItem(key, JSON.stringify(value));
    } catch (e) {
      showToast('⚠️ 저장 공간이 부족하거나 브라우저 저장이 차단되었습니다.');
    }
  }

  function num(v) {
    const n = Number(v);
    return Number.isFinite(n) ? n : 0;
  }

  // 거래처 단가/임대/통재고 숫자 파싱
  function parseClientNum(val) {
    if (val === undefined || val === null) return 0;
    const str = String(val).trim();
    if (/자가|구매|자체|없음|보유|패트|페트|PET/i.test(str)) return 0;
    const parsed = parseInt(str.replace(/[^0-9]/g, ''), 10);
    return isNaN(parsed) ? 0 : parsed;
  }

  // 패트(PET) 전용 거래처 판별
  function isPetOnlyClient(client) {
    if (!client) return false;
    return /패트|페트|PET/i.test(String(client.rental || ''));
  }

  function toLocalISO(d) {
    const x = new Date(d.getTime() - d.getTimezoneOffset() * 60000);
    return x.toISOString().slice(0, 10);
  }

  function todayISO() {
    return toLocalISO(new Date());
  }

  function parseISO(isoStr) {
    const parts = (isoStr || todayISO()).split('-').map(Number);
    return new Date(parts[0], (parts[1] || 1) - 1, parts[2] || 1);
  }

  function addDaysISO(isoStr, days) {
    const d = parseISO(isoStr);
    d.setDate(d.getDate() + days);
    return toLocalISO(d);
  }

  function formatKoreanDate(isoStr) {
    const d = parseISO(isoStr);
    return `${d.getMonth() + 1}월 ${d.getDate()}일 (${WEEKDAYS[d.getDay()]})`;
  }

  function uid() {
    return Date.now() + Math.floor(Math.random() * 10000);
  }

  function money(n) {
    return num(n).toLocaleString() + '원';
  }

  function escapeHtml(str) {
    if (str === undefined || str === null) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  function escapeJsAttr(str) {
    if (str === undefined || str === null) return '';
    return String(str)
      .replace(/\\/g, '\\\\')
      .replace(/'/g, "\\'")
      .replace(/"/g, '&quot;')
      .replace(/\r?\n/g, ' ');
  }

  function formatUnitDisplay(val, unit, emptyText = '-') {
    if (val === undefined || val === null) return emptyText;
    const str = String(val).trim();
    if (!str) return emptyText;
    if (/^[0-9,]+$/.test(str)) return escapeHtml(str) + unit;
    return escapeHtml(str);
  }

  // 전표별 수금 완료 금액 및 미수 잔액 헬퍼 (부분 수금 완벽 호환)
  function getRecordPaidAmount(r) {
    if (!r) return 0;
    const total = num(r.totalAmount);
    if (r.paid) return total;
    return Math.min(total, Math.max(0, num(r.paidAmount)));
  }

  function getRecordUnpaidAmount(r) {
    if (!r) return 0;
    if (r.paid) return 0;
    return Math.max(0, num(r.totalAmount) - getRecordPaidAmount(r));
  }

  // 한글 초성 추출
  const CHOSUNG = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
  function getChosung(str) {
    if (!str) return '';
    let result = '';
    for (let i = 0; i < str.length; i++) {
      const code = str.charCodeAt(i) - 44032;
      if (code > -1 && code < 11172) {
        result += CHOSUNG[Math.floor(code / 588)];
      } else {
        result += str.charAt(i);
      }
    }
    return result;
  }

  // 진동 & 부드러운 클릭음 피드백
  let __audioCtx = null;
  function tap(ms = 20) {
    try {
      window.__lastTapAt = Date.now();
      if (navigator.vibrate) navigator.vibrate(ms);
      if (!state.soundEnabled) return;
      if (!__audioCtx) __audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (__audioCtx.state === 'suspended') __audioCtx.resume();
      const o = __audioCtx.createOscillator();
      const g = __audioCtx.createGain();
      o.type = 'sine';
      o.frequency.value = 340;
      g.gain.value = 0.045;
      o.connect(g);
      g.connect(__audioCtx.destination);
      o.start();
      o.stop(__audioCtx.currentTime + 0.045);
    } catch (e) {}
  }

  document.addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn || btn.disabled) return;
    if (window.__lastTapAt && Date.now() - window.__lastTapAt < 120) return;
    tap(15);
  }, { passive: true });

  // 모바일 숫자 입력칸: 터치 시 전체 선택 & 엔터 시 키보드 닫기
  function bindAutoSelectInput(inp) {
    if (!inp || inp.__autoSelectBound) return;
    inp.__autoSelectBound = true;
    const selectAll = () => {
      try {
        setTimeout(() => {
          try { inp.select(); } catch (e) {}
          try { inp.setSelectionRange(0, String(inp.value || '').length); } catch (e) {}
        }, 0);
      } catch (e) {}
    };
    inp.addEventListener('focus', selectAll);
    inp.addEventListener('click', selectAll);
    inp.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        inp.blur();
      }
    });
  }

  // 롱프레스(길게 누르기) 헬퍼
  function bindLongPress(el, onLongPress, duration = 550) {
    let timer = null;
    let startX = 0;
    let startY = 0;
    let triggered = false;

    const cancel = () => {
      if (timer) {
        clearTimeout(timer);
        timer = null;
      }
      el.classList.remove('scale-[0.98]', 'bg-slate-100');
    };

    el.addEventListener('pointerdown', (e) => {
      if (e.target.closest('button, a, input, select')) return;
      triggered = false;
      startX = e.clientX;
      startY = e.clientY;
      timer = setTimeout(() => {
        triggered = true;
        tap(40);
        el.classList.add('scale-[0.98]', 'bg-slate-100');
        onLongPress();
        setTimeout(() => el.classList.remove('scale-[0.98]', 'bg-slate-100'), 220);
      }, duration);
    });

    el.addEventListener('pointermove', (e) => {
      if (!timer) return;
      if (Math.abs(e.clientX - startX) > 12 || Math.abs(e.clientY - startY) > 12) {
        cancel();
      }
    });

    ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => {
      el.addEventListener(ev, cancel);
    });

    el.addEventListener('contextmenu', (e) => e.preventDefault());
    return () => triggered;
  }

  // 토스트 알림
  function showToast(msg, duration = 2400) {
    const container = document.getElementById('toastContainer');
    const toast = document.createElement('div');
    toast.className = 'bg-slate-900/95 text-white px-4 py-2.5 rounded-full text-xs font-bold shadow-xl text-center leading-snug transition-all duration-200';
    toast.innerText = msg;
    container.appendChild(toast);
    setTimeout(() => {
      toast.classList.add('opacity-0', 'translate-y-2');
      setTimeout(() => toast.remove(), 220);
    }, duration);
  }

  // 공용 모달 열기/닫기
  function openCustomModal(htmlContent, { closeOnBackdrop = true } = {}) {
    const root = document.getElementById('modalRoot');
    root.innerHTML = htmlContent;
    root.classList.remove('hidden');
    root.classList.add('flex');
    root.onclick = (e) => {
      if (closeOnBackdrop && e.target === root) closeCustomModal();
    };
  }

  function closeCustomModal() {
    const root = document.getElementById('modalRoot');
    root.classList.add('hidden');
    root.classList.remove('flex');
    root.innerHTML = '';
    root.onclick = null;
  }

  // 커스텀 확인창 (confirm 대체)
  function showConfirmModal({ title, message, confirmText = '확인', cancelText = '취소', danger = false, onConfirm }) {
    openCustomModal(`
      <div class="bg-white rounded-2xl p-5 w-full max-w-sm shadow-2xl border border-slate-200 space-y-4">
        <div class="text-center space-y-1.5">
          <div class="text-lg font-extrabold text-slate-900">${escapeHtml(title)}</div>
          <div class="text-sm text-slate-600 leading-relaxed whitespace-pre-line">${escapeHtml(message)}</div>
        </div>
        <div class="grid grid-cols-2 gap-2.5 pt-1">
          <button type="button" id="cmCancel" class="py-3 rounded-xl bg-slate-100 text-slate-700 font-bold text-sm active:scale-95 transition">${escapeHtml(cancelText)}</button>
          <button type="button" id="cmOk" class="py-3 rounded-xl ${danger ? 'bg-rose-600' : 'bg-indigo-600'} text-white font-extrabold text-sm shadow active:scale-95 transition">${escapeHtml(confirmText)}</button>
        </div>
      </div>
    `);
    document.getElementById('cmCancel').onclick = closeCustomModal;
    document.getElementById('cmOk').onclick = () => {
      closeCustomModal();
      if (typeof onConfirm === 'function') onConfirm();
    };
  }

  /* ===================================================================
   * 3. Global State & Data Normalization
   * =================================================================== */
  const nowInit = new Date();
  const state = {
    // 네비게이션 상태
    activeTab: 'io',       // 'io' | 'clients' | 'delivery' | 'sales' | 'settings'
    ioSubScreen: 'home',   // 'home' | 'shipping' | 'hist_m' | 'hist_e' | 'inbound' | 'inbound_hist'
    homeContainerWh: '명성',

    // 거래처 화면 상태
    clientViewMode: localStorage.getItem(KEYS.clientViewMode) || 'card',
    clientFilterMode: 'all',
    clientSearch: '',
    clientSort: 'name',
    clientFormOpen: false,
    editingClientId: null,

    // 배송 탭 상태

    editingInboundRecord: null,

    clients: loadJSON(KEYS.clients, []),
    items: loadJSON(KEYS.items, DEFAULT_ITEMS),
    outgoRecords: loadJSON(KEYS.outgo, []),
    inboundRecords: loadJSON(KEYS.inbound, []),
    myStock: loadJSON(KEYS.myStock, { '18.9L': 0 }),

    settlement: loadJSON(KEYS.settlement, { myeong: 0, eumbong: 0 }),

    deliverySchedules: loadJSON(KEYS.deliverySchedules, []),
    deliveryRecords: loadJSON(KEYS.deliveryRecords, []),
    deliverySellPrices: loadJSON(KEYS.deliverySellPrices, {}),
    deliveryDateOrders: loadJSON(KEYS.deliveryDateOrders, {})
  };

  function normalizeAllData() {
    if (!state.containerHeld || typeof state.containerHeld !== 'object') {
      state.containerHeld = { 명성: {}, 음봉: {} };
    }
    for (const wh of ['명성', '음봉']) {
      state.containerHeld[wh] = state.containerHeld[wh] || {};
      for (const t of CONTAINER_TYPES) {
        if (state.containerHeld[wh][t.key] === undefined) state.containerHeld[wh][t.key] = 0;
      }
    }
    if (!Array.isArray(state.items) || state.items.length === 0) {
      state.items = JSON.parse(JSON.stringify(DEFAULT_ITEMS));
    }
    if (!state.items.find(x => x.name === '18.9L')) {
      state.items.unshift({ ...DEFAULT_ITEMS[0] });
    }
    if (state.items.every(x => x.pinned === undefined)) {
      state.items.forEach(x => {
        x.pinned = (x.name === '18.9L' || x.name === '500ml');
      });
      state.items.sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0));
    }
    if (!state.myStock || typeof state.myStock !== 'object') state.myStock = { '18.9L': 0 };
    if (!state.settlement || typeof state.settlement !== 'object') state.settlement = { myeong: 0, eumbong: 0 };
    if (!state.lastSettled || typeof state.lastSettled !== 'object') state.lastSettled = { 명성: '', 음봉: '' };
    if (!state.priceSchedule || typeof state.priceSchedule !== 'object') state.priceSchedule = { personalRate: null, items: null };
    if (!Array.isArray(state.clients)) state.clients = [];
    if (!Array.isArray(state.outgoRecords)) state.outgoRecords = [];
    if (!Array.isArray(state.inboundRecords)) state.inboundRecords = [];
    if (!Array.isArray(state.deliverySchedules)) state.deliverySchedules = [];
    if (!Array.isArray(state.deliveryRecords)) state.deliveryRecords = [];
    if (!state.deliverySellPrices || typeof state.deliverySellPrices !== 'object') state.deliverySellPrices = {};
    if (!state.deliveryDateOrders || typeof state.deliveryDateOrders !== 'object') state.deliveryDateOrders = {};

    saveJSON(KEYS.items, state.items);
  }
  normalizeAllData();

  function getEffectivePersonalRate(dateStr) {
    const d = dateStr || todayISO();
    const sched = state.priceSchedule && state.priceSchedule.personalRate;
    if (sched && sched.applyFrom && d < sched.applyFrom && sched.prevRate !== undefined) {
      return num(sched.prevRate);
    }
    return num(state.personalRate);
  }

  function getEffectiveItemPrice(it, wh, dateStr) {
    if (!it) return 0;
    if (wh === '명성' && it.name === '18.9L') return 0;
    const d = dateStr || todayISO();
    const sched = state.priceSchedule && state.priceSchedule.items;
    if (sched && sched.applyFrom && d < sched.applyFrom && sched.prevItems && sched.prevItems[it.name]) {
      const prev = sched.prevItems[it.name];
      return wh === '명성' ? num(prev.myeongseong) : num(prev.eumbong);
    }
    return wh === '명성' ? num(it.myeongseong) : num(it.eumbong);
  }

  function persistIOData() {
    saveJSON(KEYS.items, state.items);
    saveJSON(KEYS.outgo, state.outgoRecords);
    saveJSON(KEYS.inbound, state.inboundRecords);
    saveJSON(KEYS.myStock, state.myStock);
    saveJSON(KEYS.containerHeld, state.containerHeld);
    saveJSON(KEYS.settlement, state.settlement);
    saveJSON(KEYS.lastSettled, state.lastSettled);
    saveJSON(KEYS.priceSchedule, state.priceSchedule);
    localStorage.setItem(KEYS.personalRate, String(state.personalRate));
    localStorage.setItem(KEYS.truckSize, String(state.truckSize));
  }

  function persistClients() {
    saveJSON(KEYS.clients, state.clients);
  }

  function persistDeliveryData() {
    saveJSON(KEYS.deliverySchedules, state.deliverySchedules);
    saveJSON(KEYS.deliveryRecords, state.deliveryRecords);
    saveJSON(KEYS.deliverySellPrices, state.deliverySellPrices);

  function updateNavUI() {

      const isActive = btn.dataset.tab === state.activeTab;
      if (isActive) {
        btn.classList.add('text-indigo-600', 'bg-indigo-50/70');
        btn.classList.remove('text-slate-500');
      } else {
        btn.classList.remove('text-indigo-600', 'bg-indigo-50/70');
        btn.classList.add('text-slate-500');
      }
    });
  }

  function setHeader({ title, badge = '', showBack = false, rightHtml = '' }) {
    document.getElementById('headerTitle').innerText = title;
    const badgeEl = document.getElementById('headerBadge');
    if (badge) {
      badgeEl.innerText = badge;
      badgeEl.classList.remove('hidden');
    } else {
      badgeEl.classList.add('hidden');
    }
    const backBtn = document.getElementById('headerBackBtn');
    if (showBack) backBtn.classList.remove('hidden');
    else backBtn.classList.add('hidden');
    document.getElementById('headerRightAction').innerHTML = rightHtml;
  }

  function switchTab(tab, pushHistory = true) {
    if (state.activeTab === 'io' && (state.editingOutgoRecord || state.editingInboundRecord) && tab !== 'io') {
      showConfirmModal({
        title: '전표 수정 취소',
        message: '수정 중인 전표가 있습니다.\n저장하지 않고 다른 화면으로 이동할까요?',
        confirmText: '이동하기',
        onConfirm: () => {
          state.editingOutgoRecord = null;
          state.editingInboundRecord = null;
          switchTab(tab, pushHistory);
        }
      });
      return;
    }

    state.activeTab = tab;
    if (tab !== 'delivery') state.deliveryReorderMode = false;
    if (tab === 'io') state.ioSubScreen = 'home';
    if (pushHistory) {
      history.pushState({ tab, ioSubScreen: state.ioSubScreen }, '', `#${tab}`);
    }
    renderApp();
    window.scrollTo({ top: 0, behavior: 'instant' });
  }

  function openIoScreen(subScreen, options = {}, pushHistory = true) {
    state.activeTab = 'io';
    state.ioSubScreen = subScreen;
    if (pushHistory) {
      history.pushState({ tab: 'io', ioSubScreen: subScreen }, '', `#io-${subScreen}`);
    }
    renderApp(options);
    window.scrollTo({ top: 0, behavior: 'instant' });
  }

  function handleHeaderBack() {
    if (state.activeTab === 'io' && state.ioSubScreen !== 'home') {
      if (state.editingOutgoRecord || state.editingInboundRecord) {
        showConfirmModal({
          title: '수정 취소',
          message: '수정 중인 전표를 저장하지 않고 돌아갈까요?',
          confirmText: '돌아가기',
          onConfirm: () => {
            state.editingOutgoRecord = null;
            state.editingInboundRecord = null;
            openIoScreen('home', {}, false);
          }
        });
        return;
      }
      openIoScreen('home', {}, false);
    }
  }

  let __lastBackToastAt = 0;
  window.addEventListener('popstate', () => {
    const modalRoot = document.getElementById('modalRoot');
    if (modalRoot && !modalRoot.classList.contains('hidden')) {
      closeCustomModal();
      history.pushState({ tab: state.activeTab, ioSubScreen: state.ioSubScreen }, '', location.hash || '#io');
      return;
    }
    if (state.activeTab === 'delivery' && state.deliveryReorderMode) {
      state.deliveryReorderMode = false;
      renderDeliveryTab();
      history.pushState({ tab: 'delivery' }, '', '#delivery');
      return;
    }
    if (state.activeTab === 'io' && state.ioSubScreen !== 'home') {
      handleHeaderBack();
      return;
    }
    if (state.activeTab !== 'io') {
      switchTab('io', false);
      history.pushState({ tab: 'io', ioSubScreen: 'home' }, '', '#io');
      return;
    }
    if (Date.now() - __lastBackToastAt < 2000) return;
    __lastBackToastAt = Date.now();
    showToast('한 번 더 뒤로가기를 누르면 종료됩니다.');
    history.pushState({ tab: 'io', ioSubScreen: 'home' }, '', '#io');
  });

  function renderApp(options = {}) {
    updateNavUI();
    if (state.activeTab === 'io') {
      if (state.ioSubScreen === 'home') renderIoHome();
      else if (state.ioSubScreen === 'shipping') renderIoShipping(options.warehouse || '명성');
      else if (state.ioSubScreen === 'hist_m') renderIoHistory('명성');
      else if (state.ioSubScreen === 'hist_e') renderIoHistory('음봉');
      else if (state.ioSubScreen === 'inbound') renderIoInbound();
      else if (state.ioSubScreen === 'inbound_hist') renderIoInboundHistory();
    } else if (state.activeTab === 'clients') {
      renderClientsTab();
    } else if (state.activeTab === 'delivery') {
      renderDeliveryTab();
    } else if (state.activeTab === 'sales') {
      renderSalesTab();
    } else if (state.activeTab === 'settings') {
      renderSettingsTab();
    }
  }

    const shipOtherItems = document.getElementById('shipOtherItems');
    const toggleOtherItemsBtn = document.getElementById('toggleOtherItemsBtn');
    const toggleOtherItemsText = document.getElementById('toggleOtherItemsText');
    const otherItemsBadge = document.getElementById('otherItemsBadge');
    const collectBoxes = document.getElementById('collectBoxes');
    const whButtons = document.querySelectorAll('.ship-wh-btn');

    const getDateVal = () => shipDateEl.value || todayISO();

    const renderShipItemCard = (it, idx) => {
      const d = getDateVal();
      const mPrice = getEffectiveItemPrice(it, '명성', d);
      const ePrice = getEffectiveItemPrice(it, '음봉', d);
      return `
        <div class="bg-white border border-slate-200 rounded-xl p-2.5 flex items-center justify-between gap-2 shadow-sm">
          <div class="min-w-0">
            <div class="font-extrabold text-sm text-slate-900 truncate">${escapeHtml(it.name)}</div>
            <div class="text-[11px] text-slate-500 mt-0.5" data-price-label="${idx}">명성 ${num(mPrice).toLocaleString()} / 음봉 ${num(ePrice).toLocaleString()}</div>
          </div>
          <div class="flex items-center gap-1 shrink-0">
            <button type="button" class="qty-btn w-9 h-9 rounded-lg bg-slate-100 text-slate-700 font-extrabold active:scale-90 transition" data-step="-1" data-idx="${idx}">−</button>
            <input data-idx="${idx}" type="number" inputmode="numeric" class="w-16 border border-slate-300 py-1.5 px-2 rounded-lg text-right font-extrabold text-sm bg-white outline-none" value="0" />
            <button type="button" class="qty-btn w-9 h-9 rounded-lg bg-slate-100 text-slate-700 font-extrabold active:scale-90 transition" data-step="1" data-idx="${idx}">+</button>
          </div>
        </div>
      `;
    };

    const mainEntries = state.items.map((it, idx) => ({ it, idx })).filter(x => x.it.pinned);
    const otherEntries = state.items.map((it, idx) => ({ it, idx })).filter(x => !x.it.pinned);

    if (mainEntries.length === 0) {
      shipMainItems.innerHTML = state.items.map((it, idx) => renderShipItemCard(it, idx)).join('');
      shipOtherSection.classList.add('hidden');
    } else {
      shipMainItems.innerHTML = mainEntries.map(x => renderShipItemCard(x.it, x.idx)).join('');
      if (otherEntries.length > 0) {
        shipOtherSection.classList.remove('hidden');
        shipOtherItems.innerHTML = otherEntries.map(x => renderShipItemCard(x.it, x.idx)).join('');
      }
    }

    collectBoxes.innerHTML = CONTAINER_TYPES.map(t => `
      <div class="bg-white border border-slate-200 rounded-xl p-2.5 flex items-center justify-between gap-2 shadow-sm">
        <div class="font-bold text-sm text-slate-800">${t.label}</div>
        <div class="flex items-center gap-1 shrink-0">
          <button type="button" class="qty-btn w-9 h-9 rounded-lg bg-slate-100 text-slate-700 font-extrabold active:scale-90 transition" data-step="-1" data-ct="${t.key}">−</button>
          <input data-ct="${t.key}" type="number" inputmode="numeric" class="w-16 border border-slate-300 py-1.5 px-2 rounded-lg text-right font-extrabold text-sm bg-white outline-none" value="0" />
          <button type="button" class="qty-btn w-9 h-9 rounded-lg bg-slate-100 text-slate-700 font-extrabold active:scale-90 transition" data-step="1" data-ct="${t.key}">+</button>
        </div>
      </div>
    `).join('');

    let otherExpanded = false;

    if (editing) {
      shipItems.querySelectorAll('input[data-idx]').forEach(inp => {
        const idx = Number(inp.dataset.idx);
        const name = state.items[idx]?.name;
        const found = (editing.items || []).find(x => x.name === name);
        if (found) inp.value = found.qty;
      });
      if (Array.from(shipOtherItems.querySelectorAll('input[type="number"]')).some(inp => num(inp.value) !== 0)) {
        otherExpanded = true;
      }
      collectBoxes.querySelectorAll('input[data-ct]').forEach(inp => {
        const k = inp.dataset.ct;
        if (editing.collected && editing.collected[k] !== undefined) inp.value = editing.collected[k];
      });
    }

    function applyWarehouseStyles() {
      whButtons.forEach(b => {
        const isMe = b.dataset.wh === selectedWarehouse;
        const isM = b.dataset.wh === '명성';
        b.className = `ship-wh-btn rounded-xl font-extrabold py-2.5 text-sm transition flex items-center justify-center gap-1.5 ${
          isM ? 'bg-rose-100 text-rose-900' : 'bg-sky-100 text-sky-900'
        } ${
          isMe
            ? (isM ? 'ring-2 ring-rose-500 shadow-md scale-[0.98]' : 'ring-2 ring-blue-500 shadow-md scale-[0.98]')
            : 'opacity-65'
        }`;
        b.innerHTML = isMe ? `<span>${b.dataset.wh}</span><span>✓</span>` : `<span>${b.dataset.wh}</span>`;
      });

      const totalEl = document.getElementById('shipTotal');
      const saveBtn = document.getElementById('shipSave');
      if (selectedWarehouse === '명성') {
        totalEl.className = 'text-2xl font-extrabold text-rose-600';
        saveBtn.className = 'col-span-2 rounded-2xl bg-rose-600 text-white font-extrabold py-4 text-base shadow-md active:scale-95 transition';
      } else {
        totalEl.className = 'text-2xl font-extrabold text-blue-600';
        saveBtn.className = 'col-span-2 rounded-2xl bg-blue-600 text-white font-extrabold py-4 text-base shadow-md active:scale-95 transition';
      }
      const badgeEl = document.getElementById('headerBadge');
      if (badgeEl && !editing) badgeEl.innerText = selectedWarehouse;
    }

    function updateOtherToggleUI() {
      if (!otherEntries.length) return;
      let activeOtherCount = 0;
      shipOtherItems.querySelectorAll('input[type="number"]').forEach(inp => {
        if (num(inp.value) !== 0) activeOtherCount++;
      });
      if (otherExpanded) {
        shipOtherItems.classList.remove('hidden');
        toggleOtherItemsText.innerText = `▲ 기타 품목 접기 (${otherEntries.length}개)`;
      } else {
        shipOtherItems.classList.add('hidden');
        toggleOtherItemsText.innerText = `▼ 기타 품목 펼치기 (${otherEntries.length}개)`;
      }
      if (activeOtherCount > 0) {
        otherItemsBadge.classList.remove('hidden');
        otherItemsBadge.innerText = `입력 ${activeOtherCount}건`;
      } else {
        otherItemsBadge.classList.add('hidden');
      }
    }

    function refreshShipPriceLabels() {
      const d = getDateVal();
      shipItems.querySelectorAll('[data-price-label]').forEach(el => {
        const idx = Number(el.dataset.priceLabel);
        const it = state.items[idx];
        if (!it) return;
        el.innerText = `명성 ${num(getEffectiveItemPrice(it, '명성', d)).toLocaleString()} / 음봉 ${num(getEffectiveItemPrice(it, '음봉', d)).toLocaleString()}`;
      });
    }

    function calcShipTotal() {
      const d = getDateVal();
      let total = 0;
      shipItems.querySelectorAll('input[type="number"]').forEach(inp => {
        const idx = Number(inp.dataset.idx);
        const q = num(inp.value);
        if (q === 0) return;
        const it = state.items[idx];
        total += q * getEffectiveItemPrice(it, selectedWarehouse, d);
      });
      document.getElementById('shipTotal').innerText = money(total);
      updateOtherToggleUI();
      return total;
    }

    whButtons.forEach(btn => {
      btn.onclick = () => {
        selectedWarehouse = btn.dataset.wh;
        applyWarehouseStyles();
        calcShipTotal();
      };
    });

    if (toggleOtherItemsBtn) {
      toggleOtherItemsBtn.onclick = () => {
        otherExpanded = !otherExpanded;
        updateOtherToggleUI();
      };
    }

    shipDateEl.addEventListener('change', () => {
      refreshShipPriceLabels();
      calcShipTotal();
    });

    shipItems.addEventListener('input', calcShipTotal);
    shipItems.querySelectorAll('input[type="number"]').forEach(bindAutoSelectInput);
    collectBoxes.querySelectorAll('input[type="number"]').forEach(bindAutoSelectInput);

    shipItems.querySelectorAll('.qty-btn').forEach(btn => {
      btn.onclick = () => {
        const idx = btn.dataset.idx;
        const step = Number(btn.dataset.step);
        const inp = shipItems.querySelector(`input[data-idx="${idx}"]`);
        inp.value = num(inp.value) + step;
        calcShipTotal();
      };
    });

    collectBoxes.querySelectorAll('.qty-btn').forEach(btn => {
      btn.onclick = () => {
        const key = btn.dataset.ct;
        const step = Number(btn.dataset.step);
        const inp = collectBoxes.querySelector(`input[data-ct="${key}"]`);
        inp.value = num(inp.value) + step;
      };
    });

    document.getElementById('shipClear').onclick = () => {
      shipItems.querySelectorAll('input[type="number"]').forEach(i => i.value = '0');
      collectBoxes.querySelectorAll('input[type="number"]').forEach(i => i.value = '0');
      calcShipTotal();
      showToast('입력값을 초기화했습니다.');
    };

    document.getElementById('shipSave').onclick = () => {
      const wh = selectedWarehouse;
      const date = getDateVal();

      const lines = [];
      shipItems.querySelectorAll('input[type="number"]').forEach(inp => {
        const idx = Number(inp.dataset.idx);
        const q = num(inp.value);
        if (q !== 0) lines.push({ name: state.items[idx].name, qty: q });
      });

      const collected = {};
      collectBoxes.querySelectorAll('input[type="number"]').forEach(inp => {
        const k = inp.dataset.ct;
        const q = num(inp.value);
        if (q !== 0) collected[k] = q;
      });

      if (lines.length === 0 && Object.keys(collected).length === 0) {
        showToast('⚠️ 출고 수량 또는 수거 수량을 입력해주세요.');
        return;
      }

      if (editing) {
        rollbackOutgoRecord(editing);
        state.outgoRecords = state.outgoRecords.filter(x => x.id !== editing.id);
      }

      applyOutgoRecord(wh, date, lines, collected);

      const totalAmt = calcShipTotal();
      const record = {
        id: uid(),
        date,
        warehouse: wh,
        items: lines,
        collected,
        total: totalAmt,
        ...(editing ? { editedAt: Date.now() } : {})
      };

      localStorage.setItem(KEYS.lastShipId, String(record.id));
      state.outgoRecords.push(record);
      persistIOData();

      state.editingOutgoRecord = null;
      showToast(editing ? '✅ 출고 전표가 수정되었습니다.' : `✅ ${wh} 출고 저장 완료 (${money(totalAmt)})`);
      openIoScreen(wh === '명성' ? 'hist_m' : 'hist_e', {}, false);
    };

    applyWarehouseStyles();
    updateOtherToggleUI();
    calcShipTotal();
  }

  function applyOutgoRecord(wh, date, lines, collected) {
    if (lines && lines.length) {
      if (wh === '명성') {
        for (const ln of lines) {
          if (ln.name === '18.9L') {
            state.myStock['18.9L'] = num(state.myStock['18.9L']) - num(ln.qty);
          } else {
            const it = state.items.find(x => x.name === ln.name) || {};
            state.settlement.myeong += num(ln.qty) * getEffectiveItemPrice(it, '명성', date);
          }
        }
      } else {
        for (const ln of lines) {
          const it = state.items.find(x => x.name === ln.name) || {};
          state.settlement.eumbong += num(ln.qty) * getEffectiveItemPrice(it, '음봉', date);
        }
      }
    }
    if (collected) {
      for (const k of Object.keys(collected)) {
        state.containerHeld[wh][k] = num(state.containerHeld[wh][k]) + num(collected[k]);
      }
    }
  }

  function rollbackOutgoRecord(r) {
    if (r.items && r.items.length) {
      if (r.warehouse === '명성') {
        for (const ln of r.items) {
          if (ln.name === '18.9L') {
            state.myStock['18.9L'] = num(state.myStock['18.9L']) + num(ln.qty);
          } else {
            const it = state.items.find(x => x.name === ln.name) || {};
            state.settlement.myeong -= num(ln.qty) * getEffectiveItemPrice(it, '명성', r.date);
          }
        }
      } else {
        for (const ln of r.items) {
          const it = state.items.find(x => x.name === ln.name) || {};
          state.settlement.eumbong -= num(ln.qty) * getEffectiveItemPrice(it, '음봉', r.date);
        }
      }
    }
    if (r.collected) {
      for (const k of Object.keys(r.collected)) {
        state.containerHeld[r.warehouse][k] = num(state.containerHeld[r.warehouse][k]) - num(r.collected[k]);
      }
    }
  }

  /* 5-2. 명성 / 음봉 출고 조회 */
  function renderIoHistory(warehouse) {
    const isM = warehouse === '명성';
    setHeader({
      title: `📦 ${warehouse} 출고 조회`,
      badge: isM ? '명성' : '음봉',
      showBack: true,
      rightHtml: `
        <button type="button" onclick="openIoScreen('shipping', { warehouse: '${warehouse}' })" class="px-2.5 py-1.5 rounded-lg ${isM ? 'bg-rose-600' : 'bg-blue-600'} text-white text-xs font-extrabold active:scale-95 transition">
          + 출고
        </button>
      `
    });

    const main = document.getElementById('appMain');
    main.innerHTML = `
      <div class="bg-white rounded-2xl shadow-sm border border-slate-200/80 p-4 space-y-3.5">
        <div class="grid grid-cols-2 gap-2.5">
          <div>
            <label class="text-[11px] font-bold text-slate-500 block mb-1">기간 빠른선택</label>
            <select id="hQuick" class="w-full border border-slate-300 px-2.5 py-2 rounded-xl bg-slate-50 text-xs font-bold">
              <option value="this">이번 달</option>
              <option value="last">지난 달</option>
              <option value="">직접 선택</option>
            </select>
          </div>
          <div>
            <label class="text-[11px] font-bold text-slate-500 block mb-1">보기 방식</label>
            <select id="hMode" class="w-full border border-slate-300 px-2.5 py-2 rounded-xl bg-slate-50 text-xs font-bold">
              <option value="slip">전표별 (최신순)</option>
              <option value="item">품목별 합계</option>
            </select>
          </div>
          <div>
            <label class="text-[11px] font-bold text-slate-500 block mb-1">시작일</label>
            <input id="hStart" type="date" class="w-full border border-slate-300 px-2.5 py-2 rounded-xl bg-slate-50 text-xs font-bold" />
          </div>
          <div>
            <label class="text-[11px] font-bold text-slate-500 block mb-1">종료일</label>
            <input id="hEnd" type="date" class="w-full border border-slate-300 px-2.5 py-2 rounded-xl bg-slate-50 text-xs font-bold" />
          </div>
        </div>

        <div class="grid grid-cols-3 gap-2">
          <button type="button" id="hSearch" class="col-span-2 rounded-xl ${isM ? 'bg-rose-600' : 'bg-blue-600'} text-white font-extrabold py-2.5 text-sm shadow-sm active:scale-95 transition">조회하기</button>
          <button type="button" id="hCSV" class="rounded-xl bg-emerald-600 text-white font-bold py-2.5 text-xs shadow-sm active:scale-95 transition">📊 CSV</button>
        </div>

        <div id="hResult" class="space-y-2.5"></div>
      </div>
    `;

    const hStart = document.getElementById('hStart');
    const hEnd = document.getElementById('hEnd');
    const hQuick = document.getElementById('hQuick');
    const hMode = document.getElementById('hMode');

    const now = new Date();
    hStart.value = toLocalISO(new Date(now.getFullYear(), now.getMonth(), 1));
    hEnd.value = toLocalISO(now);

    function openOutgoSlipMenu(record) {
      openCustomModal(`
        <div class="bg-white rounded-2xl p-5 w-full max-w-xs shadow-2xl border border-slate-200 space-y-3">
          <div class="text-center">
            <div class="text-base font-extrabold text-slate-900">출고 전표 관리</div>
            <div class="text-xs text-slate-500 mt-0.5">${record.date} · ${record.warehouse} (${money(record.total)})</div>
          </div>
          <button type="button" id="smEdit" class="w-full py-3 rounded-xl bg-indigo-600 text-white font-extrabold text-sm active:scale-95 transition">✏️ 수정하기</button>
          <button type="button" id="smDel" class="w-full py-3 rounded-xl bg-rose-50 text-rose-600 border border-rose-200 font-extrabold text-sm active:scale-95 transition">🗑️ 삭제 (재고/정산 복구)</button>
          <button type="button" id="smClose" class="w-full py-2.5 rounded-xl bg-slate-100 text-slate-600 font-bold text-sm">닫기</button>
        </div>
      `);

      document.getElementById('smClose').onclick = closeCustomModal;
      document.getElementById('smEdit').onclick = () => {
        state.editingOutgoRecord = record;
        closeCustomModal();
        openIoScreen('shipping', { warehouse: record.warehouse });
      };
      document.getElementById('smDel').onclick = () => {
        closeCustomModal();
        showConfirmModal({
          title: '출고 전표 삭제',
          message: `${record.date} ${record.warehouse} 전표를 삭제할까요?\n재고와 정산 금액도 함께 되돌려집니다.`,
          confirmText: '삭제하기',
          danger: true,
          onConfirm: () => {
            rollbackOutgoRecord(record);
            state.outgoRecords = state.outgoRecords.filter(r => r.id !== record.id);
            persistIOData();
            showToast('🗑️ 전표가 삭제되고 재고/정산이 되돌려졌습니다.');
            runSearch();
          }
        });
      };
    }

    function getFiltered() {
      const s = hStart.value;
      const e = hEnd.value;
      return state.outgoRecords.filter(r => r.warehouse === warehouse && r.date >= s && r.date <= e);
    }

    function runSearch() {
      const mode = hMode.value;
      const res = document.getElementById('hResult');
      const filtered = getFiltered();
      res.innerHTML = '';

      if (filtered.length === 0) {
        res.innerHTML = `<div class="text-center py-10 text-sm text-slate-400 bg-slate-50 rounded-2xl border border-dashed border-slate-200">선택한 기간에 출고 내역이 없습니다.</div>`;
        return;
      }

      if (mode === 'slip') {
        const lastId = loadJSON(KEYS.lastShipId, null);
        const sorted = [...filtered].sort((a, b) => (a.date !== b.date ? (a.date < b.date ? 1 : -1) : b.id - a.id));
        const periodSum = sorted.reduce((acc, r) => acc + num(r.total), 0);

        const summaryBar = document.createElement('div');
        summaryBar.className = 'flex items-center justify-between px-3.5 py-2.5 rounded-xl bg-slate-100 text-xs font-bold text-slate-700';
        summaryBar.innerHTML = `<span>조회 전표 ${sorted.length}건</span><span class="text-sm font-extrabold ${isM ? 'text-rose-700' : 'text-blue-700'}">합계 ${money(periodSum)}</span>`;
        res.appendChild(summaryBar);

        for (const r of sorted) {
          const isEdited = !!r.editedAt;
          const isRecent = String(r.id) === String(lastId);
          const itemsHtml = (r.items || []).map(i => `<div class="text-sm text-slate-700">• ${escapeHtml(i.name)}: <strong class="text-slate-900">${i.qty}개</strong></div>`).join('')
            || `<div class="text-xs text-slate-400">(출고 품목 없음)</div>`;
          const collectHtml = r.collected && Object.keys(r.collected).length ? `
            <div class="mt-2 pt-2 border-t border-slate-200/70 text-xs text-slate-600">
              <div class="font-bold text-slate-700 mb-0.5">♻️ 수거</div>
              <div class="flex flex-wrap gap-1.5">
                ${Object.keys(r.collected).map(k => {
                  const label = (CONTAINER_TYPES.find(t => t.key === k) || {}).label || k;
                  return `<span class="px-2 py-0.5 rounded-md bg-white border border-slate-200 font-semibold">${label} ${r.collected[k]}</span>`;
                }).join('')}
              </div>
            </div>` : '';

          const card = document.createElement('div');
          card.className = `select-none bg-slate-50 border rounded-2xl p-3.5 transition ${isRecent ? 'border-emerald-400 ring-2 ring-emerald-200/70 bg-emerald-50/30' : 'border-slate-200'}`;
          card.innerHTML = `
            <div class="flex items-start justify-between gap-2">
              <div>
                <div class="flex items-center gap-1.5">
                  <span class="font-extrabold text-slate-900 text-sm">${r.date}</span>
                  ${isEdited ? `<span class="px-1.5 py-0.5 rounded-full bg-amber-100 text-amber-800 text-[10px] font-extrabold">수정됨</span>` : ''}
                  ${isRecent ? `<span class="px-1.5 py-0.5 rounded-full bg-emerald-100 text-emerald-800 text-[10px] font-extrabold">방금 저장</span>` : ''}
                </div>
                <div class="text-[11px] font-semibold text-slate-400">${r.warehouse} 창고</div>
              </div>
              <div class="flex items-center gap-2">
                <div class="text-base font-extrabold ${isM ? 'text-rose-600' : 'text-blue-600'}">${money(r.total || 0)}</div>
                <button type="button" class="slip-menu-btn px-2.5 py-1 rounded-lg bg-white border border-slate-200 text-[11px] font-bold text-slate-600 active:scale-95">관리</button>
              </div>
            </div>
            <div class="mt-2 space-y-0.5">${itemsHtml}</div>
            ${collectHtml}
          `;
          card.querySelector('.slip-menu-btn').onclick = (e) => {
            e.stopPropagation();
            openOutgoSlipMenu(r);
          };
          bindLongPress(card, () => openOutgoSlipMenu(r));
          res.appendChild(card);
        }
      } else {
        const summary = {};
        const summaryAmt = {};
        for (const r of filtered) {
          for (const it of (r.items || [])) {
            const q = num(it.qty);
            summary[it.name] = (summary[it.name] || 0) + q;
            const info = state.items.find(x => x.name === it.name) || {};
            const price = getEffectiveItemPrice(info, warehouse, r.date);
            summaryAmt[it.name] = (summaryAmt[it.name] || 0) + (q * price);
          }
        }
        let total = 0;
        let rows = '';
        for (const name of Object.keys(summary)) {
          const qty = summary[name];
          const sum = summaryAmt[name] || 0;
          total += sum;
          rows += `
            <div class="flex justify-between items-center py-2 border-b border-slate-200/70 text-sm">
              <div><span class="font-bold text-slate-800">${escapeHtml(name)}</span> <span class="text-slate-500 text-xs">(${qty.toLocaleString()}개)</span></div>
              <div class="font-extrabold text-slate-900">${money(sum)}</div>
            </div>`;
        }
        res.innerHTML = `
          <div class="bg-slate-50 border border-slate-200 rounded-2xl p-4">
            <div class="font-extrabold text-sm text-slate-800 mb-2">품목별 출고 합계</div>
            <div>${rows || '<div class="text-xs text-slate-400">품목 내역이 없습니다.</div>'}</div>
            <div class="mt-3 pt-2 flex justify-between items-center text-base font-extrabold">
              <span>총 합계</span>
              <span class="${isM ? 'text-rose-600' : 'text-blue-600'}">${money(total)}</span>
            </div>
          </div>
        `;
      }
    }

    hQuick.onchange = () => {
      const today = new Date();
      if (hQuick.value === 'this') {
        hStart.value = toLocalISO(new Date(today.getFullYear(), today.getMonth(), 1));
        hEnd.value = toLocalISO(today);
        runSearch();
      } else if (hQuick.value === 'last') {
        hStart.value = toLocalISO(new Date(today.getFullYear(), today.getMonth() - 1, 1));
        hEnd.value = toLocalISO(new Date(today.getFullYear(), today.getMonth(), 0));
        runSearch();
      }
    };
    hMode.onchange = runSearch;
    document.getElementById('hSearch').onclick = runSearch;

    document.getElementById('hCSV').onclick = () => {
      const filtered = getFiltered();
      if (filtered.length === 0) {
        showToast('⚠️ 내보낼 출고 데이터가 없습니다.');
        return;
      }
      let csv = '\uFEFF날짜,창고,품목,수량,전표총액\r\n';
      for (const r of filtered) {
        if (r.items && r.items.length) {
          for (const it of r.items) {
            csv += `"${r.date}","${r.warehouse}","${it.name}","${it.qty}","${r.total || 0}"\r\n`;
          }
        } else {
          csv += `"${r.date}","${r.warehouse}","(수거전용)","0","${r.total || 0}"\r\n`;
        }
      }
      downloadBlob(csv, `${warehouse}_출고_${hStart.value}_${hEnd.value}.csv`, 'text/csv;charset=utf-8;');
      showToast('📊 CSV 파일이 다운로드되었습니다.');
    };

    runSearch();
  }

      </div>

        if (editing.changes && editing.changes[k] !== undefined) inp.value = Math.abs(editing.changes[k]);

      document.getElementById('pRate').value = editing.unitPrice;
      document.getElementById('pTruck').value = editing.qty;
      document.getElementById('pQty').value = editing.qty;
    }

    function refreshHeld() {
      const wh = document.getElementById('retWarehouse').value;
      CONTAINER_TYPES.forEach(t => {
        const span = document.getElementById(`held_${t.key}`);
        if (span) span.innerText = num(state.containerHeld[wh]?.[t.key]).toLocaleString();
      });
    }
    document.getElementById('retWarehouse').onchange = refreshHeld;
    refreshHeld();

    retGrid.querySelectorAll('button[data-car]').forEach(btn => {
      btn.onclick = () => {
        const key = btn.dataset.car;
        const qty = num(document.getElementById('truckSize').value) || state.truckSize;
        const inp = retGrid.querySelector(`input[data-qty="${key}"]`);
        if (inp) inp.value = qty;
      };
    });

    document.getElementById('retClear').onclick = () => {
      retGrid.querySelectorAll('input[data-qty]').forEach(i => i.value = '0');
    };

    document.getElementById('retSave').onclick = () => {
      const wh = document.getElementById('retWarehouse').value;
      const date = document.getElementById('retDate').value || todayISO();
      const changes = {};
      retGrid.querySelectorAll('input[data-qty]').forEach(inp => {
        const q = num(inp.value);
        if (q !== 0) changes[inp.dataset.qty] = -q;
      });
      if (Object.keys(changes).length === 0) {
        showToast('⚠️ 저장할 반납 수량을 입력해주세요.');
        return;
      }

      showConfirmModal({
        title: `${wh} 창고 반납 저장`,
        message: `${date} 기준 입력하신 공병/크레이트 반납을 저장할까요?`,
        confirmText: '반납 저장',
        onConfirm: () => {
          const isEdit = editing && editing.type === 'container_return';
          if (isEdit) {
            for (const k of Object.keys(editing.changes || {})) {
              state.containerHeld[editing.warehouse][k] = num(state.containerHeld[editing.warehouse][k]) - num(editing.changes[k]);
            }
            state.inboundRecords = state.inboundRecords.filter(x => x.id !== editing.id);
            state.editingInboundRecord = null;
          }

          const size = num(document.getElementById('truckSize').value);
          if (size > 0) state.truckSize = size;

          for (const k of Object.keys(changes)) {
            state.containerHeld[wh][k] = num(state.containerHeld[wh][k]) + changes[k];
          }
          const rec = { id: uid(), date, warehouse: wh, type: 'container_return', changes, ...(isEdit ? { editedAt: Date.now() } : {}) };
          state.inboundRecords.push(rec);
          localStorage.setItem(KEYS.lastInboundId, String(rec.id));
          persistIOData();
          showToast('✅ 반납 저장이 완료되었습니다.');
          openIoScreen('inbound_hist', {}, false);
        }
      });
    };

    function handlePersonalInbound(qty) {
      const date = document.getElementById('pDate').value || todayISO();
      const rateToUse = num(document.getElementById('pRate').value) || getEffectivePersonalRate(date);
      if (!qty) {
        showToast('⚠️ 입고 수량을 입력해주세요.');
        return;
      }
      const amt = qty * rateToUse;
      showConfirmModal({
        title: '개인 재고 18.9L 입고',
        message: `수량: +${qty.toLocaleString()}통\n단가: ${money(rateToUse)}\n음봉 정산 누적: +${money(amt)}\n\n입고 처리할까요?`,
        confirmText: '입고 확정',
        onConfirm: () => {
          const isEdit = editing && editing.type === 'personal_inbound';
          if (isEdit) {
            state.myStock['18.9L'] = num(state.myStock['18.9L']) - num(editing.qty);
            state.settlement.eumbong -= num(editing.amount);
            state.inboundRecords = state.inboundRecords.filter(x => x.id !== editing.id);
            state.editingInboundRecord = null;
          }
          state.myStock['18.9L'] = num(state.myStock['18.9L']) + qty;
          state.settlement.eumbong += amt;
          const rec = { id: uid(), date, type: 'personal_inbound', qty, unitPrice: rateToUse, amount: amt, ...(isEdit ? { editedAt: Date.now() } : {}) };
          state.inboundRecords.push(rec);
          localStorage.setItem(KEYS.lastInboundId, String(rec.id));
          persistIOData();
          showToast(`✅ 개인 재고 +${qty}통 입고 완료`);
          openIoScreen('home', {}, false);
        }
      });
    }

    document.getElementById('pTruckBtn').onclick = () => handlePersonalInbound(num(document.getElementById('pTruck').value));
    document.getElementById('pQtyBtn').onclick = () => handlePersonalInbound(num(document.getElementById('pQty').value));

    main.querySelectorAll('input[type="number"]').forEach(bindAutoSelectInput);
  }

  function renderIoInboundHistory() {
    setHeader({
      title: '📘 입고 / 반납 조회',
      badge: '이력',
      showBack: true,
      rightHtml: `
        <button type="button" onclick="openIoScreen('inbound')" class="px-2.5 py-1.5 rounded-lg bg-emerald-600 text-white text-xs font-extrabold active:scale-95">
          + 입력
        </button>
      `
    });

    const main = document.getElementById('appMain');
    main.innerHTML = `
      <div class="bg-white rounded-2xl shadow-sm border border-slate-200/80 p-4 space-y-3.5">
        <div class="grid grid-cols-3 gap-2">
          <div>
            <label class="text-[11px] font-bold text-slate-500 block mb-1">기간</label>
            <select id="ihQuick" class="w-full border border-slate-300 px-2 py-2 rounded-xl bg-slate-50 text-xs font-bold">
              <option value="this">이번 달</option>
              <option value="last">지난 달</option>
            </select>
          </div>
          <div>
            <label class="text-[11px] font-bold text-slate-500 block mb-1">시작일</label>
            <input id="ihStart" type="date" class="w-full border border-slate-300 px-2 py-2 rounded-xl bg-slate-50 text-xs font-bold" />
          </div>
          <div>
            <label class="text-[11px] font-bold text-slate-500 block mb-1">종료일</label>
            <input id="ihEnd" type="date" class="w-full border border-slate-300 px-2 py-2 rounded-xl bg-slate-50 text-xs font-bold" />
          </div>
        </div>
        <button type="button" id="ihSearch" class="w-full rounded-xl bg-indigo-600 text-white font-extrabold py-2.5 text-sm shadow-sm active:scale-95 transition">조회하기</button>
        <div id="ihResult" class="space-y-2.5"></div>
      </div>
    `;

    const ihStart = document.getElementById('ihStart');
    const ihEnd = document.getElementById('ihEnd');
    const ihQuick = document.getElementById('ihQuick');
    const today = new Date();
    ihStart.value = toLocalISO(new Date(today.getFullYear(), today.getMonth(), 1));
    ihEnd.value = toLocalISO(today);

    function openInboundMenu(record) {
      openCustomModal(`
        <div class="bg-white rounded-2xl p-5 w-full max-w-xs shadow-2xl border border-slate-200 space-y-3">
          <div class="text-center">
            <div class="text-base font-extrabold text-slate-900">입고 / 반납 전표 관리</div>
            <div class="text-xs text-slate-500 mt-0.5">${record.date} · ${record.type === 'personal_inbound' ? '개인 입고' : `${record.warehouse || ''} 반납`}</div>
          </div>
          <button type="button" id="imEdit" class="w-full py-3 rounded-xl bg-indigo-600 text-white font-extrabold text-sm active:scale-95">✏️ 수정하기</button>
          <button type="button" id="imDel" class="w-full py-3 rounded-xl bg-rose-50 text-rose-600 border border-rose-200 font-extrabold text-sm active:scale-95">🗑️ 삭제 (재고/정산 복구)</button>
          <button type="button" id="imClose" class="w-full py-2.5 rounded-xl bg-slate-100 text-slate-600 font-bold text-sm">닫기</button>
        </div>
      `);

      document.getElementById('imClose').onclick = closeCustomModal;
      document.getElementById('imEdit').onclick = () => {
        state.editingInboundRecord = record;
        closeCustomModal();
        openIoScreen('inbound');
      };
      document.getElementById('imDel').onclick = () => {
        closeCustomModal();
        showConfirmModal({
          title: '전표 삭제',
          message: '이 입고/반납 전표를 삭제할까요?\n재고와 정산도 함께 되돌려집니다.',
          confirmText: '삭제하기',
          danger: true,
          onConfirm: () => {
            if (record.type === 'personal_inbound') {
              state.myStock['18.9L'] = num(state.myStock['18.9L']) - num(record.qty);
              state.settlement.eumbong -= num(record.amount);
            } else if (record.type === 'container_return') {
              for (const k of Object.keys(record.changes || {})) {
                state.containerHeld[record.warehouse][k] = num(state.containerHeld[record.warehouse][k]) - num(record.changes[k]);
              }
            }
            state.inboundRecords = state.inboundRecords.filter(r => r.id !== record.id);
            persistIOData();
            showToast('🗑️ 전표가 삭제되었습니다.');
            run();
          }
        });
      };
    }

    function run() {
      const res = document.getElementById('ihResult');
      res.innerHTML = '';
      const s = ihStart.value;
      const e = ihEnd.value;
      const list = state.inboundRecords
        .filter(r => r.date >= s && r.date <= e)
        .sort((a, b) => (a.date !== b.date ? (a.date < b.date ? 1 : -1) : b.id - a.id));

      if (!list.length) {
        res.innerHTML = `<div class="text-center py-10 text-sm text-slate-400 bg-slate-50 rounded-2xl border border-dashed border-slate-200">선택한 기간에 입고/반납 내역이 없습니다.</div>`;
        return;
      }

      for (const r of list) {
        const isIn = r.type === 'personal_inbound';
        const card = document.createElement('div');
        card.className = `select-none border rounded-2xl p-3.5 transition ${isIn ? 'bg-purple-50/70 border-purple-200' : 'bg-slate-50 border-slate-200'}`;
        const detailHtml = isIn
          ? `<div class="text-sm font-bold text-purple-900">18.9L 개인재고 <span class="text-purple-700">+${num(r.qty).toLocaleString()}통</span> <span class="text-xs text-slate-500">(단가 ${money(r.unitPrice)})</span></div>
             <div class="text-sm font-extrabold text-purple-700 mt-0.5">음봉 정산 ${money(r.amount)}</div>`
          : `<div class="text-xs font-bold text-slate-500 mb-1">${escapeHtml(r.warehouse || '')} 창고 반납</div>
             <div class="space-y-0.5 text-sm font-semibold text-slate-800">
               ${Object.keys(r.changes || {}).map(k => {
                 const label = (CONTAINER_TYPES.find(t => t.key === k) || {}).label || k;
                 return `<div>• ${label}: ${r.changes[k]}</div>`;
               }).join('')}
             </div>`;

        card.innerHTML = `
          <div class="flex items-center justify-between gap-2 mb-1.5">
            <div class="flex items-center gap-1.5">
              <span class="font-extrabold text-sm text-slate-900">${r.date}</span>
              ${r.editedAt ? `<span class="px-1.5 py-0.5 rounded-full bg-amber-100 text-amber-800 text-[10px] font-extrabold">수정됨</span>` : ''}
            </div>
            <div class="flex items-center gap-2">
              <span class="text-xs font-extrabold ${isIn ? 'text-purple-700' : 'text-emerald-700'}">${isIn ? '개인입고' : '공병반납'}</span>
              <button type="button" class="inb-menu-btn px-2.5 py-1 rounded-lg bg-white border border-slate-200 text-[11px] font-bold text-slate-600">관리</button>
            </div>
          </div>
          ${detailHtml}
        `;
        card.querySelector('.inb-menu-btn').onclick = (ev) => {
          ev.stopPropagation();
          openInboundMenu(r);
        };
        bindLongPress(card, () => openInboundMenu(r));
        res.appendChild(card);
      }
    }

    ihQuick.onchange = () => {
      const now = new Date();
      if (ihQuick.value === 'this') {
        ihStart.value = toLocalISO(new Date(now.getFullYear(), today.getMonth(), 1));
        ihEnd.value = toLocalISO(now);
      } else {
        ihStart.value = toLocalISO(new Date(now.getFullYear(), now.getMonth() - 1, 1));
        ihEnd.value = toLocalISO(new Date(now.getFullYear(), now.getMonth(), 0));
      }
      run();
    };
    document.getElementById('ihSearch').onclick = run;
    run();
  }

                <select id="cVisitCycle" onchange="updateVisitCycleUI()" class="w-full px-2.5 py-2 bg-white border border-slate-200 rounded-lg text-xs font-bold">
                  ${VISIT_CYCLES.map(c => `<option value="${c.value}">${c.label}</option>`).join('')}

                  <div class="grid grid-cols-7 gap-1" id="cWeekdayPicker">
                    ${WEEKDAYS.map((d, i) => `
                      <button type="button" data-day="${i}" onclick="toggleClientWeekday(this)" class="c-weekday-btn py-2 rounded-lg text-xs font-extrabold border border-slate-200 bg-white text-slate-600 transition">${d}</button>

                  <button type="button" id="cMonthTypeDateBtn" onclick="setMonthlyTypeUI('date')" class="py-1.5 rounded-md text-[11px] font-extrabold bg-indigo-600 text-white transition">📅 날짜로 지정 (매월 X일)</button>

                  <input type="number" id="cVisitMonthDay" min="1" max="31" placeholder="예: 15" class="w-full px-3 py-2 bg-white border border-slate-200 rounded-lg text-xs font-bold" />
                </div>

                <!-- 매월 N번째 요일 입력 -->
                <div id="cMonthlyWeekdaySub" class="hidden space-y-2">
                  <div>
                    <label class="text-[11px] font-bold text-slate-500 block mb-1">방문 주차 선택</label>
                    <select id="cVisitMonthWeek" class="w-full px-2.5 py-2 bg-white border border-slate-200 rounded-lg text-xs font-bold">
                      <option value="1">첫째 주 (1번째)</option>
                      <option value="2">둘째 주 (2번째)</option>
                      <option value="3">셋째 주 (3번째)</option>
                      <option value="4">넷째 주 (4번째)</option>
                      <option value="5">다섯째 주 (5번째)</option>

                  <div>
                    <label class="text-[11px] font-bold text-slate-500 block mb-1">방문 요일 선택 (복수 선택 가능)</label>
                    <div class="grid grid-cols-7 gap-1" id="cMonthlyWeekdayPicker">
                      ${WEEKDAYS.map((d, i) => `
                        <button type="button" data-mday="${i}" onclick="toggleMonthlyWeekday(this)" class="c-month-weekday-btn py-2 rounded-lg text-xs font-extrabold border border-slate-200 bg-white text-slate-600 transition">${d}</button>
                      `).join('')}
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div>
            <label class="text-[11px] font-bold text-slate-500 block mb-1">메모 / 특이사항</label>
            <textarea id="cMemo" rows="2" placeholder="비밀번호, 담당자명, 특이사항 등" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium focus:bg-white focus:border-indigo-500 outline-none"></textarea>
          </div>

          <div class="grid grid-cols-3 gap-2 pt-1">
            <button type="button" onclick="closeClientForm()" class="py-3 rounded-xl bg-slate-100 text-slate-600 font-bold text-sm">닫기</button>
            <button type="button" id="cSaveBtn" onclick="saveClientItem()" class="col-span-2 py-3 rounded-xl bg-indigo-600 text-white font-extrabold text-sm shadow-sm active:scale-95 transition">등록하기</button>

        <!-- 검색, 정렬, 보기모드, 빠른 필터 -->
        <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm p-3 space-y-2.5">

            <input type="text" id="cSearchInput" value="${escapeHtml(state.clientSearch)}" oninput="onClientSearchInput(this.value)" placeholder="🔍 거래처명, 초성(ㅎㅂ), 주소, 메모 검색" class="w-full pl-3.5 pr-9 py-2.5 bg-slate-100 border border-slate-200 rounded-xl text-sm font-medium focus:bg-white focus:border-indigo-500 outline-none" />
            <button type="button" id="cClearSearchBtn" onclick="clearClientSearch()" class="${state.clientSearch ? 'flex' : 'hidden'} absolute right-2 top-1/2 -translate-y-1/2 w-7 h-7 items-center justify-center rounded-full text-slate-400 hover:text-slate-700 font-bold text-sm">✕</button>
          </div>

          <div class="flex items-center gap-2">
            <select id="cSortSelect" onchange="onClientSortChange(this.value)" class="flex-1 px-3 py-2 bg-slate-100 border border-slate-200 rounded-xl text-xs font-bold text-slate-700 outline-none">
              <option value="name" ${state.clientSort === 'name' ? 'selected' : ''}>가나다순</option>
              <option value="course" ${state.clientSort === 'course' ? 'selected' : ''}>배송 코스순</option>
              <option value="stockDesc" ${state.clientSort === 'stockDesc' ? 'selected' : ''}>통재고 많은순</option>
              <option value="rentalDesc" ${state.clientSort === 'rentalDesc' ? 'selected' : ''}>임대 많은순</option>
              <option value="recent" ${state.clientSort === 'recent' ? 'selected' : ''}>최근 등록순</option>
            </select>
            <button type="button" id="cViewToggleBtn" onclick="toggleClientViewMode()" class="px-3.5 py-2 rounded-xl text-xs font-extrabold border transition whitespace-nowrap active:scale-95 ${
              state.clientViewMode === 'list'
                ? 'bg-indigo-600 text-white border-indigo-600'
                : 'bg-slate-100 text-slate-700 border-slate-200'
            }">
              ${state.clientViewMode === 'card' ? '≡ 간략히' : '□ 자세히'}
            </button>
          </div>

          <div class="grid grid-cols-3 gap-1.5 pt-1 border-t border-slate-100">
            <button type="button" onclick="setClientFilter('all')" class="py-1.5 rounded-full text-xs font-bold transition ${state.clientFilterMode === 'all' ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-600'}">전체 보기</button>
            <button type="button" onclick="setClientFilter('hasStock')" class="py-1.5 rounded-full text-xs font-bold transition ${state.clientFilterMode === 'hasStock' ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-600'}">📦 통재고 보유</button>
            <button type="button" onclick="setClientFilter('hasRental')" class="py-1.5 rounded-full text-xs font-bold transition ${state.clientFilterMode === 'hasRental' ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-600'}">💧 임대 보유</button>

        <ul id="cListContainer" class="space-y-2.5"></ul>
      </div>
    `;

    if (state.clientFormOpen && state.editingClientId) {
      populateClientFormForEdit(state.editingClientId);
    }

    renderClientsListOnly();
  }

  function renderClientsListOnly() {
    const listEl = document.getElementById('cListContainer');
    if (!listEl) return;

    let sumRental = 0;
    let sumStock = 0;
    state.clients.forEach(item => {
      sumRental += parseClientNum(item.rental);
      sumStock += parseClientNum(item.stock);
    });
    document.getElementById('cTotalCount').innerText = state.clients.length.toLocaleString();
    document.getElementById('cTotalRental').innerText = sumRental.toLocaleString();
    document.getElementById('cTotalStock').innerText = sumStock.toLocaleString();

    const keyword = (state.clientSearch || '').trim().toLowerCase();
    let filtered = state.clients.filter(item => {
      if (state.clientFilterMode === 'hasStock' && parseClientNum(item.stock) <= 0) return false;
      if (state.clientFilterMode === 'hasRental' && parseClientNum(item.rental) <= 0) return false;
      if (!keyword) return true;
      return (
        (item.name || '').toLowerCase().includes(keyword) ||
        getChosung(item.name || '').toLowerCase().includes(keyword) ||
        (item.addr || '').toLowerCase().includes(keyword) ||
        (item.memo || '').toLowerCase().includes(keyword) ||
        (item.phone || '').toLowerCase().includes(keyword) ||
        (item.rental || '').toLowerCase().includes(keyword)
      );
    });

    filtered.sort((a, b) => {
      if (state.clientSort === 'course') {
        const oa = a.courseOrder !== undefined ? a.courseOrder : 999999;
        const ob = b.courseOrder !== undefined ? b.courseOrder : 999999;
        if (oa !== ob) return oa - ob;
        return (a.name || '').localeCompare(b.name || '');
      }
      if (state.clientSort === 'stockDesc') return parseClientNum(b.stock) - parseClientNum(a.stock);
      if (state.clientSort === 'rentalDesc') return parseClientNum(b.rental) - parseClientNum(a.rental);
      if (state.clientSort === 'recent') return (b.id || 0) - (a.id || 0);
      return (a.name || '').localeCompare(b.name || '');
    });

    document.getElementById('cFilteredCount').innerText = filtered.length.toLocaleString();
    listEl.innerHTML = '';

    if (filtered.length === 0) {
      listEl.innerHTML = `
        <li class="text-center py-12 px-4 bg-white rounded-2xl border border-dashed border-slate-300 shadow-sm">
          <div class="text-sm font-extrabold text-slate-800">${state.clients.length === 0 ? '등록된 거래처가 없습니다' : '조건에 맞는 거래처가 없습니다'}</div>
          <div class="text-xs text-slate-400 mt-1.5 leading-relaxed">
            ${state.clients.length === 0
              ? '상단 <b>[＋ 거래처 등록]</b>으로 추가하거나<br/>하단 <b>[⚙️ 설정]</b>에서 기존 거래처 백업 파일을 불러오세요.'
              : '검색어나 필터 조건을 변경해 보세요.'}
          </div>
        </li>
      `;
      return;
    }

    const isSimple = state.clientViewMode === 'list';

    filtered.forEach(item => {
      const li = document.createElement('li');
      li.className = 'select-none bg-white rounded-2xl border border-slate-200/90 border-l-4 border-l-indigo-600 shadow-sm p-3.5 transition cursor-pointer';

      const searchQuery = escapeJsAttr(item.addr || item.name || '');
      const addrHtml = item.addr
        ? `<span class="text-xs text-slate-600 break-words flex-1">📍 ${escapeHtml(item.addr)}</span>
           <button type="button" onclick="openNaverMap(event, '${searchQuery}')" class="px-2.5 py-1 rounded-lg bg-emerald-50 text-emerald-700 border border-emerald-200 text-[11px] font-extrabold shrink-0 active:scale-95">🗺️ 네이버지도</button>`
        : `<span class="text-xs text-slate-400">📍 주소 미입력</span>`;

      const phoneHtml = item.phone
        ? `<div class="flex items-center justify-between gap-2">
             <span class="text-xs text-slate-600">📞 ${escapeHtml(item.phone)}</span>
             <a href="tel:${escapeHtml(item.phone)}" onclick="event.stopPropagation()" class="px-2.5 py-1 rounded-lg bg-indigo-50 text-indigo-700 border border-indigo-200 text-[11px] font-extrabold shrink-0">통화하기</a>
           </div>`
        : '';

      const extraBadges = [];
      if (item.paymentType && item.paymentType !== '미지정') {
        extraBadges.push(`<span class="px-2 py-0.5 rounded-md bg-amber-50 border border-amber-200 text-amber-800 text-[11px] font-bold">💳 ${escapeHtml(item.paymentType)}</span>`);
      }
      const closingBadge = formatClientClosingBadge(item);
      if (closingBadge) {
        extraBadges.push(`<span class="px-2 py-0.5 rounded-md bg-purple-50 border border-purple-200 text-purple-800 text-[11px] font-bold">📅 ${escapeHtml(closingBadge)}</span>`);
      }
      const cycleText = formatClientCycleBadge(item);
      if (cycleText) {
        extraBadges.push(`<span class="px-2 py-0.5 rounded-md bg-sky-50 border border-sky-200 text-sky-800 text-[11px] font-bold">🗓️ ${escapeHtml(cycleText)}</span>`);
      }

      li.innerHTML = `
        <div class="space-y-2">
          <div class="flex items-center justify-between gap-2">
            <span class="text-base font-extrabold text-slate-900 leading-snug break-keep">${escapeHtml(item.name)}</span>
          </div>
          <div class="flex items-center justify-end gap-1.5">
            <div class="inline-flex items-center bg-indigo-50 border border-indigo-200 rounded-lg p-0.5 gap-1" onclick="event.stopPropagation()">
              <button type="button" onclick="adjustClientStock(event, ${item.id}, -1)" class="w-7 h-7 rounded-md bg-white border border-indigo-200 text-indigo-700 font-extrabold text-sm flex items-center justify-center active:scale-90">－</button>
              <span class="text-xs font-extrabold text-indigo-700 px-1.5 whitespace-nowrap">재고 ${parseClientNum(item.stock)}</span>
              <button type="button" onclick="adjustClientStock(event, ${item.id}, 1)" class="w-7 h-7 rounded-md bg-white border border-indigo-200 text-indigo-700 font-extrabold text-sm flex items-center justify-center active:scale-90">＋</button>
            </div>
            <button type="button" onclick="event.stopPropagation(); openClientStatementModal(${item.id})" class="px-2.5 py-1.5 rounded-lg bg-emerald-50 border border-emerald-200 text-emerald-700 text-xs font-extrabold active:scale-95">📜 내역</button>
            <button type="button" onclick="openClientActionModal(event, ${item.id})" class="px-2.5 py-1.5 rounded-lg bg-slate-100 border border-slate-200 text-slate-600 text-xs font-bold active:scale-95">관리</button>
          </div>
        </div>

        <div class="c-item-details ${isSimple ? 'hidden' : 'block'} mt-3 pt-2.5 border-t border-slate-100 space-y-2">
          <div class="flex items-center justify-between gap-2">${addrHtml}</div>
          ${phoneHtml}
          <div class="flex flex-wrap gap-1.5 pt-0.5">

  function formatClientClosingBadge(item) {
    if (!item || !item.closingDay || item.closingDay === 'none') return '';

  // 마감일 기준 정산 시작일~종료일 계산 (year, month는 0-indexed 마감 기준월)
  function getBillingCycleRange(closingDay, year, month) {
    if (!closingDay || closingDay === 'none' || closingDay === 'eom') {
      const start = toLocalISO(new Date(year, month, 1));
      const end = toLocalISO(new Date(year, month + 1, 0));
      return { start, end };
    }
    const dayNum = num(closingDay);
    const prevLastDay = new Date(year, month, 0).getDate();
    const startDay = Math.min(dayNum + 1, prevLastDay + 1);
    const startDate = new Date(year, month - 1, startDay);
    const curLastDay = new Date(year, month + 1, 0).getDate();
    const endDate = new Date(year, month, Math.min(dayNum, curLastDay));
    return {
      start: toLocalISO(startDate),
      end: toLocalISO(endDate)
    };
  }

  function formatClientCycleBadge(item) {
    if (!item || !item.visitCycle || item.visitCycle === 'irregular') return '';
    if (item.visitCycle === 'monthly') {
      if (item.visitMonthlyType === 'weekday') {
        const weekMap = { '1': '첫째', '2': '둘째', '3': '셋째', '4': '넷째', '5': '다섯째', 'last': '마지막' };
        const wLabel = weekMap[String(item.visitMonthWeek || '1')] || '';
        const days = Array.isArray(item.visitMonthWeekdays) && item.visitMonthWeekdays.length
          ? item.visitMonthWeekdays.map(d => WEEKDAYS[d]).join('·')
          : '';
        return days ? `매월 ${wLabel} ${days}` : `매월 ${wLabel} 주`;
      }
      return item.visitMonthDay ? `매월 ${item.visitMonthDay}일` : '매월';
    }
    const prefix = item.visitCycle === 'biweekly' ? '격주' : '매주';
    const days = Array.isArray(item.visitDays) && item.visitDays.length
      ? item.visitDays.map(d => WEEKDAYS[d]).join('·')
      : '';
    return days ? `${prefix} ${days}` : prefix;
  }
